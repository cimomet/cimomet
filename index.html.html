<title>Cimomet — Seguimiento de fabricación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:     #111318;
  --bg2:    #181b22;
  --bg3:    #1e2230;
  --bg4:    #252a3a;
  --bg5:    #2c3248;
  --border: rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.11);
  --border3:rgba(255,255,255,0.18);
  --text:   #eef0f5;
  --text2:  #8b91a8;
  --text3:  #4e546a;
  --accent: #4f8ef7;
  --accent2:#7eb8ff;
  --red:    #f05e6a;
  --amber:  #f5a623;
  --green:  #3ecf7a;
  --blue:   #4f8ef7;
  --purple: #9b7ff5;
  --teal:   #2dd4bf;
  --font:   'DM Sans',  sans-serif;
  --mono:   'DM Mono',  monospace;
  --r:  6px;
  --r2: 10px;
  --r3: 14px;
  --shadow: 0 4px 24px rgba(0,0,0,0.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;}
input,select,textarea,button{font-family:var(--font);font-size:14px;}
button{cursor:pointer;}
input,select,textarea{
  background:var(--bg3);border:1.5px solid var(--border2);color:var(--text);
  border-radius:var(--r);padding:9px 12px;width:100%;outline:none;
  transition:border-color 0.15s, box-shadow 0.15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(79,142,247,0.12);
}
select option{background:var(--bg3);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--border3);}
#app{min-height:100vh;}

/* ── SHELL ── */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── GLOBAL TOPBAR ── */
.g-topbar{
  display:flex;align-items:center;
  padding:0 1.5rem;height:54px;flex-shrink:0;
  background:var(--bg2);border-bottom:1.5px solid var(--border);
  gap:8px;position:sticky;top:0;z-index:50;
}
.g-topbar-row1{display:contents;}
.g-topbar-row2{display:flex;align-items:center;flex:1;overflow-x:auto;scrollbar-width:none;order:2;}
.g-topbar-row2::-webkit-scrollbar{display:none;}
.g-topbar-logo{display:contents;}
.g-topbar-controls{display:flex;align-items:center;gap:6px;flex-shrink:0;order:3;position:relative;}
.inspector-session-badge{font-family:var(--mono);font-size:11px;color:var(--green);padding:4px 8px;background:rgba(62,207,122,0.1);border:1px solid rgba(62,207,122,0.3);border-radius:20px;cursor:pointer;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
.topbar-mobile-menu{display:none;position:relative;}
.topbar-mobile-menu-dropdown{position:absolute;top:100%;right:0;margin-top:4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 6px 24px rgba(0,0,0,0.25);min-width:200px;z-index:100;overflow:hidden;}
.topbar-mobile-menu-item{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-family:var(--font);font-size:14px;color:var(--text);transition:background 0.1s;}
.topbar-mobile-menu-item:hover{background:var(--bg3);}
.topbar-mobile-menu-item .rdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.topbar-mobile-menu-divider{height:1px;background:var(--border);margin:0;}
.g-logo{
  display:flex;align-items:center;gap:10px;
  cursor:pointer;text-decoration:none;flex-shrink:0;
  border:none;background:none;padding:0;
}
.g-logo-icon{
  width:30px;height:30px;border-radius:var(--r);
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;
  flex-shrink:0;
}
.g-logo-name{font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--text);}

/* OT breadcrumb + nav */
.g-nav{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
.g-nav::-webkit-scrollbar{display:none;}
.g-sep{color:var(--text3);font-size:14px;margin:0 2px;flex-shrink:0;}
.g-ot-name{
  font-family:var(--mono);font-size:12px;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;
  flex-shrink:1;
}
.g-nav-btn{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;
  font-size:13px;font-weight:500;
  border:none;background:none;color:var(--text2);
  cursor:pointer;transition:all 0.12s;white-space:nowrap;flex-shrink:0;
}
.g-nav-btn:hover{background:var(--bg3);color:var(--text);}
.g-nav-btn.on{background:var(--bg4);color:var(--text);}
.g-nav-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--border3);}
.g-nav-btn.on .dot{background:var(--accent);}

/* Role selector dropdown */
.g-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.role-dropdown{position:relative;}
.role-dropdown-btn{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px 5px 10px;border-radius:20px;
  border:1.5px solid var(--border2);background:var(--bg3);
  color:var(--text);cursor:pointer;font-size:13px;font-weight:500;
  transition:all 0.12s;
}
.role-dropdown-btn:hover{border-color:var(--accent);}
.role-dropdown-menu{
  display:none;position:absolute;right:0;top:calc(100% + 6px);
  background:var(--bg2);border:1.5px solid var(--border2);
  border-radius:var(--r2);padding:4px;min-width:160px;
  box-shadow:var(--shadow);z-index:200;
}
.role-dropdown-menu.open{display:block;}
.role-menu-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 12px;border-radius:var(--r);
  color:var(--text2);font-size:13px;cursor:pointer;
  border:none;background:none;width:100%;text-align:left;
  transition:all 0.12s;
}
.role-menu-item:hover{background:var(--bg3);color:var(--text);}
.role-menu-item.on{background:var(--bg4);color:var(--text);font-weight:500;}
.rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.badge-role{
  display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;
  padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.06em;
}
/* Calidad without inspector session - block all actions */
body.calidad-sin-inspector .content [data-act],
body.calidad-sin-inspector .content .abtn:not([data-nav]):not([data-adminview]),
body.calidad-sin-inspector .content .btn-ok,
body.calidad-sin-inspector .content .btn-approve,
body.calidad-sin-inspector .content .btn-reject,
body.calidad-sin-inspector .content .btn-partial{
  pointer-events:none!important;opacity:0.35!important;cursor:not-allowed!important;
}
.badge-admin{background:rgba(200,154,74,0.15);color:var(--amber);}

/* Read-only mode for control role */
body.role-control .content input:not([readonly]):not([type="search"]),
body.role-control .content textarea,
body.role-control .content select,
body.archived-ot .content input:not([readonly]):not([type="search"]),
body.archived-ot .content textarea,
body.archived-ot .content select{
  pointer-events:none;background:var(--bg3)!important;opacity:0.7;
}
body.role-control .abtn:not([data-nav]):not([data-adminview]):not(#btn-close):not(#btn-role-confirm):not(#btn-role-cancel),
body.role-control .content .btn-ok,
body.role-control .content .btn-reject,
body.role-control .content .btn-approve,
body.role-control .content .btn-partial,
body.role-control .content .btn-anular,
body.role-control .content .btn-danger,
body.role-control .upload-zone,
body.role-control .content [data-act],
body.role-control .content [data-applyall],
body.role-control .content [data-calapplyall],
body.role-control .content [data-del-row],
body.role-control .content [data-lote-asignar],
body.role-control .content [data-lote-asignar-sub],
body.role-control .content [data-lote-accion],
body.role-control .content [data-lote-pos-est],
body.role-control .content [data-lote-pos-obs],
body.role-control .content [data-lote-sub-est],
body.role-control .content [data-lote-sub-obs],
body.role-control #btn-add-row,
body.role-control #btn-publish,
body.role-control #btn-reset,
body.role-control #btn-new-ot,
body.role-control #btn-delete-ot,
body.archived-ot .content .abtn:not(#btn-archive-ot):not(#btn-unarchive-ot):not(#btn-close):not([data-home-tab]),
body.archived-ot .content .btn-ok,
body.archived-ot .content .btn-reject,
body.archived-ot .content .btn-approve,
body.archived-ot .content .btn-partial,
body.archived-ot .content .btn-anular,
body.archived-ot .content .btn-danger,
body.archived-ot .upload-zone,
body.archived-ot .content [data-act],
body.archived-ot .content [data-applyall],
body.archived-ot .content [data-calapplyall],
body.archived-ot .content [data-del-row],
body.archived-ot .content [data-lote-asignar],
body.archived-ot .content [data-lote-asignar-sub],
body.archived-ot .content [data-lote-accion]:not([data-lote-accion="obs"]),
body.archived-ot .content [data-lote-pos-est],
body.archived-ot .content [data-lote-sub-est],
body.archived-ot #btn-add-row,
body.archived-ot #btn-publish,
body.archived-ot #btn-reset{
  pointer-events:none!important;opacity:0.4!important;cursor:not-allowed!important;
}
.badge-ing {background:rgba(155,127,245,0.15);color:var(--purple);}
.badge-prod{background:rgba(79,142,247,0.15);color:var(--blue);}
.badge-cal {background:rgba(62,207,122,0.15);color:var(--green);}
.g-theme-btn{
  background:none;border:1.5px solid var(--border2);border-radius:20px;
  color:var(--text2);cursor:pointer;padding:5px 10px;font-size:13px;
  transition:all 0.12s;
}
.g-theme-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.25rem 2rem;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:var(--bg2);
}
.topbar-title{font-size:18px;font-weight:600;letter-spacing:-0.01em;}
.topbar-meta{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:3px;}
.content{padding:1.75rem 2rem;flex:1;}

/* mobile topbar override */
.mobile-topbar{
  display:none;
  align-items:center;justify-content:space-between;
  padding:0.875rem 1rem;
  background:var(--bg2);border-bottom:1px solid var(--border);
  flex-shrink:0;
}


/* ── METRICS ── */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:1.75rem;}
.metric-card{
  background:var(--bg2);
  border:1.5px solid var(--border);
  border-radius:var(--r2);
  padding:1.25rem 1.25rem 1rem;
  position:relative;overflow:hidden;
  transition:border-color 0.15s;
}
.metric-card:hover{border-color:var(--border2);}
.metric-label{
  font-family:var(--mono);font-size:10px;color:var(--text3);
  text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;
}
.metric-val{font-size:32px;font-weight:300;line-height:1;}
.metric-val.warn  {color:var(--amber);}
.metric-val.danger{color:var(--red);}
.metric-val.ok    {color:var(--green);}

/* ── FILTERS ── */
.filter-bar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:0.875rem 0;margin-bottom:1.25rem;
  border-bottom:1px solid var(--border);
}
.filter-group{display:flex;gap:4px;align-items:center;}
.filter-sep{width:1px;height:20px;background:var(--border2);margin:0 8px;}
.filter-lbl{
  font-family:var(--mono);font-size:10px;color:var(--text3);
  text-transform:uppercase;letter-spacing:0.1em;margin-right:4px;
}
.fbtn{
  font-size:12px;padding:5px 12px;border-radius:20px;
  border:1.5px solid transparent;background:transparent;
  color:var(--text2);transition:all 0.12s;font-family:var(--mono);
}
.fbtn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2);}
.fbtn.on{
  background:rgba(79,142,247,0.12);
  border-color:rgba(79,142,247,0.4);
  color:var(--accent2);font-weight:500;
}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--r2);border:1.5px solid var(--border);}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl thead{background:var(--bg2);}
.tbl thead th{
  text-align:left;padding:11px 14px;
  font-family:var(--mono);font-size:10px;color:var(--text3);
  text-transform:uppercase;letter-spacing:0.1em;
  border-bottom:1.5px solid var(--border2);font-weight:500;white-space:nowrap;
}
.tbl tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s;}
.tbl tbody tr:last-child{border-bottom:none;}
.tbl tbody tr:hover{background:var(--bg2);}
.tbl tbody td{padding:11px 14px;vertical-align:middle;}
.tbl tbody td.mono{font-family:var(--mono);font-size:11px;color:var(--text2);}

/* ── CHIPS ── */
.chip{
  display:inline-flex;align-items:center;
  font-family:var(--mono);font-size:10px;font-weight:500;
  padding:3px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;
}
.chip-pending  {background:rgba(139,145,168,0.1); color:var(--text2);}
.chip-progress {background:rgba(245,166,35,0.12); color:var(--amber);}
.chip-done     {background:rgba(79,142,247,0.12);  color:var(--accent2);}
.chip-rejected {background:rgba(240,94,106,0.12);  color:var(--red);}
.chip-cmmt     {background:rgba(79,142,247,0.1);   color:var(--accent2);}
.chip-ext      {background:rgba(155,127,245,0.1);  color:var(--purple);}
.chip-empty    {background:rgba(78,84,106,0.1);    color:var(--text3);}

/* ── PIPELINE ── */
.pipeline{display:flex;align-items:center;gap:3px;}
.pdot{
  width:28px;height:28px;border-radius:8px;

  font-family:var(--mono);font-size:8px;font-weight:600;
  border:1.5px solid var(--border2);color:var(--text3);

  transition:all 0.12s;
}

/* ── HISTORY ── */
.history-list{

.history-item{padding:10px 12px;border-bottom:1px solid var(--border);}

.history-meta{

.history-text{font-size:13px;color:var(--text);line-height:1.45;}

  text-align:center;padding:1.25rem;
}
.history-tag{
  font-family:var(--mono);font-size:9px;
  padding:2px 6px;border-radius:20px;

}
.tag-partial {background:rgba(79,142,247,0.12); color:var(--accent2);}
.tag-approved{background:rgba(62,207,122,0.12); color:var(--green);}

/* ── ACTION BUTTONS ── */
.abtn{
  font-size:11px;font-family:var(--mono);

  background:transparent;color:var(--text2);
  transition:all 0.12s;white-space:nowrap;font-weight:500;
}
.abtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,0.06);}
.abtn:disabled{opacity:0.25;cursor:not-allowed;}
.abtn-disabled{opacity:0.25;cursor:not-allowed;pointer-events:none;}
.abtn.corr{border-color:rgba(245,166,35,0.35);color:var(--amber);}

.expand-btn{
  background:none;border:none;

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;

  background:var(--bg2);

.btn-ok:disabled{opacity:0.3;cursor:not-allowed;}
.btn-approve{padding:9px 18px;background:rgba(62,207,122,0.15);border:1.5px solid rgba(62,207,122,0.35);border-radius:var(--r);color:var(--green);font-size:13px;font-weight:600;transition:all 0.12s;}

body.light {
  --bg:     #f4f5f8;
  --bg2:    #ffffff;
  --bg3:    #eef0f5;
  --bg4:    #e4e7ef;
  --bg5:    #d8dce8;

}
body.light input,

/* ── THEME TOGGLE ── */
.theme-toggle {
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;margin-top:4px;
  cursor:pointer;
}
.toggle-track {
  width:38px;height:22px;border-radius:11px;
  background:var(--bg4);border:1.5px solid var(--border2);
  position:relative;transition:background 0.2s,border-color 0.2s;
  flex-shrink:0;
}
.toggle-track.on { background:rgba(79,142,247,0.25);border-color:rgba(79,142,247,0.5); }
body.light .toggle-track.on { background:rgba(59,126,240,0.2);border-color:rgba(59,126,240,0.5); }
.toggle-thumb {
  position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:var(--text3);transition:transform 0.2s,background 0.2s;
}
.toggle-track.on .toggle-thumb { transform:translateX(16px);background:var(--accent); }
.toggle-label { font-size:13px;color:var(--text2); }

// helper: count how much "work" exists in OTs (positions + avances + inspections + lotes)
function countOtsWorkload(ots){
  let n = 0;
  if(!Array.isArray(ots)) return 0;
  ots.forEach(ot=>{
    if(!ot) return;
    n += (ot.positions?.length||0);
    n += (ot.draftPositions?.length||0);
    n += Object.keys(ot.prodData||{}).length * 3;
    n += Object.keys(ot.calExtData||{}).length * 3;
    n += (ot.lotes?.length||0) * 5;
    // count inspection actions stored in process history
    (ot.positions||[]).forEach(p=>{
      (p.processes||[]).forEach(pr=>{ n += (pr.history?.length||0); if(pr.status&&pr.status!=='pending') n++; });
      (p.subs||[]).forEach(s=>{
        (s.processes||[]).forEach(pr=>{ n += (pr.history?.length||0); if(pr.status&&pr.status!=='pending') n++; });
      });
    });
  });
  return n;
}

let _lastPulledStamp = 0;
let _lastPushedAt = 0;

async function pushToSupabase(){
  // sync OTs and inspectores; role/theme are per-device
  const localWork = countOtsWorkload(state.ots);
  // SAFETY: check remote first; if remote has significantly more data than local, do NOT overwrite
  // (this can happen if local was just initialized or migration corrupted data)
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/ots?id=eq.${OT_ROW_ID}&select=data,updated_at`, {
      headers: SUPA_HEADERS
    });
    if(res.ok){
      const rows = await res.json();
      if(rows.length > 0){
        const remote = rows[0].data;
        const remoteWork = countOtsWorkload(remote?.ots);
        // if remote has substantially more work than local, suspect data loss locally — block push
        // threshold: remote at least 50 units more AND local less than 50% of remote
        if(remoteWork > 50 && localWork < remoteWork * 0.5){
          console.warn('[Cimomet] Push BLOQUEADO: el remoto tiene', remoteWork, 'datos vs', localWork, 'local. Evitando borrado accidental.');
          // try to recover by pulling
          state.ots = remote.ots;
          if(Array.isArray(remote.inspectores) && remote.inspectores.length>0){
            state.inspectores = remote.inspectores;
          }
          state.ots.forEach(ot=>migrateProdData(ot));
          savePrefs(); render();
          return;
        }
      }
    }
  } catch(e){ /* ignore — continue with normal push */ }

  const payload = {
    ots: state.ots,
    inspectores: state.inspectores||[],
  };
  try{
    await fetch(`${SUPA_URL}/rest/v1/ots`, {
      method: 'POST',
      headers: { ...SUPA_HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ id: OT_ROW_ID, data: payload, updated_at: new Date().toISOString() })
    });
    _lastPushedAt = Date.now();
  } catch(e){ console.warn('Supabase save error:', e); }
}

async function pullFromSupabase(){
  try{
    const res = await fetch(`${SUPA_URL}/rest/v1/ots?id=eq.${OT_ROW_ID}&select=data,updated_at`, {
      headers: SUPA_HEADERS
    });
    if(res.ok){
      const rows = await res.json();
      if(rows.length > 0){
        if(rows[0].updated_at) _lastPulledStamp = new Date(rows[0].updated_at).getTime();
        return rows[0].data;
      }
    }
  } catch(e){ console.warn('Supabase load error:', e); }
  return null;
}

// helpers
function ensureSubs(positions){
  let changed=false;
  positions.forEach(pos=>{
    const qty=Number(pos.qty)||0;
    if(qty>1 && (!pos.subs || pos.subs.length===0)){
      pos.subs=Array.from({length:qty},(_,i)=>({
        subId:`${pos.id}-${i+1}`,
        processes:mkProcs(),
        activeProc:0,
      }));
      changed=true;
    }
  });
  return changed;
}

function activeOt(){ return state.ots.find(o=>o.id===state.activeOtId)||null; }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// Find a position by key — first tries uid, then pos.id (fallback for legacy data)
function findPos(ot, key){
  if(!ot||!ot.positions) return null;
  return ot.positions.find(p=>p.uid===key) || ot.positions.find(p=>p.id===key) || null;
}

// Generate unique key for prodData: uses the position's uid (unique per row in packing list)
// Falls back to pos.id + prioridad for older data
function prodKey(pos){
  if(pos.uid) return pos.uid;
  return String(pos.id||'') + (pos.prioridad!==''&&pos.prioridad!==undefined?'__P'+pos.prioridad:'');
}

// Migrate prodData from old keys (just pos.id) to composite keys (pos.id__Pprio)
// when there are multiple positions sharing the same pos.id in different prioridades
function migrateProdData(ot){
  if(!ot||!ot.positions) return;
  // Ensure every position has a uid
  ot.positions.forEach(p=>{
    if(!p.uid) p.uid=genId();
  });
  // Link draftPositions to positions by index order — for OTs published before uid existed
  // both arrays were created in the same order, so we can match by index
  if(Array.isArray(ot.draftPositions)){
    ot.draftPositions.forEach((dp, i)=>{
      if(!dp.uid){
        // try to find matching position by pos id + qty + prioridad at same index
        const posAtIdx=ot.positions[i];
        if(posAtIdx && posAtIdx.id===dp.pos){
          dp.uid=posAtIdx.uid;
        } else {
          dp.uid=genId();
        }
      }
    });
  }
  // migrate prodData and calExtData
  const byId={};
  ot.positions.forEach(p=>{
    if(!byId[p.id]) byId[p.id]=[];
    byId[p.id].push(p);
  });
  Object.entries(byId).forEach(([id, positions])=>{
    if(positions.length<=1) return;
    // prodData
    if(ot.prodData){
      const oldData=ot.prodData[id];
      if(oldData){
        positions.forEach(p=>{
          const newKey=prodKey(p);
          if(newKey!==id && !ot.prodData[newKey]){
            ot.prodData[newKey]={...oldData};
          }
        });
      }
    }
    // calExtData
    if(ot.calExtData){
      const oldExt=ot.calExtData[id];
      if(oldExt){
        positions.forEach(p=>{
          const newKey=prodKey(p);
          if(newKey!==id && !ot.calExtData[newKey]){
            ot.calExtData[newKey]={...oldExt};
          }
        });
      }
    }
  });
}

function getOverall(pos){
  // done if all 4 processes approved
  if(pos.processes.every(p=>p.status==='approved')) return 'done';
  // in_progress if any process has been touched
  if(pos.processes.some(p=>p.assignee||p.status==='approved'||p.status==='rejected')) return 'in_progress';
  return 'pending';
}
function normLugar(s){
  const u=String(s||'').toUpperCase().trim();
  return u.includes('CMMT')?'cmmt': u?'ext':'';
}
function calcMetrics(positions){
  return {
    total:positions.length,
    prog: positions.filter(p=>getOverall(p)==='in_progress').length,
    rej:  0,
    ok:   positions.filter(p=>getOverall(p)==='done').length,
  };
}
// Only restriction: Calidad cannot approve Soldadura (idx=1) without Armado (idx=0) approved
function calCanInspect(pos, procIdx){
  if(procIdx===1) return pos.processes[0].status==='approved';
  return true;
}
function chipCls(s){ return {pending:'chip-pending',in_progress:'chip-progress',done:'chip-done',rejected:'chip-rejected'}[s]||'chip-pending'; }
function chipLbl(s){ return {pending:'Pendiente',in_progress:'En proceso',done:'Despachado',rejected:'Rechazado'}[s]||s; }

const CAL_PROCS=['Armado','Soldadura','Pintura'];
const CAL_SHORT=['CD','AP','PINT'];

function renderPipeline(processes, shortNames, loteCtx){
  // loteCtx (optional): {lote, posId, subId|null, otLotes} for computing PINT (i=2) status from lote
  return shortNames.map((sh,i)=>{
    const proc=processes[i];
    let cls='';
    let tooltip = sh+': '+(proc.obs||'');
    // Override PINT (i=2) status based on lote membership and lote state
    if(i===2 && loteCtx){
      const {lote, posId, subId, otLotes, posIdAlt, subIds} = loteCtx;
      // Build candidate posIds to search by (uid + pos.id as fallback)
      const posCandidates = [posId];
      if(posIdAlt && posIdAlt!==posId) posCandidates.push(posIdAlt);

      // SPECIAL CASE: parent position with subs but not assigned whole — aggregate from subs
      if(!subId && subIds && subIds.length>0){
        // check each sub's effective state
        const subStates = subIds.map(sid=>{
          // find lote for this specific sub
          let sLote = (otLotes||[]).find(l=>posCandidates.some(pid=>(l.subPosIds||[]).includes(`${pid}::${sid}`)));
          if(!sLote){
            sLote = (otLotes||[]).find(l=>posCandidates.some(pid=>(l.posIds||[]).includes(pid)));
          }
          if(!sLote) return 'pendiente';
          if(sLote.estado==='rechazado') return 'rechazado';
          if(sLote.estado!=='aprobado') return 'pendiente';
          // check if this sub has an explicit state (sub-level overrides parent-level)
          for(const pid of posCandidates){
            const spidState = sLote.subPosEstados?.[`${pid}::${sid}`];
            if(spidState==='rechazado') return 'rechazado';
            if(spidState==='aprobado') return 'aprobado';
          }
          // no explicit sub state — fall back to parent
          for(const pid of posCandidates){
            if(sLote.posEstados?.[pid]==='rechazado') return 'rechazado';
            if(sLote.posEstados?.[pid]==='aprobado') return 'aprobado';
          }
          return 'aprobado'; // lote aprobado without explicit state
        });
        if(subStates.some(s=>s==='rechazado')){
          cls='rej';
          tooltip='PINT: alguna unidad rechazada';
        } else if(subStates.every(s=>s==='aprobado')){
          cls='ok';
          tooltip='PINT: todas aprobadas';
        } else if(subStates.some(s=>s==='aprobado')){
          cls='wip';
          tooltip='PINT: en proceso';
        } else {
          cls='';
          tooltip='PINT: sin lote';
        }
        return `<div class="pdot ${cls}" title="${esc(tooltip)}">${sh}</div>`+(i<shortNames.length-1?'<span class="parrow">›</span>':'');
      }

      const effectiveLote = lote || (otLotes||[]).find(l=>{
        if(subId){
          // check sub individually with any candidate, OR parent whole assignment with any candidate
          return posCandidates.some(pid=>(l.subPosIds||[]).includes(`${pid}::${subId}`))
              || posCandidates.some(pid=>(l.posIds||[]).includes(pid));
        } else {
          return posCandidates.some(pid=>(l.posIds||[]).includes(pid));
        }
      });
      if(!effectiveLote){
        cls=''; // gray / pending
        tooltip='PINT: sin lote';
      } else if(effectiveLote.estado==='rechazado'){
        cls='rej';
        tooltip=`PINT: lote ${effectiveLote.nombre} rechazado`;
      } else if(effectiveLote.estado==='aprobado'){
        // helper to try multiple keys
        const tryKeys = (obj, keys) => {
          for(const k of keys){ if(obj && obj[k]!==undefined) return obj[k]; }
          return undefined;
        };
        // check per-position state inside the approved lote
        let posState=null;
        let posObs='';
        if(subId){
          const spidCandidates = posCandidates.map(pid=>`${pid}::${subId}`);
          posState = tryKeys(effectiveLote.subPosEstados, spidCandidates) || null;
          posObs = tryKeys(effectiveLote.subPosObs, spidCandidates) || '';
        } else {
          if(effectiveLote.subPosEstados){
            const subKeys = Object.keys(effectiveLote.subPosEstados).filter(k=>posCandidates.some(pid=>k.startsWith(pid+'::')));
            if(subKeys.length>0){
              const states = subKeys.map(k=>effectiveLote.subPosEstados[k]);
              if(states.some(s=>s==='rechazado')) posState='rechazado';
              else if(states.every(s=>s==='aprobado')) posState='aprobado';
              else posState=null;
            } else {
              posState = tryKeys(effectiveLote.posEstados, posCandidates) || null;
            }
          } else {
            posState = tryKeys(effectiveLote.posEstados, posCandidates) || null;
          }
          posObs = tryKeys(effectiveLote.posObs, posCandidates) || '';
        }
        if(posState==='rechazado'){
          cls='rej';
          tooltip=`PINT: posición rechazada en lote ${effectiveLote.nombre}`;
        } else if(posState==='aprobado'){
          cls='ok';
          tooltip=`PINT: aprobado en lote ${effectiveLote.nombre}`;
        } else if(posObs && String(posObs).trim()){
          cls='wip';
          tooltip=`PINT: observación pendiente en lote ${effectiveLote.nombre} — "${posObs}"`;
        } else {
          cls='ok';
          tooltip=`PINT: aprobado en lote ${effectiveLote.nombre}`;
        }
      } else {
        // lote pending → show as assigned (in progress)
        cls='wip';
        tooltip=`PINT: asignado al lote ${effectiveLote.nombre}`;
      }
    } else {
      if(proc.status==='approved') cls='ok';
      else if(proc.status==='rejected') cls='rej';
      else if(proc.history&&proc.history.length>0) cls='partial';
      else if(proc.assignee) cls='wip';
    }
    return `<div class="pdot ${cls}" title="${esc(tooltip)}">${sh}</div>`+(i<shortNames.length-1?'<span class="parrow">›</span>':'');
  }).join('');
}

function calActionBtns(pos, processes, posId, subIdx){
  // posId for modal, subIdx = sub index (null if main pos qty=1)
  const overall = processes.every(p=>p.status==='approved')?'done':
    processes.some(p=>p.assignee||p.status==='approved'||p.status==='rejected')?'in_progress':'pending';
  if(overall==='done') return '';
  const sidx = subIdx!==null?`data-subidx="${subIdx}"`:'';
  return CAL_PROCS.map((n,i)=>{
    // PINT (i=2) is managed only via Pintura lotes — no inspect/modify buttons here
    if(i===2) return '';
    const proc=processes[i];
    const isInspected=proc.status==='approved'||proc.status==='rejected';
    const canInsp=calCanInspect({processes},i);
    if(isInspected){
      return `<button type="button" class="abtn corr" data-act="modificar" data-id="${esc(posId)}" data-pidx="${i}" ${sidx} title="Mod. ${CAL_SHORT[i]}">Mod. ${CAL_SHORT[i]}</button>`;
    } else {
      return `<button type="button" class="abtn${canInsp?'':' abtn-disabled'}" data-act="inspect-proc" data-id="${esc(posId)}" data-pidx="${i}" ${sidx} title="${!canInsp?'Requiere armado aprobado':CAL_SHORT[i]}">${CAL_SHORT[i]}</button>`;
    }
  }).join('');
}

// Track navigation state for browser back button support
let _isPopState = false;
let _lastNavKey = null;

function navKey(){
  return JSON.stringify({
    v: state.view,
    ot: state.activeOtId,
    m: state.modal?.type||null,
    mid: state.modal?.posId||state.modal?.loteId||null,

  });

function maybePushNavState(){
  if(_isPopState) return;
  const k = navKey();
  if(k === _lastNavKey) return;
  _lastNavKey = k;
  const snapshot = {
    view: state.view,
    activeOtId: state.activeOtId,
    modal: state.modal ? JSON.parse(JSON.stringify(state.modal)) : null,
    homeTab: state.homeTab,
    adminView: state.adminView,
  };
  history.pushState(snapshot, '', '');
}

window.addEventListener('popstate', (e)=>{
  _isPopState = true;
  if(e.state){
    state.view        = e.state.view;
    state.activeOtId  = e.state.activeOtId;
    state.modal       = e.state.modal;
    state.homeTab     = e.state.homeTab||'activas';
    state.adminView   = e.state.adminView||'produccion';
    state.mobileMenuOpen = false;
  } else {
    state.modal=null;
    state.view='home';
    state.activeOtId=null;
    state.mobileMenuOpen=false;
  }
  _lastNavKey = navKey();
  render();
  _isPopState = false;
});

function render(){
  maybePushNavState();
  try{
    // apply theme
    document.body.classList.toggle('light', state.theme==='light');
    document.body.classList.toggle('role-control', state.role==='control');
    document.body.classList.toggle('calidad-sin-inspector', state.role==='calidad' && !state.inspectorActivo);
    const _ot=activeOt();
    document.body.classList.toggle('archived-ot', !!(_ot && _ot.archived));
    // preserve scroll positions across re-renders
    const main=document.querySelector('.main');
    const window_y=window.scrollY;
    const main_y=main?main.scrollTop:0;
    document.getElementById('app').innerHTML=renderShell();
    bind();
    const mainAfter=document.querySelector('.main');
    if(mainAfter) mainAfter.scrollTop=main_y;
    window.scrollTo(0, window_y);
  }catch(err){
    console.error('render error:',err);
    document.getElementById('app').innerHTML=`<div style="padding:2rem;color:red;font-family:monospace">Error: ${err.message}<br><pre>${err.stack}</pre></div>`;
  }
}

function currentView(){
  const role=state.role;
  if(!state.activeOtId) return 'home';
  if(!state.view) return 'home';
  if(state.view==='home') return 'home';
  if(role==='ingenieria'){
    if(state.view==='tablero'||state.view==='posiciones') return 'packing';
    return state.view;
  }
  if(state.view==='packing'&&role!=='admin'&&role!=='ingenieria'&&role!=='control') return 'tablero';
  return state.view;
}

function renderView(ot,cv){
  if(cv==='home')       return renderHomeView();
  if(cv==='packing')    return renderPackingView(ot);
  if(cv==='tablero')    return renderTableroView(ot);
  if(cv==='posiciones') return renderPosView(ot);
  if(cv==='pintura')    return renderPinturaView(ot);
  return '';
}

// treat admin as having all role permissions
function roleIs(r){ return state.role===r||state.role==='admin'||state.role==='control'; }

// ── HOME ──────────────────────────────────────────────────
function renderHomeView(){
  const role=state.role;
  const ri=ROLES.find(r=>r.id===role);
  const showArchived=state.homeTab==='archivadas';

  const otsFiltered=state.ots.filter(o=>showArchived?o.archived:!o.archived);
  const activeCount=state.ots.filter(o=>!o.archived).length;
  const archivedCount=state.ots.filter(o=>o.archived).length;

  const otCards=otsFiltered.length
    ? [...otsFiltered].sort((a,b)=>{
        const aKey=(a.info.ot||'')+(a.info.proyecto||'');
        const bKey=(b.info.ot||'')+(b.info.proyecto||'');
        return aKey.localeCompare(bKey,'es',{numeric:true});
      }).map(o=>{
        const positions=o.positions||[];
        const pi=o.info;

        // prod stats
        const prodData=o.prodData||{};
        const totalKg=positions.reduce((a,p)=>a+(Number(p.pesoTotal)||0),0);
        const armadoKg=positions.reduce((a,p)=>{
          const pd=prodData[prodKey(p)]||{};
          return a+(Number(p.pesoTotal)||0)*(Number(pd.avanceArmado)||0)/100;
        },0);
        const soldadoKg=positions.reduce((a,p)=>{
          const pd=prodData[prodKey(p)]||{};
          return a+(Number(p.pesoTotal)||0)*(Number(pd.avanceSoldadura)||0)/100;
        },0);

        // cal stats
        const units=[];
        positions.forEach(pos=>{
          const posKey=pos.uid||pos.id;
          if(pos.subs&&pos.subs.length>0){
            pos.subs.forEach(sub=>units.push({processes:sub.processes, posKey, posIdAlt:pos.id, subId:sub.subId}));
          } else {
            units.push({processes:pos.processes, posKey, posIdAlt:pos.id, subId:null});
          }
        });
        // helper: PINT state from lotes
        const otLotes=o.lotes||[];
        function pintStateHome(posKey, posIdAlt, subId){
          const cand=[posKey];
          if(posIdAlt && posIdAlt!==posKey) cand.push(posIdAlt);
          let lote;
          if(subId){
            lote = otLotes.find(l=>cand.some(pid=>(l.subPosIds||[]).includes(`${pid}::${subId}`)));
            if(!lote){
              lote = otLotes.find(l=>cand.some(pid=>(l.posIds||[]).includes(pid)));
            }
            if(!lote) return 'pendiente';
            if(lote.estado==='rechazado') return 'rechazado';
            if(lote.estado!=='aprobado') return 'pendiente';
            // sub-level state has priority over parent-level
            for(const pid of cand){
              const spidState = lote.subPosEstados?.[`${pid}::${subId}`];
              if(spidState==='rechazado') return 'rechazado';
              if(spidState==='aprobado') return 'aprobado';
            }
            for(const pid of cand){
              if(lote.posEstados?.[pid]==='rechazado') return 'rechazado';
            }
            return 'aprobado';
          } else {
            lote = otLotes.find(l=>cand.some(pid=>(l.posIds||[]).includes(pid)));
            if(!lote) return 'pendiente';
            if(lote.estado==='rechazado') return 'rechazado';
            if(lote.estado!=='aprobado') return 'pendiente';
            for(const pid of cand){
              if(lote.posEstados?.[pid]==='rechazado') return 'rechazado';
            }
            return 'aprobado';
          }
        }
        const totalUnits=units.length;
        const cdOk=units.filter(u=>u.processes[0]?.status==='approved').length;
        const apOk=units.filter(u=>u.processes[1]?.status==='approved').length;
        const pintOk=units.filter(u=>pintStateHome(u.posKey, u.posIdAlt, u.subId)==='aprobado').length;
        const rejCount=units.filter(u=>u.processes.some(p=>p.status==='rejected'||(p.history||[]).some(h=>h.action==='rejected'))).length;

        const pctArm=totalKg>0?Math.round(armadoKg/totalKg*100):0;
        const pctSol=totalKg>0?Math.round(soldadoKg/totalKg*100):0;
        const pctCd=totalUnits>0?Math.round(cdOk/totalUnits*100):0;
        const pctAp=totalUnits>0?Math.round(apOk/totalUnits*100):0;
        const pctPi=totalUnits>0?Math.round(pintOk/totalUnits*100):0;

        function miniBar(pct,color){
          return `<div style="flex:1;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${color};border-radius:3px;transition:width 0.4s"></div>
          </div>`;
        }

        const statusBadge = o.archived
          ? `<span style="font-family:var(--mono);font-size:10px;background:rgba(120,130,150,0.15);color:var(--text2);padding:2px 8px;border-radius:20px">Archivada</span>`
          : !o.plPublished
            ? `<span style="font-family:var(--mono);font-size:10px;background:rgba(245,166,35,0.12);color:var(--amber);padding:2px 8px;border-radius:20px">Sin publicar</span>`
            : `<span style="font-family:var(--mono);font-size:10px;background:rgba(62,207,122,0.1);color:var(--green);padding:2px 8px;border-radius:20px">Activo</span>`;

        return `<div class="ot-home-card" data-ot-nav="${esc(o.id)}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
            <div>
              <div style="font-size:16px;font-weight:600;letter-spacing:-0.01em">OT ${esc(pi.ot||'—')}</div>
              <div style="font-size:13px;color:var(--text2);margin-top:2px">${esc(pi.proyecto||'Sin nombre')}</div>
              <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:2px">${esc(pi.cliente||'—')}</div>
            </div>
            ${statusBadge}
          </div>
          ${o.plPublished?`
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Producción</div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span style="font-family:var(--mono);font-size:10px;color:var(--blue);width:28px">ARM</span>
                ${miniBar(pctArm,'var(--blue)')}
                <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--blue);min-width:32px">${pctArm}%</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-family:var(--mono);font-size:10px;color:var(--amber);width:28px">SOL</span>
                ${miniBar(pctSol,'var(--amber)')}
                <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--amber);min-width:32px">${pctSol}%</span>
              </div>
            </div>
            <div>
              <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Calidad</div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span style="font-family:var(--mono);font-size:10px;color:var(--green);width:28px">CD</span>
                ${miniBar(pctCd,'var(--green)')}
                <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--green);min-width:32px">${pctCd}%</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span style="font-family:var(--mono);font-size:10px;color:var(--teal);width:28px">AP</span>
                ${miniBar(pctAp,'var(--teal)')}
                <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--teal);min-width:32px">${pctAp}%</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-family:var(--mono);font-size:10px;color:var(--accent2);width:28px">PINT</span>
                ${miniBar(pctPi,'var(--accent2)')}
                <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent2);min-width:32px">${pctPi}%</span>
              </div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
            <span style="font-family:var(--mono);font-size:11px;color:var(--text3)">${positions.length} pos · ${Math.round(totalKg).toLocaleString()} kg</span>
          </div>`
          :`<div style="font-size:13px;color:var(--text3);font-family:var(--mono);padding:8px 0">Cargá el packing list para ver el avance.</div>`}
        </div>`;
      }).join('')
    : `<div class="ot-empty" style="grid-column:1/-1">
        <div style="font-size:16px;font-weight:600;margin-bottom:6px">${showArchived?'Sin archivadas':'Sin proyectos activos'}</div>
        <div style="font-size:13px;color:var(--text3);font-family:var(--mono)">
          ${showArchived?'No hay OTs archivadas todavía.':(role==='ingenieria'||role==='admin'?'Creá una OT desde el botón "+ Nueva OT".':'Ingeniería aún no creó ninguna OT.')}
        </div>
      </div>`;

  return `<div class="topbar">
    <div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <button type="button" class="g-nav-btn ${!showArchived?'on':''}" data-home-tab="activas" style="font-size:18px;font-weight:600;letter-spacing:-0.01em;padding:4px 10px">${!showArchived?'<span class="dot"></span>':''}Inicio <span style="font-family:var(--mono);font-size:11px;color:var(--text3);font-weight:400">(${activeCount})</span></button>
        <button type="button" class="g-nav-btn ${showArchived?'on':''}" data-home-tab="archivadas" style="font-size:18px;font-weight:600;letter-spacing:-0.01em;padding:4px 10px">${showArchived?'<span class="dot"></span>':''}Archivadas <span style="font-family:var(--mono);font-size:11px;color:var(--text3);font-weight:400">(${archivedCount})</span></button>
      </div>
      <div class="topbar-meta">${showArchived?'OTs archivadas':'OTs activas'} · <span class="badge-role ${ri.badgeCls}">${ri.label}</span></div>
    </div>
  </div>
  <div class="content">
    <div class="ot-home-grid">${otCards}</div>
  </div>`;
}

// ── PACKING ───────────────────────────────────────────────
function renderPackingView(ot){
  if(!ot){
    return `<div class="topbar"><div><div class="topbar-title">Packing list</div><div class="topbar-meta">Ingeniería</div></div></div>
    <div class="content">
      <div class="ot-empty">
        <div style="font-size:15px;font-weight:500;margin-bottom:6px">Seleccioná o creá una OT</div>
        <div style="font-size:12px;color:var(--text3);font-family:var(--mono)">Elegí un proyecto desde la pantalla de inicio.</div>
      </div>
    </div>`;
  }
  const published=ot.plPublished;
  const draft=ot.draftPositions||[];
  const pi=ot.info;

  const totalP=draft.reduce((a,p)=>a+(Number(p.qty)||0),0);
  const totalK=draft.reduce((a,p)=>a+(Number(p.pesoTotal)||0),0);

  const otHeader=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap">
      <div>
        <label style="display:block;font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px">Número de OT</label>
        <input type="text" class="ing-info-input" data-field="ot" value="${esc(pi.ot||'')}" placeholder="546"/>
      </div>
      <div>
        <label style="display:block;font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px">Nombre del proyecto</label>
        <input type="text" class="ing-info-input" data-field="proyecto" value="${esc(pi.proyecto||'')}" placeholder="Los Toldos 2 Este"/>
      </div>
      <div>
        <label style="display:block;font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px">Cliente</label>
        <input type="text" class="ing-info-input" data-field="cliente" value="${esc(pi.cliente||'')}" placeholder="Techint"/>
      </div>
    </div>`;

  let body='';
  if(published){
    body=`<div class="published-ok">✓ Packing list publicado — los cambios se aplican inmediatamente</div>
    ${otHeader}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;flex-wrap:wrap;gap:8px">

function calcProdStats(positions, prodData){
  if(!prodData) prodData={};
  const totalKg=positions.reduce((a,p)=>a+(Number(p.pesoTotal)||0),0);
  const totalQty=positions.reduce((a,p)=>a+(Number(p.qty)||0),0);
  let armadoKg=0, soldadoKg=0, pintadoKg=0;
  positions.forEach(pos=>{
    const pd=prodData[prodKey(pos)]||{};
    const peso=Number(pos.pesoTotal)||0;
    const qty=Number(pos.qty)||0;
    const avArm=Number(pd.avanceArmado)||0;
    const avSol=Number(pd.avanceSoldadura)||0;
    const pint=Number(pd.pintado)||0;
    armadoKg += peso * avArm / 100;
    soldadoKg += peso * avSol / 100;
    if(qty>0) pintadoKg += peso * Math.min(pint/qty, 1);
  });
  const pctArmado  = totalKg>0?armadoKg/totalKg*100:0;
  const pctSoldado = totalKg>0?soldadoKg/totalKg*100:0;
  const pctPintado = totalKg>0?pintadoKg/totalKg*100:0;
  return { totalKg, totalQty, armadoKg, soldadoKg, pintadoKg, pctArmado, pctSoldado, pctPintado };
}

}

function renderTableroDefault(ot){
  const pi=ot.info; const positions=ot.positions||[];

  // helper: compute effective PINT state for a unit (posId, subId|null)
  // returns 'aprobado' | 'rechazado' | 'pendiente' based on lote membership
  function pintState(posKey, posIdAlt, subId){
    const lotes=ot.lotes||[];
    const cand=[posKey];
    if(posIdAlt && posIdAlt!==posKey) cand.push(posIdAlt);
    let lote;
    if(subId){
      // first check if sub is assigned individually with any candidate
      lote = lotes.find(l=>cand.some(pid=>(l.subPosIds||[]).includes(`${pid}::${subId}`)));
      if(!lote){
        // fallback: parent in posIds
        lote = lotes.find(l=>cand.some(pid=>(l.posIds||[]).includes(pid)));
      }
      if(!lote) return 'pendiente';
      if(lote.estado==='rechazado') return 'rechazado';
      if(lote.estado!=='aprobado') return 'pendiente';
      // sub-level state has priority over parent-level
      for(const pid of cand){
        const spidState = lote.subPosEstados?.[`${pid}::${subId}`];
        if(spidState==='rechazado') return 'rechazado';
        if(spidState==='aprobado') return 'aprobado';
      }
      // fall back to parent state
      for(const pid of cand){
        if(lote.posEstados?.[pid]==='rechazado') return 'rechazado';
      }
      return 'aprobado';
    } else {
      lote = lotes.find(l=>cand.some(pid=>(l.posIds||[]).includes(pid)));
      if(!lote) return 'pendiente';
      if(lote.estado==='rechazado') return 'rechazado';
      if(lote.estado!=='aprobado') return 'pendiente';
      for(const pid of cand){
        if(lote.posEstados?.[pid]==='rechazado') return 'rechazado';
      }
      return 'aprobado';
    }
  }

  // build flat list of all inspectable units (sub-positions if qty>1, else position itself)
  const units=[];
  positions.forEach(pos=>{
    const posKey=pos.uid||pos.id;
    if(pos.subs&&pos.subs.length>0){
      pos.subs.forEach((sub,i)=>{
        units.push({label:`${pos.id}-${i+1}`, denom:pos.denom, prioridad:pos.prioridad||'—', processes:sub.processes, pintEstado: pintState(posKey, pos.id, sub.subId)});
      });
    } else {
      units.push({label:pos.id, denom:pos.denom, prioridad:pos.prioridad||'—', processes:pos.processes, pintEstado: pintState(posKey, pos.id, null)});
    }
  });

  const total=units.length;
  const cdOk   =units.filter(u=>u.processes[0]?.status==='approved').length;
  const apOk   =units.filter(u=>u.processes[1]?.status==='approved').length;
  const pintOk =units.filter(u=>u.pintEstado==='aprobado').length;
  const pintRej=units.filter(u=>u.pintEstado==='rechazado').length;
  const rejUnits=units.filter(u=>u.processes.some(p=>
    p.status==='rejected' || (p.history||[]).some(h=>h.action==='rejected')
  ) || u.pintEstado==='rechazado');
  const totalRej=rejUnits.length;

  // rejected list rows
  const rejRows=rejUnits.map(u=>{
    const expandKey=`rej_${u.label}`;
    const isExp=!!state.expanded[expandKey];

    // processes that currently have rejected status OR ever had a rejection in history
    const rejProcIdxs=CAL_SHORT.map((_,i)=>i).filter(i=>{
      const p=u.processes[i];
      return p?.status==='rejected' || (p?.history||[]).some(h=>h.action==='rejected');
    });

    const rejChips=rejProcIdxs.map(i=>{
      const isCurrent=u.processes[i]?.status==='rejected';
      return `<span class="chip ${isCurrent?'chip-rejected':''}" style="${!isCurrent?'background:rgba(139,145,168,0.1);color:var(--text2);':''}margin-right:3px;border-radius:20px">${esc(CAL_SHORT[i])}${!isCurrent?' ✓':''}</span>`;
    }).join('');

    const obsRows=rejProcIdxs.map(i=>{
      const proc=u.processes[i];
      const isCurrent=proc?.status==='rejected';
      const history=(proc?.history||[]).filter(h=>h.action==='rejected'||h.action==='approved'||h.action==='partial');
      const statusLabel=isCurrent
        ? `<span class="chip chip-rejected" style="border-radius:20px;font-size:10px">Rechazado</span>`
        : `<span class="chip" style="background:rgba(62,207,122,0.12);color:var(--green);border-radius:20px;font-size:10px">Resuelto ✓</span>`;
      return `<div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2)">${CAL_SHORT[i]} — ${CAL_PROCS[i]}</span>
          ${statusLabel}
        </div>
        ${history.length
          ? history.map(h=>`
            <div style="padding:7px 0 7px 12px;border-left:2px solid ${h.action==='rejected'?'rgba(240,94,106,0.4)':h.action==='approved'?'rgba(62,207,122,0.4)':'var(--border2)'};margin-bottom:4px">
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:3px">
                <span style="font-family:var(--mono);font-size:10px;color:var(--teal);font-weight:500">${esc(h.author||'—')}</span>
                <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">${esc(h.date||'')}</span>
                ${historyTag(h.action)}
              </div>
              <div style="font-size:13px;color:var(--text);line-height:1.45">${esc(h.text||'(sin texto)')}</div>
            </div>`).join('')
          : `<div style="font-size:12px;color:var(--text3);font-family:var(--mono);padding:4px 0 4px 12px">Sin observaciones registradas</div>`
        }
      </div>`;
    }).join('');

    return `<tr style="cursor:pointer" data-expand-rej="${esc(expandKey)}">
      <td class="mono" style="font-weight:600;color:var(--text)">
        <span style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-right:6px">${isExp?'▾':'▸'}</span>${esc(u.label)}
      </td>
      <td style="color:var(--text2);font-size:13px">${esc(u.denom)}</td>
      <td><span class="chip" style="background:rgba(79,142,247,0.1);color:var(--accent2);border-radius:20px;font-family:var(--mono);font-size:10px">${esc(u.prioridad)}</span></td>
      <td>${rejChips}</td>
    </tr>
    ${isExp?`<tr style="background:rgba(240,94,106,0.03)">
      <td colspan="4" style="padding:14px 16px 14px 36px;border-bottom:1px solid var(--border)">
        ${obsRows}
      </td>
    </tr>`:''}`;
  }).join('');

  function bar(val, tot, color){
    const pct=tot>0?Math.round(val/tot*100):0;
    return `<div style="display:flex;align-items:center;gap:12px">
      <div style="flex:1;height:10px;background:var(--bg4);border-radius:5px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${color};border-radius:5px;transition:width 0.4s"></div>
      </div>
      <div style="font-family:var(--mono);font-size:13px;font-weight:600;min-width:80px;color:${color}">${val} / ${tot} <span style="font-weight:400;color:var(--text3);font-size:11px">(${pct}%)</span></div>
    </div>`;
  }

  return `<div class="topbar">
    <div><div class="topbar-title">OT ${esc(pi.ot)}</div><div class="topbar-meta">${esc(pi.proyecto||'')} · ${esc(pi.cliente)}</div></div>
  </div>
  <div class="content">

    <div class="metrics" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      <div class="metric-card">
        <div class="metric-label">Total unidades</div>
        <div class="metric-val">${total}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">CD aprobados</div>
        <div class="metric-val ok">${cdOk}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">AP aprobados</div>
        <div class="metric-val" style="color:var(--teal)">${apOk}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">PINT aprobados</div>
        <div class="metric-val" style="color:var(--accent2)">${pintOk}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Con rechazos</div>
        <div class="metric-val danger">${totalRej}</div>
      </div>
    </div>

    <div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r2);padding:1.5rem;margin-bottom:1.25rem">
      <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:1.25rem">Avance de controles</div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:8px">Control Dimensional (CD)</div>
          ${bar(cdOk, total, 'var(--green)')}
        </div>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--teal);margin-bottom:8px">Apto Pintura (AP)</div>
          ${bar(apOk, total, 'var(--teal)')}
        </div>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:8px">Pintura (PINT)</div>
          ${bar(pintOk, total, 'var(--accent2)')}
        </div>
      </div>
    </div>

    <div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r2);padding:1.5rem;margin-bottom:1.25rem">
      <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:1.25rem">Avance por prioridad</div>
      ${(()=>{
        const prioMap={};
        units.forEach(u=>{ const p=u.prioridad||'—'; if(!prioMap[p]) prioMap[p]=[]; prioMap[p].push(u); });
        const prioKeys=Object.keys(prioMap).sort((a,b)=>Number(a)-Number(b)||a.localeCompare(b,"es",{numeric:true}));
        if(!prioKeys.length) return '<div style="color:var(--text3);font-size:13px;font-family:var(--mono)">Sin prioridades definidas.</div>';
        return prioKeys.map(prio=>{
          const us=prioMap[prio];
          const tot=us.length;
          const cd=us.filter(u=>u.processes[0]?.status==='approved').length;
          const ap=us.filter(u=>u.processes[1]?.status==='approved').length;
          const pi=us.filter(u=>u.pintEstado==='aprobado').length;
          const rej=us.filter(u=>u.processes.some(p=>p.status==='rejected'||(p.history||[]).some(h=>h.action==='rejected'))||u.pintEstado==='rechazado').length;
          const pctCd=tot>0?Math.round(cd/tot*100):0;
          const pctAp=tot>0?Math.round(ap/tot*100):0;
          const pctPi=tot>0?Math.round(pi/tot*100):0;
          return `<div style="padding:1rem;border:1px solid var(--border);border-radius:var(--r2);margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px">
              <span style="font-size:14px;font-weight:600">Prioridad ${esc(prio)}</span>
              <div style="display:flex;gap:8px;align-items:center">
                <span style="font-family:var(--mono);font-size:11px;color:var(--text3)">${tot} unidad${tot!==1?'es':''}</span>
                ${rej>0?`<span class="chip chip-rejected">${rej} rechazo${rej!==1?'s':''}</span>`:''}
              </div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
              <div>
                <div style="font-family:var(--mono);font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">CD</div>
                <div style="display:flex;align-items:center;gap:10px">
                  <div style="flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden">
                    <div style="height:100%;width:${pctCd}%;background:var(--green);border-radius:4px"></div>
                  </div>
                  <span style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--green);min-width:60px">${cd}/${tot} <span style="color:var(--text3);font-weight:400">(${pctCd}%)</span></span>
                </div>
              </div>
              <div>
                <div style="font-family:var(--mono);font-size:10px;color:var(--teal);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">AP</div>
                <div style="display:flex;align-items:center;gap:10px">
                  <div style="flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden">
                    <div style="height:100%;width:${pctAp}%;background:var(--teal);border-radius:4px"></div>
                  </div>
                  <span style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--teal);min-width:60px">${ap}/${tot} <span style="color:var(--text3);font-weight:400">(${pctAp}%)</span></span>
                </div>
              </div>
              <div>
                <div style="font-family:var(--mono);font-size:10px;color:var(--accent2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">PINT</div>
                <div style="display:flex;align-items:center;gap:10px">
                  <div style="flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden">
                    <div style="height:100%;width:${pctPi}%;background:var(--accent2);border-radius:4px"></div>
                  </div>
                  <span style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent2);min-width:60px">${pi}/${tot} <span style="color:var(--text3);font-weight:400">(${pctPi}%)</span></span>
                </div>
              </div>
            </div>
          </div>`;
        }).join('');
      })()}
    </div>

    <div style="background:var(--bg2);border:1.5px solid ${totalRej>0?'rgba(240,94,106,0.3)':'var(--border)'};border-radius:var(--r2);padding:1.5rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em">Historial de rechazos</div>
        ${totalRej>0?`<span class="chip chip-rejected">${totalRej} unidad${totalRej!==1?'es':''}</span>`:'<span style="font-size:12px;color:var(--green)">Sin rechazos</span>'}
      </div>
      ${totalRej>0?`
      <div style="overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)">
        <table class="tbl">
          <thead><tr>
            <th>Unidad</th><th>Denominación</th><th>Prioridad</th><th>Proceso rechazado</th>
          </tr></thead>
          <tbody>${rejRows}</tbody>
        </table>
      </div>`:''}
    </div>

  </div>`;
}

// ── POSICIONES ────────────────────────────────────────────
function renderPosView(ot){
  if(!ot||!ot.plPublished){
    return `<div class="topbar"><div><div class="topbar-title">Posiciones</div></div></div>
    <div class="content"><div class="empty">
      <div class="empty-title">${!ot?'Seleccioná una OT':'Sin packing list publicado'}</div>
      <div class="empty-sub">${!ot?'Elegí un proyecto en el panel izquierdo.':'Ingeniería aún no publicó el packing list.'}</div>
    </div></div>`;
  }
  if(state.role==='admin'||state.role==='control'){
    return state.adminView==='calidad' ? renderPosViewDefault(ot) : renderPosViewProduccion(ot);
  }
  if(roleIs('produccion')) return renderPosViewProduccion(ot);
  return renderPosViewDefault(ot);
}

// ── POSICIONES: PRODUCCION ────────────────────────────────
function renderPosViewProduccion(ot){
  const f=state.filters; const pi=ot.info;
  const positions=ot.positions||[];

  // ensure prodData map exists on ot
  if(!ot.prodData) ot.prodData={};

  // auto-migrate: generate subs for positions with qty>1 that don't have them yet
  if(ensureSubs(positions)) savePersisted();

  // normalize taller: empty/blank = CIMOMET
  function getTaller(pos){
    const c=String(pos.construye||'').trim();
    return c||'CIMOMET';
  }

  // unique talleres
  const talleres=[...new Set(positions.map(p=>getTaller(p)))].sort((a,b)=>{
    if(a==='CIMOMET') return -1;
    if(b==='CIMOMET') return 1;
    return a.localeCompare(b);
  });

  const selectedTalleres=f.talleres&&f.talleres.length>0?f.talleres:[];

  // unique sorted priorities from positions (respecting taller filter)
  const posForPrio=selectedTalleres.length>0?positions.filter(p=>selectedTalleres.includes(getTaller(p))):positions;
  const prioridades=[...new Set(posForPrio.map(p=>String(p.prioridad||'')).filter(Boolean))].sort((a,b)=>Number(a)-Number(b)||a.localeCompare(b,"es",{numeric:true}));

  const filtered=positions.filter(pos=>{
    if(selectedTalleres.length>0 && !selectedTalleres.includes(getTaller(pos))) return false;
    if(f.prioridad && String(pos.prioridad||'')!==f.prioridad) return false;
    if(f.buscar){
      const q=f.buscar.toLowerCase();
      return String(pos.id||'').toLowerCase().includes(q)||String(pos.denom||'').toLowerCase().includes(q)||String(pos.plano||'').toLowerCase().includes(q);
    }
    return true;
  });

  const styleGreen = 'background:rgba(106,170,130,0.18);border-color:rgba(106,170,130,0.5);color:var(--green);';

  function prodInputs(dataKey, pos){
    const processes=pos.processes;
    const qty=Number(pos.qty)||1;
    const pd=ot.prodData[dataKey]||{};
    const ext=normLugar(pos.construye)==='ext';

    // for external: ARM/SOL come from calExtData, read-only
    const extData=ot.calExtData?.[prodKey(pos)]||{};
    const armExt=extData.armadas!==undefined?extData.armadas:'';
    const solExt=extData.soldadas!==undefined?extData.soldadas:'';
    const pctArmExt=armExt!==''&&qty>0?Math.round(Number(armExt)/qty*100):0;
    const pctSolExt=solExt!==''&&qty>0?Math.round(Number(solExt)/qty*100):0;

    const fechaInicioArmado   = pd.fechaInicioArmado||'';
    const avanceArmado        = ext ? pctArmExt : (pd.avanceArmado!==undefined?pd.avanceArmado:'');
    const fechaInicioSoldadura= pd.fechaInicioSoldadura||'';
    const avanceSoldadura     = ext ? pctSolExt : (pd.avanceSoldadura!==undefined?pd.avanceSoldadura:'');
    const pintado             = pd.pintado!==undefined?pd.pintado:'';
    const avanceArmadoOk    = avanceArmado!==''&&Number(avanceArmado)===100;
    const avanceSoldaduraOk = avanceSoldadura!==''&&Number(avanceSoldadura)===100;
    const pintadoOk         = pintado!==''&&qty&&Number(pintado)===qty;

    // CD and AP: count approved subs if qty>1, else use main process status
    let cdOk, apOk;
    if(pos.subs&&pos.subs.length>0){
      cdOk=pos.subs.filter(s=>s.processes[0]?.status==='approved').length;
      apOk=pos.subs.filter(s=>s.processes[1]?.status==='approved').length;
    } else {
      cdOk=processes[0]?.status==='approved'?1:0;
      apOk=processes[1]?.status==='approved'?1:0;
    }
    const total=pos.subs?pos.subs.length:1;

    const cdStatus= cdOk===total && total>0
      ? '<span class="chip chip-ok-sm">OK</span>'
      : cdOk>0
        ? `<span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--amber)">${cdOk}-CD</span>`
        : '<span style="color:var(--text3)">—</span>';

    const apStatus= apOk===total && total>0
      ? '<span class="chip chip-ok-sm">OK</span>'
      : apOk>0
        ? `<span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--amber)">${apOk}-AP</span>`
        : '<span style="color:var(--text3)">—</span>';

    const roStyle='background:var(--bg3);border-color:var(--border);color:var(--text2);cursor:default;';
    const extLabel=`<span style="font-family:var(--mono);font-size:11px;font-weight:600;${avanceArmadoOk?'color:var(--green)':'color:var(--text2)'}">${avanceArmado}%</span>`;
    const solLabel=`<span style="font-family:var(--mono);font-size:11px;font-weight:600;${avanceSoldaduraOk?'color:var(--green)':'color:var(--text2)'}">${avanceSoldadura}%</span>`;
    const extSrc=`<span style="font-family:var(--mono);font-size:9px;color:var(--text3);display:block">taller ext.</span>`;

    return `
      <td style="text-align:center">${ext ? '<span style="color:var(--text3)">—</span>' : `<input type="date" class="prod-input" data-id="${esc(dataKey)}" data-field="fechaInicioArmado" value="${esc(fechaInicioArmado)}" style="width:130px"/>`}</td>
      <td style="text-align:center">${ext
        ? `<div style="text-align:center">${extLabel}${extSrc}</div>`
        : `<input type="number" class="prod-input" data-id="${esc(dataKey)}" data-field="avanceArmado" value="${avanceArmado}" min="0" max="100" placeholder="0–100" style="width:70px;${avanceArmadoOk?styleGreen:''}"/>`}
      </td>
      <td style="text-align:center">${cdStatus}</td>
      <td style="text-align:center">${ext ? '<span style="color:var(--text3)">—</span>' : `<input type="date" class="prod-input" data-id="${esc(dataKey)}" data-field="fechaInicioSoldadura" value="${esc(fechaInicioSoldadura)}" style="width:130px"/>`}</td>
      <td style="text-align:center">${ext
        ? `<div style="text-align:center">${solLabel}${extSrc}</div>`
        : `<input type="number" class="prod-input" data-id="${esc(dataKey)}" data-field="avanceSoldadura" value="${avanceSoldadura}" min="0" max="100" placeholder="0–100" style="width:70px;${avanceSoldaduraOk?styleGreen:''}"/>`}
      </td>
      <td style="text-align:center">${apStatus}</td>
      <td><input type="number" class="prod-input" data-id="${esc(dataKey)}" data-field="pintado" value="${pintado}" min="0" placeholder="0" style="width:70px;${pintadoOk?styleGreen:''}"/></td>`;
  }

  const rows=filtered.map(pos=>{
    const parentInputs = prodInputs(prodKey(pos), pos) + '<td></td>';

    const lote=ot.lotes?.find(l=>l.id===pos.loteId);
    const loteCell=`<td>
      <div style="display:flex;align-items:center;gap:4px">
        ${lote?`<span style="font-family:var(--mono);font-size:11px;color:var(--accent2)">${esc(lote.nombre)}</span>`:'<span style="color:var(--text3);font-size:11px">—</span>'}
        <button type="button" class="abtn" style="font-size:9px;padding:2px 6px" data-lote-asignar="${esc(prodKey(pos))}">${lote?'✏':'+'}</button>
      </div>
    </td>`;

    return `<tr>
      <td class="mono" style="color:var(--accent);font-weight:500">${esc(pos.prioridad||'—')}</td>
      <td class="mono" style="font-weight:500">${esc(pos.id)}</td>
      <td class="mono">${pos.qty!==''&&pos.qty!==undefined?pos.qty:'—'}</td>
      <td><div style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(pos.denom)}">${esc(pos.denom)}</div></td>
      <td class="mono">${pos.pesoUnit!==''&&pos.pesoUnit!==undefined?Number(pos.pesoUnit).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}):'—'}</td>
      <td class="mono">${pos.pesoTotal!==''&&pos.pesoTotal!==undefined?Number(pos.pesoTotal).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}):'—'}</td>
      ${parentInputs}
      ${loteCell}
    </tr>`;
  }).join('');

  // ── mobile cards ──
  const mobileCards=filtered.map(pos=>{
    const pd=ot.prodData[prodKey(pos)]||{};
    const ext=normLugar(pos.construye)==='ext';
    const extData=ot.calExtData?.[prodKey(pos)]||{};
    const qty=Number(pos.qty)||1;
    const sg='background:rgba(106,170,130,0.18);border-color:rgba(106,170,130,0.5);color:var(--green);';

    // ARM/SOL: readonly from calExtData for external, editable for CIMOMET
    const avArm = ext
      ? (extData.armadas!==undefined ? Math.round(Number(extData.armadas)/qty*100) : 0)
      : (pd.avanceArmado!==undefined?pd.avanceArmado:'');
    const avSol = ext
      ? (extData.soldadas!==undefined ? Math.round(Number(extData.soldadas)/qty*100) : 0)
      : (pd.avanceSoldadura!==undefined?pd.avanceSoldadura:'');
    const fechaArm=ext?'':pd.fechaInicioArmado||'';
    const fechaSol=ext?'':pd.fechaInicioSoldadura||'';
    const pint=pd.pintado!==undefined?pd.pintado:'';
    const avArmOk=Number(avArm)===100;
    const avSolOk=Number(avSol)===100;
    const pintOk=pint!==''&&Number(pint)===qty;
    // cd/ap counts
    let cdOk,apOk,total;
    if(pos.subs&&pos.subs.length>0){
      cdOk=pos.subs.filter(s=>s.processes[0]?.status==='approved').length;
      apOk=pos.subs.filter(s=>s.processes[1]?.status==='approved').length;
      total=pos.subs.length;
    } else {
      cdOk=pos.processes[0]?.status==='approved'?1:0;
      apOk=pos.processes[1]?.status==='approved'?1:0;
      total=1;
    }
    const cdColor=cdOk===total&&total>0?'var(--green)':cdOk>0?'var(--amber)':'var(--text3)';
    const apColor=apOk===total&&total>0?'var(--green)':apOk>0?'var(--amber)':'var(--text3)';
    const cdText=cdOk===total&&total>0?'CD ✓':cdOk>0?`CD ${cdOk}/${total}`:'CD —';
    const apText=apOk===total&&total>0?'AP ✓':apOk>0?`AP ${apOk}/${total}`:'AP —';
    const cdBadge=`<span style="font-family:var(--mono);font-size:13px;font-weight:700;color:${cdColor};background:${cdOk===total&&total>0?'rgba(62,207,122,0.12)':cdOk>0?'rgba(200,154,74,0.12)':'rgba(120,130,150,0.1)'};padding:4px 10px;border-radius:20px;border:1.5px solid ${cdColor};display:inline-block">${cdText}</span>`;
    const apBadge=`<span style="font-family:var(--mono);font-size:13px;font-weight:700;color:${apColor};background:${apOk===total&&total>0?'rgba(62,207,122,0.12)':apOk>0?'rgba(200,154,74,0.12)':'rgba(120,130,150,0.1)'};padding:4px 10px;border-radius:20px;border:1.5px solid ${apColor};display:inline-block">${apText}</span>`;

    return `<div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
            <span style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)">${esc(pos.id)}</span>
            ${pos.prioridad?`<span class="chip" style="background:rgba(79,142,247,0.1);color:var(--accent2);border-radius:20px;font-family:var(--mono);font-size:10px">${esc(pos.prioridad)}</span>`:''}
          </div>
          <div style="font-size:13px;color:var(--text2)">${esc(pos.denom)}</div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:2px">Cant: ${qty} · ${pos.pesoTotal!==''&&pos.pesoTotal!==undefined?Number(pos.pesoTotal).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+' kg':'—'}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px">Armado${ext?' (ext.)':''}</div>
          ${ext
            ? `<div style="font-family:var(--mono);font-size:20px;font-weight:600;color:${avArmOk?'var(--green)':'var(--text2)'}">${avArm}%</div>
               <div style="font-family:var(--mono);font-size:10px;color:var(--text3)">${extData.armadas||0} / ${qty} unidades</div>`
            : `<input type="date" class="prod-input" data-id="${esc(prodKey(pos))}" data-field="fechaInicioArmado" value="${esc(fechaArm)}" style="width:100%;margin-bottom:5px"/>
               <input type="number" class="prod-input" data-id="${esc(prodKey(pos))}" data-field="avanceArmado" value="${avArm}" min="0" max="100" placeholder="% avance" style="width:100%;${avArmOk?sg:''}"/>`}
          <div style="margin-top:6px">${cdBadge}</div>
        </div>
        <div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px">Soldadura${ext?' (ext.)':''}</div>
          ${ext
            ? `<div style="font-family:var(--mono);font-size:20px;font-weight:600;color:${avSolOk?'var(--green)':'var(--text2)'}">${avSol}%</div>
               <div style="font-family:var(--mono);font-size:10px;color:var(--text3)">${extData.soldadas||0} / ${qty} unidades</div>`
            : `<input type="date" class="prod-input" data-id="${esc(prodKey(pos))}" data-field="fechaInicioSoldadura" value="${esc(fechaSol)}" style="width:100%;margin-bottom:5px"/>
               <input type="number" class="prod-input" data-id="${esc(prodKey(pos))}" data-field="avanceSoldadura" value="${avSol}" min="0" max="100" placeholder="% avance" style="width:100%;${avSolOk?sg:''}"/>`}
          <div style="margin-top:6px">${apBadge}</div>
        </div>
      </div>
      <div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px">Pintado (unidades)</div>
        <input type="number" class="prod-input" data-id="${esc(prodKey(pos))}" data-field="pintado" value="${pint}" min="0" placeholder="0" style="width:100%;${pintOk?sg:''}"/>
      </div>
    </div>`;
  }).join('');

  return `<div class="topbar">
    <div><div class="topbar-title">Posiciones</div><div class="topbar-meta">OT ${esc(pi.ot)} · ${esc(pi.proyecto||'')}</div></div>
  </div>
  <div class="content">
    <div style="margin-bottom:0.75rem">
      <input id="inp-buscar" type="text" placeholder="Buscar por posición, descripción o plano…" value="${esc(f.buscar)}" style="max-width:320px;background:var(--bg2);border-color:var(--border2);font-family:var(--mono);font-size:12px;"/>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <span class="filter-lbl">Taller</span>
      <button type="button" class="fbtn ${selectedTalleres.length===0?'on':''}" data-taller-all="1">Todos</button>
      ${talleres.map(t=>{
        const sel=selectedTalleres.includes(t);
        return `<button type="button" class="fbtn ${sel?'on':''}" data-taller="${esc(t)}">${esc(t)}</button>`;
      }).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:0.75rem">
      <span class="filter-lbl">Prioridad</span>
      <button type="button" class="fbtn ${!f.prioridad?'on':''}" data-fk="prioridad" data-fv="">Todas</button>
      ${prioridades.map(p=>`<button type="button" class="fbtn ${f.prioridad===p?'on':''}" data-fk="prioridad" data-fv="${esc(p)}">${esc(p)}</button>`).join('')}
    </div>
    <div class="results-count">${filtered.length} de ${positions.length} posiciones${selectedTalleres.length>0?` · ${selectedTalleres.join(', ')}`:''}</div>

    <!-- DESKTOP: tabla -->
    <div class="prod-desktop-table tbl-wrap">
    <table class="tbl">
      <thead>
        <tr style="color:var(--text);font-size:12px">
          <th rowspan="2" style="color:var(--text)">Prioridad</th>
          <th rowspan="2" style="color:var(--text)">Posición</th>
          <th rowspan="2" style="color:var(--text)">Cant.</th>
          <th rowspan="2" style="color:var(--text)">Denominación</th>
          <th rowspan="2" style="color:var(--text)">Peso unit.</th>
          <th rowspan="2" style="color:var(--text)">Peso total</th>
          <th colspan="2" style="text-align:center;border-bottom:1px solid var(--border2);color:var(--text)">Armado</th>
          <th rowspan="2" style="text-align:center;color:var(--text)">CD</th>
          <th colspan="2" style="text-align:center;border-bottom:1px solid var(--border2);color:var(--text)">Soldadura</th>
          <th rowspan="2" style="text-align:center;color:var(--text)">AP</th>
          <th rowspan="2" style="text-align:center;color:var(--text)">Pintado<br><span style="font-size:9px;color:var(--text3)">(unidades)</span></th>
          <th rowspan="2" style="color:var(--text)">Lote</th>
        </tr>
        <tr style="color:var(--text)">
          <th style="color:var(--text)">Fecha inicio</th><th style="color:var(--text)">% Avance</th>
          <th style="color:var(--text)">Fecha inicio</th><th style="color:var(--text)">% Avance</th>
        </tr>
      </thead>
      <tbody>${rows.length?rows:`<tr><td colspan="13" style="text-align:center;padding:3rem;color:var(--text3);font-family:var(--mono);font-size:12px">Sin resultados.</td></tr>`}</tbody>
    </table>
    </div>

    <!-- MOBILE: cards -->
    <div class="prod-mobile-cards">
      ${filtered.length===0?`<div style="text-align:center;padding:3rem 1rem;color:var(--text3);font-family:var(--mono);font-size:12px">Sin resultados.</div>`:mobileCards}
    </div>
  </div>`;
}

// ── POSICIONES: CALIDAD ───────────────────────────────────
function renderPosViewDefault(ot){
  const f=state.filters; const pi=ot.info;
  const positions=ot.positions||[];

  // auto-migrate: generate subs for positions with qty>1 that don't have them yet
  if(ensureSubs(positions)) savePersisted();

  function getTallerCal(pos){ return String(pos.construye||'').trim()||'CIMOMET'; }

  const talleresCal=[...new Set(positions.map(p=>getTallerCal(p)))].sort((a,b)=>{
    if(a==='CIMOMET') return -1; if(b==='CIMOMET') return 1; return a.localeCompare(b);
  });
  const selectedTalleresCal=f.talleres&&f.talleres.length>0?f.talleres:[];
  const posForPrioCal=selectedTalleresCal.length>0?positions.filter(p=>selectedTalleresCal.includes(getTallerCal(p))):positions;
  const prioridades=[...new Set(posForPrioCal.map(p=>String(p.prioridad||'')).filter(Boolean))].sort((a,b)=>Number(a)-Number(b)||a.localeCompare(b,"es",{numeric:true}));

  // Check whether a target (parent processes or a single sub) matches the estado filter
  // Returns true if matches the selected estado filter (single value, '' = all)
  function targetMatchesEstado(target, estado, posLoteCtx){
    if(!estado) return true;
    const procs = target.processes || [];
    const cd  = procs[0]?.status || 'pending';
    const ap  = procs[1]?.status || 'pending';
    const pin = procs[2]?.status || 'pending';

    // for "completas" and "algun-rechazo" we also need lote info passed in posLoteCtx
    // posLoteCtx = {loteAprobado, loteRechazoIndividual}
