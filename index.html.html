// ── BIND ──────────────────────────────────────────────────
function bind(){
  const $=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el.addEventListener(ev,fn); };

  // lote filter (pintura view)
  document.querySelectorAll('[data-sel-lote]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.selLote;
      state.filters.filterLote=state.filters.filterLote===id?'':id;
      render();
    });
  });

  // lote metric inputs
  document.querySelectorAll('.lote-metric-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot||!ot.lotes) return;
      const lote=ot.lotes.find(l=>l.id===inp.dataset.loteId); if(!lote) return;
      lote[inp.dataset.metric]=inp.value.trim();
      savePersisted();
    });
  });

  // lote sub-pos obs
  document.querySelectorAll('[data-lote-sub-obs]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.modal={type:'lote-obs',loteId:b.dataset.loteSubObs,spid:b.dataset.spid,posId:null};
      render();
    });
  });
  // lote sub-pos estado
  document.querySelectorAll('[data-lote-sub-est]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===b.dataset.loteSubEst); if(!lote) return;
      if(!lote.subPosEstados) lote.subPosEstados={};
      lote.subPosEstados[b.dataset.spid]=b.dataset.est;
      savePersisted(); render();
    });
  });

  // lote accion buttons (aprobar/rechazar lote)
  document.querySelectorAll('[data-lote-accion]').forEach(b=>{
    b.addEventListener('click',()=>{
      const accion=b.dataset.loteAccion;
      if(accion==='obs'){
        state.modal={type:'lote-obs',loteId:b.dataset.loteId,posId:null,spid:null};
        render();
      } else if(accion==='borrar'){
        if(!confirm('¿Borrar este lote? Las posiciones y sub-posiciones asignadas quedarán sin lote, y los lotes posteriores se renumerarán.')) return;
        const ot=activeOt(); if(!ot||!ot.lotes) return;
        const loteId=b.dataset.loteId;
        const lote=ot.lotes.find(l=>l.id===loteId); if(!lote) return;
        const deletedNombre=lote.nombre;
        // clear loteId from positions and subs
        (ot.positions||[]).forEach(pos=>{
          if(pos.loteId===loteId) pos.loteId=null;
          (pos.subs||[]).forEach(sub=>{ if(sub.loteId===loteId) sub.loteId=null; });
        });
        // remove lote
        ot.lotes=ot.lotes.filter(l=>l.id!==loteId);
        // renumber remaining lotes that have numeric names after the deleted one
        // extract numeric suffix from deleted nombre (e.g. "L-003" → 3)
        const numMatch=deletedNombre.match(/(\d+)$/);
        if(numMatch){
          const prefix=deletedNombre.slice(0,deletedNombre.length-numMatch[1].length);
          const deletedNum=parseInt(numMatch[1]);
          const pad=numMatch[1].length;
          ot.lotes.forEach(l=>{
            const m=l.nombre.match(/^(.+?)(\d+)$/);
            if(m && m[1]===prefix){
              const n=parseInt(m[2]);
              if(n>deletedNum){
                l.nombre=prefix+String(n-1).padStart(pad,'0');
              }
            }
          });
        }
        if(state.filters.filterLote===loteId) state.filters.filterLote='';
        savePersisted(); render();
      } else {
        state.modal={type:'lote-accion',loteId:b.dataset.loteId,accion};
        render();
      }
    });
  });
  on('btn-lote-confirm','click',()=>{
    const obs=document.getElementById('inp-obs')?.value||'';
    const author=(document.getElementById('inp-author')?.value||'').trim();
    if(!author){ alert('Ingresá tu nombre.'); return; }
    const ot=activeOt(); if(!ot) return;
    const lote=ot.lotes?.find(l=>l.id===state.modal.loteId); if(!lote) return;
    const accion=state.modal.accion;
    lote.estado=accion==='aprobar'?'aprobado':'rechazado';
    if(!lote.historial) lote.historial=[];
    lote.historial.push({author,date:nowStr(),text:obs,action:accion==='aprobar'?'approved':'rejected'});
    state.lastAuthor=author; state.modal=null; savePersisted(); render();
  });

  // lote pos obs
  document.querySelectorAll('[data-lote-pos-obs]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.modal={type:'lote-obs',loteId:b.dataset.lotePosObs,posId:b.dataset.posId};
      render();
    });
  });
  on('btn-lote-save-obs','click',()=>{
    const obs=(document.getElementById('inp-obs')?.value||'').trim();
    const author=(document.getElementById('inp-author')?.value||'').trim();
    if(!author){ alert('Ingresá tu nombre.'); return; }
    if(!obs){ alert('Escribí una observación.'); return; }
    const ot=activeOt(); if(!ot) return;
    const lote=ot.lotes?.find(l=>l.id===state.modal.loteId); if(!lote) return;
    if(state.modal.spid){
      if(!lote.subPosObs) lote.subPosObs={};
      lote.subPosObs[state.modal.spid]=obs;
    } else if(state.modal.posId){
      if(!lote.posObs) lote.posObs={};
      lote.posObs[state.modal.posId]=obs;
    } else {
      if(!lote.historial) lote.historial=[];
      lote.historial.push({author,date:nowStr(),text:obs,action:'note'});
    }
    state.lastAuthor=author; state.modal=null; savePersisted(); render();
  });

  // lote pos estado
  document.querySelectorAll('[data-lote-pos-est]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===b.dataset.lotePosEst); if(!lote) return;
      if(!lote.posEstados) lote.posEstados={};
      lote.posEstados[b.dataset.posId]=b.dataset.est;
      savePersisted(); render();
    });
  });

  // lote asignar sub-pos (calidad)
  document.querySelectorAll('[data-lote-asignar-sub]').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      state.modal={type:'lote-asignar-sub',spid:b.dataset.loteAsignarSub};
      render();
    });
  });

  on('btn-sub-lote-ok','click',()=>{
    const ot=activeOt(); if(!ot) return;
    const [parentId,subId]=state.modal.spid.split('::');
    const pos=ot.positions.find(p=>p.id===parentId); if(!pos) return;
    const sub=pos.subs?.find(s=>s.subId===subId); if(!sub) return;
    const loteNuevo=(document.getElementById('inp-lote-nuevo')?.value||'').trim();
    const loteExistente=document.getElementById('sel-lote-existente')?.value||'';
    if(!loteNuevo && !loteExistente){ alert('Elegí o creá un lote.'); return; }
    if(!ot.lotes) ot.lotes=[];
    let loteId;
    if(loteNuevo){
      const existe=ot.lotes.find(l=>l.nombre===loteNuevo);
      if(existe){ loteId=existe.id; }
      else { loteId=genId(); ot.lotes.push({id:loteId,nombre:loteNuevo,fecha:nowStr(),estado:'pendiente',posIds:[],subPosIds:[],historial:[],min:'',max:'',promedio:''}); }
    } else { loteId=loteExistente; }
    const spid=state.modal.spid;
    // remove from old lote
    if(sub.loteId && sub.loteId!==loteId){
      const old=ot.lotes.find(l=>l.id===sub.loteId);
      if(old?.subPosIds) old.subPosIds=old.subPosIds.filter(x=>x!==spid);
    }
    sub.loteId=loteId;
    const lote=ot.lotes.find(l=>l.id===loteId);
    if(lote){ if(!lote.subPosIds) lote.subPosIds=[]; if(!lote.subPosIds.includes(spid)) lote.subPosIds.push(spid); }
    state.modal=null; savePersisted(); render();
  });
  on('btn-sub-lote-quitar','click',()=>{
    const ot=activeOt(); if(!ot) return;
    const [parentId,subId]=state.modal.spid.split('::');
    const pos=ot.positions.find(p=>p.id===parentId); if(!pos) return;
    const sub=pos.subs?.find(s=>s.subId===subId); if(!sub) return;
    const spid=state.modal.spid;
    if(sub.loteId){
      const lote=ot.lotes?.find(l=>l.id===sub.loteId);
      if(lote?.subPosIds) lote.subPosIds=lote.subPosIds.filter(x=>x!==spid);
      sub.loteId=null;
    }
    state.modal=null; savePersisted(); render();
  });

  // lote asignar (produccion)
  document.querySelectorAll('[data-lote-asignar]').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      state.modal={type:'lote-asignar',posId:b.dataset.loteAsignar};
      render();
    });
  });
  on('btn-lote-asignar-ok','click',()=>{
    const ot=activeOt(); if(!ot) return;
    const pos=ot.positions.find(p=>p.id===state.modal.posId); if(!pos) return;
    const loteNuevo=(document.getElementById('inp-lote-nuevo')?.value||'').trim();
    const loteExistente=document.getElementById('sel-lote-existente')?.value||'';
    if(!loteNuevo && !loteExistente){ alert('Elegí o creá un lote.'); return; }
    if(!ot.lotes) ot.lotes=[];
    let loteId;
    if(loteNuevo){
      const existe=ot.lotes.find(l=>l.nombre===loteNuevo);
      if(existe){ loteId=existe.id; }
      else { loteId=genId(); ot.lotes.push({id:loteId,nombre:loteNuevo,fecha:nowStr(),estado:'pendiente',posIds:[],historial:[],min:'',max:'',promedio:''}); }
    } else {
      loteId=loteExistente;
    }
    // remove from old lote if any
    if(pos.loteId && pos.loteId!==loteId){
      const oldLote=ot.lotes.find(l=>l.id===pos.loteId);
      if(oldLote) oldLote.posIds=oldLote.posIds.filter(id=>id!==pos.id);
    }
    pos.loteId=loteId;
    const lote=ot.lotes.find(l=>l.id===loteId);
    if(lote && !lote.posIds.includes(pos.id)) lote.posIds.push(pos.id);
    state.modal=null; savePersisted(); render();
  });
  on('btn-lote-quitar','click',()=>{
    const ot=activeOt(); if(!ot) return;
    const pos=ot.positions.find(p=>p.id===state.modal.posId); if(!pos) return;
    if(pos.loteId){
      const lote=ot.lotes?.find(l=>l.id===pos.loteId);
      if(lote) lote.posIds=lote.posIds.filter(id=>id!==pos.id);
      pos.loteId=null;
    }
    state.modal=null; savePersisted(); render();
  });

  // admin view switcher
  document.querySelectorAll('[data-adminview]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.adminView=b.dataset.adminview;
      // if currently on packing view, switch to tablero
      if(state.view==='packing') state.view='tablero';
      render();
    });
  });

  // logo / home
  on('btn-home','click',()=>{ state.view='home'; state.activeOtId=null; savePersisted(); render(); });

  // role modal opener
  on('btn-role-modal','click',()=>{
    state.modal={type:'role-select'};
    render();
  });
  on('btn-role-confirm','click',()=>{
    const newRole=document.getElementById('sel-role')?.value;
    if(newRole&&newRole!==state.role){
      state.role=newRole;
      state.view='home';
      state.activeOtId=null;
      savePrefs();
    }
    state.modal=null; render();
  });

  // nav (tablero/posiciones/packing)
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
    state.view=b.dataset.nav; render();
  }));

  // theme toggle
  on('btn-theme-toggle','click',()=>{
    state.theme=state.theme==='dark'?'light':'dark';
    savePrefs(); render();
  });

  // nueva OT
  on('btn-new-ot','click',()=>{ state.modal={type:'new-ot'}; render(); });

  // OT home card click
  document.querySelectorAll('[data-ot-nav]').forEach(card=>{
    card.addEventListener('click',()=>{
      state.activeOtId=card.dataset.otNav;
      const isMobile=window.innerWidth<=768;
      state.view=state.role==='ingenieria'?'packing':(isMobile?'posiciones':'tablero');
      savePersisted(); render();
    });
  });

  // modals
  on('btn-close','click',()=>{ state.modal=null; state.corrTarget=null; render(); });
  on('modal-overlay','click',e=>{ if(e.target.id==='modal-overlay'){ state.modal=null; state.corrTarget=null; render(); }});

  // new OT
  on('btn-new-ot','click',()=>{ state.modal={type:'new-ot'}; render(); });
  on('btn-confirm-new-ot','click',()=>{
    const newOt={ id:genId(), info:{proyecto:'Nueva OT',ot:'—',cliente:'—'}, plPublished:false, draftPositions:[], positions:[] };
    state.ots.push(newOt);
    state.activeOtId=newOt.id;
    state.modal=null; savePersisted(); render();
  });

  // delete OT
  on('btn-delete-ot','click',()=>{
    if(!isAdmin()){ alert('Solo el rol Admin puede eliminar OTs.'); return; }
    state.modal={type:'delete-ot'}; render();
  });
  on('btn-confirm-delete-ot','click',()=>{
    const pw=document.getElementById('inp-delete-pw')?.value||'';
    if(pw!=='CIMOMET'){ alert('Contraseña incorrecta.'); return; }
    state.ots=state.ots.filter(o=>o.id!==state.activeOtId);
    state.activeOtId=state.ots.length?state.ots[state.ots.length-1].id:null;
    state.view='home';
    state.modal=null; savePersisted(); render();
  });

  // reupload Excel (when packing already published)
  on('btn-reupload-excel','click',()=>{
    document.getElementById('file-input-reupload')?.click();
  });
  const reuploadInput=document.getElementById('file-input-reupload');
  if(reuploadInput){
    reuploadInput.addEventListener('change',e=>{
      const file=e.target.files?.[0];
      if(file) parseExcel(file);
    });
  }
  on('btn-reupload-confirm','click',()=>{
    const ot=activeOt(); if(!ot||!state.modal?.newRows) return;
    performReuploadMerge(ot, state.modal.newRows);
  });

  // home tab switcher
  document.querySelectorAll('[data-home-tab]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.homeTab=b.dataset.homeTab;
      render();
    });
  });

  // archive / unarchive OT (admin only)
  on('btn-archive-ot','click',()=>{
    if(!isAdmin()){ alert('Solo el rol Admin puede archivar OTs.'); return; }
    const ot=activeOt(); if(!ot) return;
    if(!confirm(`¿Archivar la OT ${ot.info.ot||''} — ${ot.info.proyecto||''}?\n\nLa OT desaparecerá del listado principal pero seguirá accesible en "Archivadas". Podés reabrirla en cualquier momento.`)) return;
    ot.archived=true;
    ot.archivedAt=nowStr();
    state.view='home';
    state.homeTab='activas';
    state.activeOtId=null;
    savePersisted(); render();
  });
  on('btn-unarchive-ot','click',()=>{
    if(!isAdmin()){ alert('Solo el rol Admin puede reabrir OTs.'); return; }
    const ot=activeOt(); if(!ot) return;
    ot.archived=false;
    delete ot.archivedAt;
    savePersisted(); render();
  });

  // packing list
  on('btn-reset','click',()=>{
    const ot=activeOt(); if(ot){ ot.draftPositions=[]; state.parseError=null; savePersisted(); render(); }
  });
  on('btn-publish','click',()=>{
    const ot=activeOt(); if(!ot) return;
    ot.positions=ot.draftPositions.map(p=>{
      const qty=Number(p.qty)||1;
      const subs = qty>1
        ? Array.from({length:qty},(_,i)=>({
            subId:`${p.pos}-${i+1}`,
            processes:mkProcs(), activeProc:0
          }))
        : null;
      return {id:p.pos,...p, processes:mkProcs(), activeProc:0, subs};
    });
    ot.plPublished=true; savePersisted(); render();
  });

  // packing list — editable cells (OT info)
  document.querySelectorAll('.ing-info-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      ot.info[inp.dataset.field]=inp.value.trim();
      savePersisted(); render();
    });
  });

  // editable position cells
  document.querySelectorAll('.pl-cell-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      const idx=parseInt(inp.dataset.idx); const col=inp.dataset.col;
      const row=ot.draftPositions[idx]; if(!row) return;
      const oldQty=Number(row.qty)||0;
      if(col==='qty'||col==='pesoUnit'||col==='pesoTotal') row[col]=inp.value===''?'':Number(inp.value);
      else row[col]=inp.value;
      // sync to positions if published
      if(ot.plPublished){
        const posId=row.pos;
        const pos=ot.positions.find(p=>p.id===posId);
        if(pos){
          pos[col]=row[col];
          if(col==='qty'){
            const newQty=Number(row.qty)||0;
            pos.qty=newQty;
            if(newQty>1){
              if(!pos.subs) pos.subs=[];
              while(pos.subs.length<newQty) pos.subs.push({subId:`${posId}-${pos.subs.length+1}`,processes:mkProcs(),activeProc:0});
              if(pos.subs.length>newQty) pos.subs=pos.subs.slice(0,newQty);
            } else {
              pos.subs=null;
            }
          }
        }
      }
      savePersisted(); render();
    });
  });

  // delete row
  document.querySelectorAll('[data-del-row]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const idx=parseInt(b.dataset.delRow);
      const row=ot.draftPositions[idx];
      if(ot.plPublished) ot.positions=ot.positions.filter(p=>p.id!==row?.pos);
      ot.draftPositions.splice(idx,1);
      savePersisted(); render();
    });
  });

  // add row
  on('btn-add-row','click',()=>{
    const ot=activeOt(); if(!ot) return;
    const pos   =($('nr-pos')?.value||'').trim();
    const denom =($('nr-denom')?.value||'').trim();
    const plano =($('nr-plano')?.value||'').trim();
    const qty   =Number($('nr-qty')?.value)||0;
    const puint =Number($('nr-puint')?.value)||0;
    const ptotal=Number($('nr-ptotal')?.value)||0;
    const constr=($('nr-const')?.value||'').trim();
    const prior =($('nr-prior')?.value||'').trim();
    if(!pos){ alert('El nombre de posición es obligatorio.'); return; }
    const newRow={pos,denom,plano,qty,pesoUnit:puint,pesoTotal:ptotal,construye:constr,prioridad:prior};
    ot.draftPositions.push(newRow);
    if(ot.plPublished){
      const newPos={id:pos,...newRow,processes:mkProcs(),activeProc:0,subs:null};
      if(qty>1) newPos.subs=Array.from({length:qty},(_,i)=>({subId:`${pos}-${i+1}`,processes:mkProcs(),activeProc:0}));
      ot.positions.push(newPos);
    }
    savePersisted(); render();
  });

  // upload
  const uz=$('upload-zone'); const fi=$('file-input');
  if(uz){
    uz.addEventListener('click',()=>fi&&fi.click());
    uz.addEventListener('dragover',e=>{ e.preventDefault(); uz.classList.add('drag'); });
    uz.addEventListener('dragleave',()=>uz.classList.remove('drag'));
    uz.addEventListener('drop',e=>{ e.preventDefault(); uz.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) parseExcel(f); });
  }
  if(fi) fi.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) parseExcel(f); });

  // calidad ext avance inputs
  document.querySelectorAll('.calext-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      if(!ot.calExtData) ot.calExtData={};
      const id=inp.dataset.extid; const field=inp.dataset.extfield;
      if(!ot.calExtData[id]) ot.calExtData[id]={};
      let val=parseInt(inp.value);
      if(isNaN(val)) val=''; else val=Math.max(0,val);
      inp.value=val===''?'':val;
      ot.calExtData[id][field]=val;
      savePersisted(); render();
    });
  });

  // rendimiento inputs (admin only)
  document.querySelectorAll('.rend-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      if(!ot.rendimientos) ot.rendimientos={};
      ot.rendimientos[inp.dataset.rend]=inp.value.trim();
      savePersisted();
    });
  });

  // prod inputs — save on change
  document.querySelectorAll('.prod-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      if(!ot.prodData) ot.prodData={};
      const id=inp.dataset.id; const field=inp.dataset.field;
      if(!ot.prodData[id]) ot.prodData[id]={};
      let val=inp.value;
      if(field==='avanceArmado'||field==='avanceSoldadura'){
        let n=parseInt(val);
        if(isNaN(n)) n='';
        else n=Math.min(100,Math.max(0,n));
        inp.value=n;
        val=n;
      }
      if(field==='pintado'){
        let n=parseInt(val);
        if(isNaN(n)) n='';
        else n=Math.max(0,n);
        inp.value=n;
        val=n;
      }
      ot.prodData[id][field]=val;
      savePersisted();
      render();
    });
  });

  // search — filter on Enter or blur (so mobile keyboard stays open while typing)
  const inpB=document.getElementById('inp-buscar');
  if(inpB){
    inpB.addEventListener('input',e=>{ state.filters.buscar=e.target.value; });
    inpB.addEventListener('blur', ()=>{ render(); });
    inpB.addEventListener('keydown',e=>{ if(e.key==='Enter'){ inpB.blur(); } });
  }

  // taller "Todos" button
  document.querySelectorAll('[data-taller-all]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.filters.talleres=[];
      state.filters.prioridad='';
      render();
    });
  });

  // taller multi-select
  document.querySelectorAll('[data-taller]').forEach(b=>{
    b.addEventListener('click',()=>{
      const t=b.dataset.taller;
      const arr=state.filters.talleres||[];
      if(arr.includes(t)){
        state.filters.talleres=arr.filter(x=>x!==t);
      } else {
        state.filters.talleres=[...arr,t];
      }
      state.filters.prioridad=''; // reset prioridad when taller changes
      render();
    });
  });

  // filters
  document.querySelectorAll('[data-fk]').forEach(b=>b.addEventListener('click',()=>{
    state.filters[b.dataset.fk]=b.dataset.fv; render();
  }));

  // prod apply-all: copy parent prodData to all sub-positions
  document.querySelectorAll('[data-applyall]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const posId=b.dataset.applyall;
      const pos=ot.positions.find(p=>p.id===posId); if(!pos||!pos.subs) return;
      if(!ot.prodData) ot.prodData={};
      const parentData={...ot.prodData[posId]||{}};
      pos.subs.forEach((_,i)=>{
        ot.prodData[`${posId}__${i}`]={...parentData};
      });
      savePersisted(); render();
    });
  });

  // cal apply-all per process (mobile card button)
  document.querySelectorAll('[data-act="calapplyall-proc"]').forEach(b=>{
    if(b.disabled) return;
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const posId=b.dataset.id;
      const pidx=parseInt(b.dataset.pidx);
      // open inspect modal but mark as applyall
      state.modal={type:'inspect', posId, procIdx:pidx, subIdx:null, applyAllSubs:true};
      state.corrTarget=null; render();
    });
  });

  // cal apply-all: copy parent processes state to all sub-positions
  document.querySelectorAll('[data-calapplyall]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const posId=b.dataset.calapplyall;
      const pos=ot.positions.find(p=>p.id===posId); if(!pos||!pos.subs) return;
      pos.subs.forEach(sub=>{
        sub.processes=pos.processes.map(p=>({...p}));
        let next=0;
        while(next<PROCS.length&&sub.processes[next].status==='approved') next++;
        sub.activeProc=next;
      });
      savePersisted(); render();
    });
  });

  // expand rejected obs rows in tablero
  document.querySelectorAll('[data-expand-rej]').forEach(el=>{
    el.addEventListener('click',()=>{
      const key=el.dataset.expandRej;
      state.expanded[key]=!state.expanded[key];
      render();
    });
  });

  // expand/collapse sub-positions — handle both row click and button click
  document.querySelectorAll('[data-expand]').forEach(el=>{
    el.addEventListener('click',e=>{
      // don't expand if clicking an action button, input, or apply-all inside the row
      if(e.target.closest('.abtn,.abtn-group,.prod-input,[data-applyall],[data-calapplyall],[data-act],[data-expand-inline]')) return;
      e.stopPropagation();
      const id=el.dataset.expand;
      state.expanded[id]=!state.expanded[id];
      render();
    });
  });

  // inline arrow button for expand in mobile cal cards
  document.querySelectorAll('[data-expand-inline]').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const id=b.dataset.expandInline;
      state.expanded[id]=!state.expanded[id];
      render();
    });
  });

  // actions
  document.querySelectorAll('[data-act]').forEach(b=>{
    if(b.disabled) return;
    b.addEventListener('click',()=>{
      const act=b.dataset.act;
      const id=b.dataset.id;
      const subIdx=b.dataset.subidx!==undefined?parseInt(b.dataset.subidx):null;
      if(act==='modificar'){
        state.modal={type:'modificar', posId:id, procIdx:parseInt(b.dataset.pidx), subIdx};
      } else if(act==='inspect-proc'){
        state.modal={type:'inspect', posId:id, procIdx:parseInt(b.dataset.pidx), subIdx};
      } else {
        state.modal={type:act, posId:id, subIdx};
      }
      state.corrTarget=null; render();
    });
  });
  document.querySelectorAll('[data-pidx]').forEach(el=>{
    el.addEventListener('click',()=>{ state.corrTarget=parseInt(el.dataset.pidx); render(); });
  });

  on('btn-confirm-assign','click',()=>{
    const w=$('sel-w').value;
    const ot=activeOt(); if(!ot) return;
    const pos=ot.positions.find(p=>p.id===state.modal.posId);
    if(pos){ pos.processes[pos.activeProc].assignee=w; pos.processes[pos.activeProc].status='pending'; }
    state.modal=null; savePersisted(); render();
  });
  on('btn-confirm-corr','click',()=>{
    if(state.corrTarget===null) return;
    const ot=activeOt(); if(!ot) return;
    const pos=ot.positions.find(p=>p.id===state.modal.posId);
    if(pos){
      for(let i=state.corrTarget;i<PROCS.length;i++) pos.processes[i]={status:'pending',assignee:null,obs:''};
      pos.activeProc=state.corrTarget;
    }
    state.modal=null; state.corrTarget=null; savePersisted(); render();
  });
  on('btn-do-approve','click',()=>doInspect('approved'));
  on('btn-do-reject', 'click',()=>doInspect('rejected'));
  on('btn-do-partial','click',()=>doPartial());
  on('btn-mod-approve','click',()=>doModificar('approved'));
  on('btn-mod-reject', 'click',()=>doModificar('rejected'));
  on('btn-mod-save',   'click',()=>doModificar(null));
  on('btn-mod-anular', 'click',()=>doAnular());

  // edit specific history entry
  document.querySelectorAll('[data-edit-idx]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.modal={...state.modal, editHistoryIdx:parseInt(b.dataset.editIdx)};
      render();
    });
  });
  on('btn-cancel-edit','click',()=>{
    state.modal={...state.modal, editHistoryIdx:undefined};
    render();
  });
  on('btn-save-edit','click',()=>{
    const newText=document.getElementById('inp-edit-obs')?.value||'';
    const ot=activeOt(); if(!ot) return;
    const pos=ot.positions.find(p=>p.id===state.modal.posId); if(!pos) return;
    const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
    const processes=getProcesses(pos,subIdx);
    const proc=processes[state.modal.procIdx];
    if(!proc.history) proc.history=[];
    proc.history[state.modal.editHistoryIdx].text=newText;
    state.modal={...state.modal, editHistoryIdx:undefined};
    savePersisted(); render();
  });
}

function doModificar(result){
  const obs=document.getElementById('inp-obs')?.value||'';
  const author=(document.getElementById('inp-author')?.value||'').trim();
  if(!author){ alert('Ingresá tu nombre como inspector.'); return; }
  const ot=activeOt(); if(!ot) return;
  const pos=ot.positions.find(p=>p.id===state.modal.posId); if(!pos) return;
  const pidx=state.modal.procIdx;
  const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
  const processes=getProcesses(pos,subIdx);
  const proc=processes[pidx];
  if(!proc.history) proc.history=[];
  if(result===null){
    // just add a note, keep status — tag shows current status
    const currentAction=proc.status==='approved'?'approved':proc.status==='rejected'?'rejected':'note';
    proc.history.push({author,date:nowStr(),text:obs,action:currentAction});
  } else {
    if(result==='approved'&&pidx===1&&processes[0].status!=='approved'){
      alert('No se puede aprobar Soldadura sin haber aprobado el Armado primero.');
      return;
    }
    proc.history.push({author,date:nowStr(),text:obs,action:result});
    proc.status=result;
    proc.obs=obs;
    state.lastAuthor=author;
    let next=0;
    while(next<PROCS.length&&processes[next].status==='approved') next++;
    if(subIdx===null) pos.activeProc=next;
    else if(pos.subs[subIdx]) pos.subs[subIdx].activeProc=next;
  }
  state.lastAuthor=author;
  state.modal=null; savePersisted(); render();
}

function getProcesses(pos, subIdx){
  if(subIdx!==null&&subIdx!==undefined&&pos.subs&&pos.subs[subIdx]) return pos.subs[subIdx].processes;
  return pos.processes;
}

function historyTag(action){
  const map={
    partial:  ['tag-partial','Parcial'],
    approved: ['tag-approved','Aprobó'],
    rejected: ['tag-rejected','Rechazó'],
    note:     ['tag-note','Nota'],
    anulado:  ['tag-anulado','Anuló'],
  };
  const [cls,label]=map[action]||['tag-note','—'];
  return `<span class="history-tag ${cls}">${label}</span>`;
}

function doAnular(){
  const obs=document.getElementById('inp-obs')?.value||'';
  const author=(document.getElementById('inp-author')?.value||'').trim();
  if(!author){ alert('Ingresá tu nombre.'); return; }
  if(!obs.trim()){ alert('La causa de anulación es obligatoria.'); return; }
  const ot=activeOt(); if(!ot) return;
  const pos=ot.positions.find(p=>p.id===state.modal.posId); if(!pos) return;
  const pidx=state.modal.procIdx;
  const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
  const processes=getProcesses(pos,subIdx);
  const proc=processes[pidx];
  if(!proc.history) proc.history=[];
  proc.history.push({author,date:nowStr(),text:obs,action:'anulado'});
  // reset to pending
  proc.status='pending';
  proc.obs='';
  // recalc activeProc
  let next=0;
  while(next<PROCS.length&&processes[next].status==='approved') next++;
  if(subIdx===null) pos.activeProc=next;
  else if(pos.subs?.[subIdx]) pos.subs[subIdx].activeProc=next;
  state.lastAuthor=author;
  state.modal=null; savePersisted(); render();
}

function nowStr(){
  const d=new Date();
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  const hh=String(d.getHours()).padStart(2,'0');
  const mi=String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
}

function doPartial(){
  const obs=document.getElementById('inp-obs')?.value||'';
  const author=(document.getElementById('inp-author')?.value||'').trim();
  if(!author){ alert('Ingresá tu nombre como inspector.'); return; }
  if(!obs.trim()){ alert('Escribí al menos una observación para registrar el control parcial.'); return; }
  const ot=activeOt(); if(!ot) return;
  const pos=ot.positions.find(p=>p.id===state.modal.posId); if(!pos) return;
  const pidx=state.modal.procIdx!==undefined?state.modal.procIdx:pos.activeProc;
  const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
  const applyAll=state.modal.applyAllSubs&&pos.subs&&pos.subs.length>0;

  const applyToProcesses=(processes)=>{
    if(!processes[pidx].history) processes[pidx].history=[];
    processes[pidx].history.push({author,date:nowStr(),text:obs,action:'partial'});
  };

  if(applyAll){
    pos.subs.forEach(sub=>applyToProcesses(sub.processes));
  } else {
    applyToProcesses(getProcesses(pos,subIdx));
  }
  state.lastAuthor=author;
  state.modal=null; savePersisted(); render();
}

function doInspect(result){
  const author=(document.getElementById('inp-author')?.value||'').trim();
  if(!author){ alert('Ingresá tu nombre como inspector.'); return; }
  const ot=activeOt(); if(!ot) return;
  const pos=ot.positions.find(p=>p.id===state.modal.posId); if(!pos) return;
  const pidx=state.modal.procIdx!==undefined?state.modal.procIdx:pos.activeProc;
  const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
  const applyAll=state.modal.applyAllSubs&&pos.subs&&pos.subs.length>0;
  const isPIN=pidx===2;
  const obs=isPIN?'':(document.getElementById('inp-obs')?.value||'');

  // handle lote assignment for PIN approval
  let loteId=null;
  if(isPIN && result==='approved'){
    const loteNuevo=(document.getElementById('inp-lote-nuevo')?.value||'').trim();
    const loteExistente=document.getElementById('sel-lote-existente')?.value||'';
    if(!loteNuevo && !loteExistente){ alert('Asigná un lote de pintura antes de aprobar.'); return; }
    if(!ot.lotes) ot.lotes=[];
    if(loteNuevo){
      const existe=ot.lotes.find(l=>l.nombre===loteNuevo);
      if(existe){ loteId=existe.id; }
      else {
        loteId=genId();
        ot.lotes.push({id:loteId,nombre:loteNuevo,fecha:nowStr(),estado:'pendiente',posIds:[],historial:[],min:'',max:'',promedio:''});
      }
    } else {
      loteId=loteExistente;
    }
  }

  const applyToProcesses=(processes, posId)=>{
    if(result==='approved'&&pidx===1&&processes[0].status!=='approved') return false;
    if(!processes[pidx].history) processes[pidx].history=[];
    processes[pidx].history.push({author,date:nowStr(),text:obs,action:result,loteId:loteId||undefined});
    processes[pidx].status=result;
    processes[pidx].obs=obs;
    if(isPIN && loteId && result==='approved'){
      const targetPos=ot.positions.find(p=>p.id===posId);
      if(targetPos){
        if(subIdx!==null && targetPos.subs?.[subIdx]){
          // assign to sub-posicion
          const sub=targetPos.subs[subIdx];
          const spid=`${posId}::${sub.subId}`;
          if(!sub.loteId) sub.loteId=loteId;
          const lote=ot.lotes?.find(l=>l.id===loteId);
          if(lote){ if(!lote.subPosIds) lote.subPosIds=[]; if(!lote.subPosIds.includes(spid)) lote.subPosIds.push(spid); }
        } else {
          // assign to position
          if(!targetPos.loteId) targetPos.loteId=loteId;
          const lote=ot.lotes?.find(l=>l.id===loteId);
          if(lote && !lote.posIds.includes(posId)) lote.posIds.push(posId);
        }
      }
    }
    return true;
  };

  if(applyAll){
    let blocked=false;
    pos.subs.forEach(sub=>{ if(!applyToProcesses(sub.processes, pos.id)) blocked=true; });
    if(blocked){ alert('No se puede aprobar Soldadura sin haber aprobado el Armado primero.'); return; }
  } else {
    const processes=getProcesses(pos,subIdx);
    if(!applyToProcesses(processes, pos.id)){ alert('No se puede aprobar Soldadura sin haber aprobado el Armado primero.'); return; }
    let next=0;
    while(next<PROCS.length&&processes[next].status==='approved') next++;
    if(subIdx===null) pos.activeProc=next;
    else if(pos.subs?.[subIdx]) pos.subs[subIdx].activeProc=next;
  }

  state.lastAuthor=author;
  state.modal=null; savePersisted(); render();
}

// ── EXCEL PARSER ──────────────────────────────────────────
function parseExcel(file){
  const ot=activeOt(); if(!ot) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

      // read project info from Excel header rows (col 3=label, col 4=value)
      const info={proyecto:'',ot:'',cliente:''};
      // scan first 8 rows, all columns, looking for label+value pairs
      for(let i=0;i<8;i++){
        const row=raw[i]||[];
        for(let c=0;c<row.length-1;c++){
          const lbl=String(row[c]||'').toUpperCase().trim();
          const val=String(row[c+1]||'').trim();
          if(!lbl||!val) continue;
          if(lbl.includes('PROYECTO')) info.proyecto=val;
          else if((lbl==='OT'||lbl==='OT:'||lbl.match(/^N[°ºo]?\s*(DE\s*)?OT/))) info.ot=val.replace(/\.0$/,'');
          else if(lbl.includes('CLIENTE')) info.cliente=val;
        }
      }
      // always update OT info from Excel
      console.log('Info leída del Excel:', info);
      if(info.proyecto) ot.info.proyecto=info.proyecto;
      if(info.ot) ot.info.ot=info.ot;
      if(info.cliente) ot.info.cliente=info.cliente;

      // find header row by looking for 'POSICIÓN' or 'POSICION'
      let headerRow=-1;
      let colMap={pos:-1,plano:-1,denom:-1,qty:-1,pesoUnit:-1,pesoTotal:-1,construye:-1,prioridad:-1};
      for(let i=0;i<20;i++){
        const row=raw[i]||[];
        const rowStr=row.map(c=>String(c||'').toUpperCase().trim());
        const posIdx=rowStr.findIndex(c=>c==='POSICIÓN'||c==='POSICION');
        if(posIdx>=0){
          headerRow=i;
          colMap.pos=posIdx;
          colMap.plano=rowStr.findIndex(c=>c.includes('PLANO'));
          colMap.denom=rowStr.findIndex(c=>c.includes('DENOM'));
          colMap.qty=rowStr.findIndex(c=>c==='CANTIDAD'||c==='CANT.');
          colMap.pesoUnit=rowStr.findIndex(c=>c.includes('PESO')&&c.includes('UNIT'));
          colMap.pesoTotal=rowStr.findIndex(c=>c.includes('PESO')&&(c.includes('TOTAL')||c.includes('TOT')));
          colMap.construye=rowStr.findIndex(c=>c.includes('CONSTRUYE'));
          colMap.prioridad=rowStr.findIndex(c=>c.includes('PRIORIDAD')||c.includes('PRIOR'));
          break;
        }
      }
      if(headerRow<0){ state.parseError='No se encontró la fila de encabezados. Verificá el archivo.'; render(); return; }

      const positions=[];
      for(let i=headerRow+1;i<raw.length;i++){
        const row=raw[i];
        const pos=colMap.pos>=0?String(row[colMap.pos]||'').trim():'';
        const plano=colMap.plano>=0?String(row[colMap.plano]||'').trim():'';
        if(!pos||!plano) continue;

        const rawQty=colMap.qty>=0?row[colMap.qty]:'';
        const rawPU=colMap.pesoUnit>=0?row[colMap.pesoUnit]:'';
        const rawPT=colMap.pesoTotal>=0?row[colMap.pesoTotal]:'';
        const rawConstr=colMap.construye>=0?String(row[colMap.construye]||'').trim():'';
        const rawPrior=colMap.prioridad>=0?String(row[colMap.prioridad]||'').trim():'';

        const qty=rawQty!==''?Number(rawQty):'' ;
        const pesoUnit=rawPU!==''?Number(rawPU):'';
        const pesoTotal=rawPT!==''?Number(rawPT):'';

        positions.push({
          pos, plano,
          denom:  colMap.denom>=0?String(row[colMap.denom]||'').trim():'',
          qty:    isNaN(qty)?'':qty,
          pesoUnit:  isNaN(pesoUnit)?'':pesoUnit,
          pesoTotal: isNaN(pesoTotal)?'':pesoTotal,
          construye: rawConstr,
          prioridad: rawPrior,
        });
      }

      if(!positions.length){ state.parseError='No se encontraron posiciones válidas.'; }
      else{
        state.parseError=null;
        // Check if this is a re-upload (packing already published)
        if(ot.plPublished){
          handleReuploadMerge(ot, positions);
        } else {
          ot.draftPositions=positions;
          savePersisted();
        }
      }
    }catch(err){
      state.parseError='No se pudo leer el archivo. Asegurate de subir un .xls o .xlsx válido.';
      console.error(err);
    }
    render();
  };
  reader.readAsArrayBuffer(file);
}

// ── REUPLOAD MERGE ───────────────────────────────────────
// Returns true if a position has any avance/control/inspection data
function posHasWorkData(ot, posId, pos){
  const pd=ot.prodData?.[posId];
  if(pd && (pd.fechaInicioArmado||pd.avanceArmado||pd.fechaInicioSoldadura||pd.avanceSoldadura||pd.pintado)) return true;
  const ce=ot.calExtData?.[posId];
  if(ce && (ce.armadas||ce.soldadas||ce.pintadas)) return true;
  if(pos.processes && pos.processes.some(p=>p.status!=='pending'||(p.history||[]).length>0)) return true;
  if(pos.subs && pos.subs.some(s=>s.processes.some(p=>p.status!=='pending'||(p.history||[]).length>0))) return true;
  if(pos.loteId) return true;
  if(pos.subs && pos.subs.some(s=>s.loteId)) return true;
  return false;
}

// Compute what changes would happen without applying them
function computeReuploadChanges(ot, newRows){
  const existing=ot.positions||[];
  const existingById={};
  existing.forEach(p=>{ existingById[p.id]=p; });
  const newIds=new Set(newRows.map(r=>r.pos));

  const changes={added:[], removed:[], modified:[], qtyChanged:[], removedWithData:[]};

  const sameStr = (a,b) => String(a||'').trim() === String(b||'').trim();
  const sameNum = (a,b) => {
    const na=Number(a)||0, nb=Number(b)||0;
    return Math.abs(na-nb)<0.01;
  };

  // detect added and modified
  newRows.forEach(row=>{
    const old=existingById[row.pos];
    if(!old){
      changes.added.push({id:row.pos, denom:row.denom, qty:Number(row.qty)||1});
    } else {
      const oldQty=Number(old.qty)||1;
      const newQty=Number(row.qty)||1;
      const fieldChanges=[];
      if(!sameStr(old.denom, row.denom))           fieldChanges.push('denominación');
      if(!sameStr(old.plano, row.plano))           fieldChanges.push('plano');
      if(!sameNum(old.pesoUnit, row.pesoUnit))     fieldChanges.push('peso unit.');
      if(!sameNum(old.pesoTotal, row.pesoTotal))   fieldChanges.push('peso total');
      if(!sameStr(old.construye, row.construye))   fieldChanges.push('construye en');
      if(!sameStr(old.prioridad, row.prioridad))   fieldChanges.push('prioridad');
      if(oldQty!==newQty){
        changes.qtyChanged.push({id:row.pos, denom:row.denom, oldQty, newQty});
      } else if(fieldChanges.length>0){
        changes.modified.push({id:row.pos, denom:row.denom, fields:fieldChanges});
      }
    }
  });

  // detect removed
  existing.forEach(p=>{
    if(!newIds.has(p.id)){
      const hasData=posHasWorkData(ot, p.id, p);
      const item={id:p.id, denom:p.denom||'', qty:p.qty||1, hasData};
      changes.removed.push(item);
      if(hasData) changes.removedWithData.push(item);
    }
  });

  return changes;
}

function handleReuploadMerge(ot, newRows){
  // always show preview, don't auto-merge
  const changes=computeReuploadChanges(ot, newRows);
  state.modal={
    type:'reupload-preview',
    newRows,
    changes,
  };
  render();
}

function performReuploadMerge(ot, newRows){
  const existing=ot.positions||[];
  const existingById={};
  existing.forEach(p=>{ existingById[p.id]=p; });

  const newIds=new Set(newRows.map(r=>r.pos));
  const removedIds=existing.filter(p=>!newIds.has(p.id)).map(p=>p.id);

  // recompute changes for success summary
  const changes=computeReuploadChanges(ot, newRows);

  // build new positions list
  const newPositions=newRows.map(row=>{
    const existing=existingById[row.pos];
    if(existing){
      const oldQty=Number(existing.qty)||1;
      const newQty=Number(row.qty)||1;
      const merged={
        ...existing,
        denom: row.denom,
        plano: row.plano,
        pesoUnit: row.pesoUnit,
        pesoTotal: row.pesoTotal,
        construye: row.construye,
        prioridad: row.prioridad,
        qty: newQty,
      };
      if(newQty>1){
        if(!merged.subs) merged.subs=[];
        while(merged.subs.length<newQty){
          merged.subs.push({
            subId:`${row.pos}-${merged.subs.length+1}`,
            processes:mkProcs(),
            activeProc:0
          });
        }
        if(merged.subs.length>newQty) merged.subs=merged.subs.slice(0,newQty);
      } else {
        merged.subs=null;
      }
      return merged;
    } else {
      const fresh={
        id:row.pos,
        ...row,
        processes:mkProcs(),
        activeProc:0,
        subs:null
      };
      if(Number(row.qty)>1){
        fresh.subs=Array.from({length:Number(row.qty)},(_,i)=>({
          subId:`${row.pos}-${i+1}`,
          processes:mkProcs(),
          activeProc:0
        }));
      }
      return fresh;
    }
  });

  // clean prodData and calExtData for removed positions
  removedIds.forEach(id=>{
    delete ot.prodData?.[id];
    delete ot.calExtData?.[id];
    (ot.lotes||[]).forEach(l=>{
      if(l.posIds) l.posIds=l.posIds.filter(pid=>pid!==id);
      if(l.subPosIds) l.subPosIds=l.subPosIds.filter(spid=>!spid.startsWith(id+'::'));
    });
  });

  ot.positions=newPositions;
  ot.draftPositions=newRows;
  savePersisted();
  state.modal={type:'reupload-success', changes};
  render();
}




// ── INIT ──────────────────────────────────────────────────
(async ()=>{
  // show loading while fetching from Supabase
  document.getElementById('app').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;background:var(--bg)">
      <div style="width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite"></div>
      <div style="font-family:var(--mono);font-size:13px;color:var(--text3)">Conectando con Supabase…</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;

  // Only pull OTs from Supabase; role/theme/etc stay device-local
  const remote=await pullFromSupabase();
  if(remote && Array.isArray(remote.ots)){
    state.ots = remote.ots;
    // persist updated OTs to localStorage (alongside local prefs)
    savePrefs();
  }
  document.body.classList.toggle('light', state.theme==='light');
  render();

  // poll every 15s for OT changes from other devices
  setInterval(async ()=>{
    const fresh=await pullFromSupabase();
    if(!fresh || !Array.isArray(fresh.ots)) return;
    if(JSON.stringify(fresh.ots)!==JSON.stringify(state.ots)){
      state.ots=fresh.ots;
      savePrefs();
      render();
    }
  }, 15000);
})();
</script>
