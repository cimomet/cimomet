// ── POSICIONES ────────────────────────────────────────────
function renderPosView(ot){
  if(!ot||!ot.plPublished){
    return `<div class="topbar"><div><div class="topbar-title">Posiciones</div></div></div>
    <div class="content"><div class="empty">
      <div class="empty-title">${!ot?'Seleccioná una OT':'Sin packing list publicado'}</div>
      <div class="empty-sub">${!ot?'Elegí un proyecto en el panel izquierdo.':'Ingeniería aún no publicó el packing list.'}</div>
    </div></div>`;
  }
  if(state.role==='admin'||state.role==='control'){
    return state.adminView==='calidad' ? renderPosViewDefault(ot) : renderPosViewProduccion(ot);
  }
  if(roleIs('produccion')) return renderPosViewProduccion(ot);
  return renderPosViewDefault(ot);
}

// ── POSICIONES: PRODUCCION ────────────────────────────────
function renderPosViewProduccion(ot){
  const f=state.filters; const pi=ot.info;
  const positions=ot.positions||[];

  // ensure prodData map exists on ot
  if(!ot.prodData) ot.prodData={};

  // auto-migrate: generate subs for positions with qty>1 that don't have them yet
  if(ensureSubs(positions)) savePersisted();

  // normalize taller: empty/blank = CIMOMET
  function getTaller(pos){
    const c=String(pos.construye||'').trim();
    return c||'CIMOMET';
  }

  // unique talleres
  const talleres=[...new Set(positions.map(p=>getTaller(p)))].sort((a,b)=>{
    if(a==='CIMOMET') return -1;
    if(b==='CIMOMET') return 1;
    return a.localeCompare(b);
  });

  const selectedTalleres=f.talleres&&f.talleres.length>0?f.talleres:[];

  // unique sorted priorities from positions (respecting taller filter)
  const posForPrio=selectedTalleres.length>0?positions.filter(p=>selectedTalleres.includes(getTaller(p))):positions;
  const prioridades=[...new Set(posForPrio.map(p=>String(p.prioridad||'')).filter(Boolean))].sort();

  const filtered=positions.filter(pos=>{
    if(selectedTalleres.length>0 && !selectedTalleres.includes(getTaller(pos))) return false;
    if(f.prioridad && String(pos.prioridad||'')!==f.prioridad) return false;
    if(f.buscar){
      const q=f.buscar.toLowerCase();
      return String(pos.id||'').toLowerCase().includes(q)||String(pos.denom||'').toLowerCase().includes(q)||String(pos.plano||'').toLowerCase().includes(q);
    }
    return true;
  });

  const styleGreen = 'background:rgba(106,170,130,0.18);border-color:rgba(106,170,130,0.5);color:var(--green);';

  function prodInputs(dataKey, pos){
    const processes=pos.processes;
    const qty=Number(pos.qty)||1;
    const pd=ot.prodData[dataKey]||{};
    const ext=normLugar(pos.construye)==='ext';

    // for external: ARM/SOL come from calExtData, read-only
    const extData=ot.calExtData?.[pos.id]||{};
    const armExt=extData.armadas!==undefined?extData.armadas:'';
    const solExt=extData.soldadas!==undefined?extData.soldadas:'';
    const pctArmExt=armExt!==''&&qty>0?Math.round(Number(armExt)/qty*100):0;
    const pctSolExt=solExt!==''&&qty>0?Math.round(Number(solExt)/qty*100):0;

    const fechaInicioArmado   = pd.fechaInicioArmado||'';
    const avanceArmado        = ext ? pctArmExt : (pd.avanceArmado!==undefined?pd.avanceArmado:'');
    const fechaInicioSoldadura= pd.fechaInicioSoldadura||'';
    const avanceSoldadura     = ext ? pctSolExt : (pd.avanceSoldadura!==undefined?pd.avanceSoldadura:'');
    const pintado             = pd.pintado!==undefined?pd.pintado:'';
    const avanceArmadoOk    = avanceArmado!==''&&Number(avanceArmado)===100;
    const avanceSoldaduraOk = avanceSoldadura!==''&&Number(avanceSoldadura)===100;
    const pintadoOk         = pintado!==''&&qty&&Number(pintado)===qty;

    // CD and AP: count approved subs if qty>1, else use main process status
    let cdOk, apOk;
    if(pos.subs&&pos.subs.length>0){
      cdOk=pos.subs.filter(s=>s.processes[0]?.status==='approved').length;
      apOk=pos.subs.filter(s=>s.processes[1]?.status==='approved').length;
    } else {
      cdOk=processes[0]?.status==='approved'?1:0;
      apOk=processes[1]?.status==='approved'?1:0;
    }
    const total=pos.subs?pos.subs.length:1;

    const cdStatus= cdOk===total && total>0
      ? '<span class="chip chip-ok-sm">OK</span>'
      : cdOk>0
        ? `<span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--amber)">${cdOk}-CD</span>`
        : '<span style="color:var(--text3)">—</span>';

    const apStatus= apOk===total && total>0
      ? '<span class="chip chip-ok-sm">OK</span>'
      : apOk>0
        ? `<span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--amber)">${apOk}-AP</span>`
        : '<span style="color:var(--text3)">—</span>';

    const roStyle='background:var(--bg3);border-color:var(--border);color:var(--text2);cursor:default;';
    const extLabel=`<span style="font-family:var(--mono);font-size:11px;font-weight:600;${avanceArmadoOk?'color:var(--green)':'color:var(--text2)'}">${avanceArmado}%</span>`;
    const solLabel=`<span style="font-family:var(--mono);font-size:11px;font-weight:600;${avanceSoldaduraOk?'color:var(--green)':'color:var(--text2)'}">${avanceSoldadura}%</span>`;
    const extSrc=`<span style="font-family:var(--mono);font-size:9px;color:var(--text3);display:block">taller ext.</span>`;

    return `
      <td style="text-align:center">${ext ? '<span style="color:var(--text3)">—</span>' : `<input type="date" class="prod-input" data-id="${esc(dataKey)}" data-field="fechaInicioArmado" value="${esc(fechaInicioArmado)}" style="width:130px"/>`}</td>
      <td style="text-align:center">${ext
        ? `<div style="text-align:center">${extLabel}${extSrc}</div>`
        : `<input type="number" class="prod-input" data-id="${esc(dataKey)}" data-field="avanceArmado" value="${avanceArmado}" min="0" max="100" placeholder="0–100" style="width:70px;${avanceArmadoOk?styleGreen:''}"/>`}
      </td>
      <td style="text-align:center">${cdStatus}</td>
      <td style="text-align:center">${ext ? '<span style="color:var(--text3)">—</span>' : `<input type="date" class="prod-input" data-id="${esc(dataKey)}" data-field="fechaInicioSoldadura" value="${esc(fechaInicioSoldadura)}" style="width:130px"/>`}</td>
      <td style="text-align:center">${ext
        ? `<div style="text-align:center">${solLabel}${extSrc}</div>`
        : `<input type="number" class="prod-input" data-id="${esc(dataKey)}" data-field="avanceSoldadura" value="${avanceSoldadura}" min="0" max="100" placeholder="0–100" style="width:70px;${avanceSoldaduraOk?styleGreen:''}"/>`}
      </td>
      <td style="text-align:center">${apStatus}</td>
      <td><input type="number" class="prod-input" data-id="${esc(dataKey)}" data-field="pintado" value="${pintado}" min="0" placeholder="0" style="width:70px;${pintadoOk?styleGreen:''}"/></td>`;
  }

  const rows=filtered.map(pos=>{
    const parentInputs = prodInputs(pos.id, pos) + '<td></td>';

    const lote=ot.lotes?.find(l=>l.id===pos.loteId);
    const loteCell=`<td>
      <div style="display:flex;align-items:center;gap:4px">
        ${lote?`<span style="font-family:var(--mono);font-size:11px;color:var(--accent2)">${esc(lote.nombre)}</span>`:'<span style="color:var(--text3);font-size:11px">—</span>'}
        <button type="button" class="abtn" style="font-size:9px;padding:2px 6px" data-lote-asignar="${esc(pos.id)}">${lote?'✏':'+'}</button>
      </div>
    </td>`;

    return `<tr>
      <td class="mono" style="color:var(--accent);font-weight:500">${esc(pos.prioridad||'—')}</td>
      <td class="mono" style="font-weight:500">${esc(pos.id)}</td>
      <td class="mono">${pos.qty!==''&&pos.qty!==undefined?pos.qty:'—'}</td>
      <td><div style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(pos.denom)}">${esc(pos.denom)}</div></td>
      <td class="mono">${pos.pesoUnit!==''&&pos.pesoUnit!==undefined?Number(pos.pesoUnit).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}):'—'}</td>
      <td class="mono">${pos.pesoTotal!==''&&pos.pesoTotal!==undefined?Number(pos.pesoTotal).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}):'—'}</td>
      ${parentInputs}
      ${loteCell}
    </tr>`;
  }).join('');

  // ── mobile cards ──
  const mobileCards=filtered.map(pos=>{
    const pd=ot.prodData[pos.id]||{};
    const ext=normLugar(pos.construye)==='ext';
    const extData=ot.calExtData?.[pos.id]||{};
    const qty=Number(pos.qty)||1;
    const sg='background:rgba(106,170,130,0.18);border-color:rgba(106,170,130,0.5);color:var(--green);';

    // ARM/SOL: readonly from calExtData for external, editable for CIMOMET
    const avArm = ext
      ? (extData.armadas!==undefined ? Math.round(Number(extData.armadas)/qty*100) : 0)
      : (pd.avanceArmado!==undefined?pd.avanceArmado:'');
    const avSol = ext
      ? (extData.soldadas!==undefined ? Math.round(Number(extData.soldadas)/qty*100) : 0)
      : (pd.avanceSoldadura!==undefined?pd.avanceSoldadura:'');
    const fechaArm=ext?'':pd.fechaInicioArmado||'';
    const fechaSol=ext?'':pd.fechaInicioSoldadura||'';
    const pint=pd.pintado!==undefined?pd.pintado:'';
    const avArmOk=Number(avArm)===100;
    const avSolOk=Number(avSol)===100;
    const pintOk=pint!==''&&Number(pint)===qty;
    // cd/ap counts
    let cdOk,apOk,total;
    if(pos.subs&&pos.subs.length>0){
      cdOk=pos.subs.filter(s=>s.processes[0]?.status==='approved').length;
      apOk=pos.subs.filter(s=>s.processes[1]?.status==='approved').length;
      total=pos.subs.length;
    } else {
      cdOk=pos.processes[0]?.status==='approved'?1:0;
      apOk=pos.processes[1]?.status==='approved'?1:0;
      total=1;
    }
    const cdBadge=cdOk===total&&total>0?'<span class="chip chip-ok-sm">OK</span>':cdOk>0?`<span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--amber)">${cdOk}-CD</span>`:'<span style="color:var(--text3)">—</span>';
    const apBadge=apOk===total&&total>0?'<span class="chip chip-ok-sm">OK</span>':apOk>0?`<span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--amber)">${apOk}-AP</span>`:'<span style="color:var(--text3)">—</span>';

    return `<div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
            <span style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)">${esc(pos.id)}</span>
            ${pos.prioridad?`<span class="chip" style="background:rgba(79,142,247,0.1);color:var(--accent2);border-radius:20px;font-family:var(--mono);font-size:10px">${esc(pos.prioridad)}</span>`:''}
          </div>
          <div style="font-size:13px;color:var(--text2)">${esc(pos.denom)}</div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:2px">Cant: ${qty} · ${pos.pesoTotal!==''&&pos.pesoTotal!==undefined?Number(pos.pesoTotal).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+' kg':'—'}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">${cdBadge}${apBadge}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px">Armado${ext?' (ext.)':''}</div>
          ${ext
            ? `<div style="font-family:var(--mono);font-size:20px;font-weight:600;color:${avArmOk?'var(--green)':'var(--text2)'}">${avArm}%</div>
               <div style="font-family:var(--mono);font-size:10px;color:var(--text3)">${extData.armadas||0} / ${qty} unidades</div>`
            : `<input type="date" class="prod-input" data-id="${esc(pos.id)}" data-field="fechaInicioArmado" value="${esc(fechaArm)}" style="width:100%;margin-bottom:5px"/>
               <input type="number" class="prod-input" data-id="${esc(pos.id)}" data-field="avanceArmado" value="${avArm}" min="0" max="100" placeholder="% avance" style="width:100%;${avArmOk?sg:''}"/>`}
        </div>
        <div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px">Soldadura${ext?' (ext.)':''}</div>
          ${ext
            ? `<div style="font-family:var(--mono);font-size:20px;font-weight:600;color:${avSolOk?'var(--green)':'var(--text2)'}">${avSol}%</div>
               <div style="font-family:var(--mono);font-size:10px;color:var(--text3)">${extData.soldadas||0} / ${qty} unidades</div>`
            : `<input type="date" class="prod-input" data-id="${esc(pos.id)}" data-field="fechaInicioSoldadura" value="${esc(fechaSol)}" style="width:100%;margin-bottom:5px"/>
               <input type="number" class="prod-input" data-id="${esc(pos.id)}" data-field="avanceSoldadura" value="${avSol}" min="0" max="100" placeholder="% avance" style="width:100%;${avSolOk?sg:''}"/>`}
        </div>
      </div>
      <div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px">Pintado (unidades)</div>
        <input type="number" class="prod-input" data-id="${esc(pos.id)}" data-field="pintado" value="${pint}" min="0" placeholder="0" style="width:100%;${pintOk?sg:''}"/>
      </div>
    </div>`;
  }).join('');

  return `<div class="topbar">
    <div><div class="topbar-title">Posiciones</div><div class="topbar-meta">OT ${esc(pi.ot)} · ${esc(pi.proyecto||'')}</div></div>
  </div>
  <div class="content">
    <div style="margin-bottom:0.75rem">
      <input id="inp-buscar" type="text" placeholder="Buscar por posición, descripción o plano…" value="${esc(f.buscar)}" style="max-width:320px;background:var(--bg2);border-color:var(--border2);font-family:var(--mono);font-size:12px;"/>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <span class="filter-lbl">Taller</span>
      <button type="button" class="fbtn ${selectedTalleres.length===0?'on':''}" data-taller-all="1">Todos</button>
      ${talleres.map(t=>{
        const sel=selectedTalleres.includes(t);
        return `<button type="button" class="fbtn ${sel?'on':''}" data-taller="${esc(t)}">${esc(t)}</button>`;
      }).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:0.75rem">
      <span class="filter-lbl">Prioridad</span>
      <button type="button" class="fbtn ${!f.prioridad?'on':''}" data-fk="prioridad" data-fv="">Todas</button>
      ${prioridades.map(p=>`<button type="button" class="fbtn ${f.prioridad===p?'on':''}" data-fk="prioridad" data-fv="${esc(p)}">${esc(p)}</button>`).join('')}
    </div>
    <div class="results-count">${filtered.length} de ${positions.length} posiciones${selectedTalleres.length>0?` · ${selectedTalleres.join(', ')}`:''}</div>

    <!-- DESKTOP: tabla -->
    <div class="prod-desktop-table tbl-wrap">
    <table class="tbl">
      <thead>
        <tr style="color:var(--text);font-size:12px">
          <th rowspan="2" style="color:var(--text)">Prioridad</th>
          <th rowspan="2" style="color:var(--text)">Posición</th>
          <th rowspan="2" style="color:var(--text)">Cant.</th>
          <th rowspan="2" style="color:var(--text)">Denominación</th>
          <th rowspan="2" style="color:var(--text)">Peso unit.</th>
          <th rowspan="2" style="color:var(--text)">Peso total</th>
          <th colspan="2" style="text-align:center;border-bottom:1px solid var(--border2);color:var(--text)">Armado</th>
          <th rowspan="2" style="text-align:center;color:var(--text)">CD</th>
          <th colspan="2" style="text-align:center;border-bottom:1px solid var(--border2);color:var(--text)">Soldadura</th>
          <th rowspan="2" style="text-align:center;color:var(--text)">AP</th>
          <th rowspan="2" style="text-align:center;color:var(--text)">Pintado<br><span style="font-size:9px;color:var(--text3)">(unidades)</span></th>
          <th rowspan="2" style="color:var(--text)">Lote</th>
        </tr>
        <tr style="color:var(--text)">
          <th style="color:var(--text)">Fecha inicio</th><th style="color:var(--text)">% Avance</th>
          <th style="color:var(--text)">Fecha inicio</th><th style="color:var(--text)">% Avance</th>
        </tr>
      </thead>
      <tbody>${rows.length?rows:`<tr><td colspan="13" style="text-align:center;padding:3rem;color:var(--text3);font-family:var(--mono);font-size:12px">Sin resultados.</td></tr>`}</tbody>
    </table>
    </div>

    <!-- MOBILE: cards -->
    <div class="prod-mobile-cards">
      ${filtered.length===0?`<div style="text-align:center;padding:3rem 1rem;color:var(--text3);font-family:var(--mono);font-size:12px">Sin resultados.</div>`:mobileCards}
    </div>
  </div>`;
}

// ── POSICIONES: CALIDAD ───────────────────────────────────
function renderPosViewDefault(ot){
  const f=state.filters; const pi=ot.info;
  const positions=ot.positions||[];

  // auto-migrate: generate subs for positions with qty>1 that don't have them yet
  if(ensureSubs(positions)) savePersisted();

  function getTallerCal(pos){ return String(pos.construye||'').trim()||'CIMOMET'; }

  const talleresCal=[...new Set(positions.map(p=>getTallerCal(p)))].sort((a,b)=>{
    if(a==='CIMOMET') return -1; if(b==='CIMOMET') return 1; return a.localeCompare(b);
  });
  const selectedTalleresCal=f.talleres&&f.talleres.length>0?f.talleres:[];
  const posForPrioCal=selectedTalleresCal.length>0?positions.filter(p=>selectedTalleresCal.includes(getTallerCal(p))):positions;
  const prioridades=[...new Set(posForPrioCal.map(p=>String(p.prioridad||'')).filter(Boolean))].sort();

  const filtered=positions.filter(pos=>{
    if(selectedTalleresCal.length>0&&!selectedTalleresCal.includes(getTallerCal(pos))) return false;
    if(f.buscar){
      const q=f.buscar.toLowerCase();
      if(!String(pos.id||'').toLowerCase().includes(q)&&!String(pos.denom||'').toLowerCase().includes(q)) return false;
    }
    if(f.prioridad&&String(pos.prioridad||'')!==f.prioridad) return false;
    return true;
  });

  function calRowActions(processes, posId, subIdx){
    const overall=processes.every(p=>p.status==='approved')?'done':
      processes.some(p=>p.assignee||p.status==='approved'||p.status==='rejected')?'in_progress':'pending';
    if(overall==='done') return '';
    const sidx=subIdx!==null?`data-subidx="${subIdx}"`:'';
    const btns=CAL_PROCS.map((n,i)=>{
      const proc=processes[i];
      const isInspected=proc.status==='approved'||proc.status==='rejected';
      const hasPartial=proc.history&&proc.history.length>0;
      const canInsp=calCanInspect({processes},i);
      if(isInspected){
        return `<button type="button" class="abtn corr" data-act="modificar" data-id="${esc(posId)}" data-pidx="${i}" ${sidx}>Mod. ${CAL_SHORT[i]}</button>`;
      } else {
        const lbl = hasPartial ? `${CAL_SHORT[i]}*` : CAL_SHORT[i];
        const tip = !canInsp ? 'Requiere armado aprobado' : (hasPartial ? 'Tiene controles parciales' : '');
        return `<button type="button" class="abtn" ${canInsp?'':'disabled'} data-act="inspect-proc" data-id="${esc(posId)}" data-pidx="${i}" ${sidx} title="${esc(tip)}">${lbl}</button>`;
      }
    }).join('');
    return `<div class="abtn-group">${btns}</div>`;
  }

  // ensure calExtData on ot
  if(!ot.calExtData) ot.calExtData={};
  function isExt(pos){ return normLugar(pos.construye)==='ext'; }
  const sg2='background:rgba(62,207,122,0.15);border-color:rgba(62,207,122,0.4);color:var(--green);';
  const hasAnyExt=filtered.some(p=>isExt(p));

  function extAvanceInputs(pos){
    const qty=Number(pos.qty)||1;
    const d=ot.calExtData[pos.id]||{};
    const arm=d.armadas!==undefined?d.armadas:'';
    const sol=d.soldadas!==undefined?d.soldadas:'';
    const pin=d.pintadas!==undefined?d.pintadas:'';
    const armOk=arm!==''&&Number(arm)===qty;
    const solOk=sol!==''&&Number(sol)===qty;
    const pinOk=pin!==''&&Number(pin)===qty;
    return `<div style="display:flex;gap:6px;align-items:center">
      <div style="text-align:center">
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:3px">ARM</div>
        <input type="number" class="prod-input calext-input" data-extid="${esc(pos.id)}" data-extfield="armadas" value="${arm}" min="0" max="${qty}" placeholder="0" style="width:52px;${armOk?sg2:''}"/>
      </div>
      <div style="text-align:center">
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:3px">SOL</div>
        <input type="number" class="prod-input calext-input" data-extid="${esc(pos.id)}" data-extfield="soldadas" value="${sol}" min="0" max="${qty}" placeholder="0" style="width:52px;${solOk?sg2:''}"/>
      </div>
      <div style="text-align:center">
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:3px">PIN</div>
        <input type="number" class="prod-input calext-input" data-extid="${esc(pos.id)}" data-extfield="pintadas" value="${pin}" min="0" max="${qty}" placeholder="0" style="width:52px;${pinOk?sg2:''}"/>
      </div>
    </div>`;
  }

  const rows=filtered.map(pos=>{
    const hasSubs=pos.subs&&pos.subs.length>0;
    const isExpanded=!!state.expanded[pos.id];
    const ext=isExt(pos);
    const expandBtn=hasSubs
      ? `<button type="button" class="expand-btn ${isExpanded?'open':''} " data-expand="${esc(pos.id)}"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
      : '<span style="display:inline-block;width:20px"></span>';

    const pipeline = hasSubs
      ? renderPipeline(CAL_PROCS.map((_,i)=>{
          const subs=pos.subs;
          const allOk  = subs.every(s=>s.processes[i]?.status==='approved');
          const anyRej = subs.some(s=>s.processes[i]?.status==='rejected');
          const anyPartial = subs.some(s=>(s.processes[i]?.history||[]).length>0);
          return {
            status: allOk?'approved': anyRej?'rejected':'pending',
            history: anyPartial&&!allOk&&!anyRej?[{}]:[]
          };
        }), CAL_SHORT)
      : renderPipeline(pos.processes, CAL_SHORT);
    const mainAction = hasSubs
      ? `<div class="abtn-group">${calRowActions(pos.processes, pos.id, null)}<button type="button" class="abtn" style="font-size:10px;border-color:rgba(138,122,196,0.3);color:var(--purple)" data-calapplyall="${esc(pos.id)}" title="Replicar estado a todas las unidades">→ Todas</button></div>`
      : calRowActions(pos.processes, pos.id, null);

    let mainRow=`<tr ${hasSubs?`data-expand="${esc(pos.id)}" style="cursor:pointer"`:''}>
      <td class="mono" style="color:var(--accent);font-weight:500">${esc(pos.prioridad||'—')}</td>
      <td class="mono" style="font-weight:500">${expandBtn} ${esc(pos.id)}</td>
      <td><div style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(pos.denom)}">${esc(pos.denom)}</div></td>
      <td class="mono">${pos.qty!==''&&pos.qty!==undefined?pos.qty:'—'}</td>
      <td><div class="pipeline">${pipeline}</div></td>
      <td>${mainAction}</td>
      ${hasAnyExt?`<td>${ext?extAvanceInputs(pos):'<span style="color:var(--text3);font-size:11px">—</span>'}</td>`:''}
      <td style="min-width:80px">${(()=>{
        if(hasSubs) return '<span style="font-family:var(--mono);font-size:10px;color:var(--text3)">ver subs</span>';
        const lote=ot.lotes?.find(l=>l.id===pos.loteId);
        return `<div style="display:flex;align-items:center;gap:4px">
          ${lote?`<span style="font-family:var(--mono);font-size:10px;color:var(--accent2)">${esc(lote.nombre)}</span>`:'<span style="color:var(--text3);font-size:11px">—</span>'}
        </div>`;
      })()}</td>
    </tr>`;

    let subRows='';
    if(hasSubs&&isExpanded){
      subRows=pos.subs.map((sub,i)=>{
        const subPipeline=renderPipeline(sub.processes, CAL_SHORT);
        const subAction=calRowActions(sub.processes, pos.id, i);
        const subLote=ot.lotes?.find(l=>l.id===sub.loteId);
        return `<tr class="sub-row">
          <td></td>
          <td class="sub-id">${esc(sub.subId)}</td>
          <td style="color:var(--text3);font-size:12px">${esc(pos.denom)}</td>
          <td class="mono" style="color:var(--text3)">1</td>
          <td><div class="pipeline">${subPipeline}</div></td>
          <td>${subAction}</td>
          ${hasAnyExt?'<td></td>':''}
          <td>${subLote?`<span style="font-family:var(--mono);font-size:11px;color:var(--accent2)">${esc(subLote.nombre)}</span>`:'<span style="color:var(--text3);font-size:11px">—</span>'}</td>
        </tr>`;
      }).join('');
    }

    return mainRow+subRows;
  }).join('');

  return `<div class="topbar">
    <div><div class="topbar-title">Posiciones</div><div class="topbar-meta">OT ${esc(pi.ot)} · ${esc(pi.proyecto||'')}</div></div>
  </div>
  <div class="content">
    <div style="margin-bottom:0.75rem">
      <input id="inp-buscar" type="text" placeholder="Buscar por posición o denominación…" value="${esc(f.buscar)}" style="max-width:320px;background:var(--bg2);border-color:var(--border2);font-family:var(--mono);font-size:12px;"/>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <span class="filter-lbl">Taller</span>
      <button type="button" class="fbtn ${selectedTalleresCal.length===0?'on':''}" data-taller-all="1">Todos</button>
      ${talleresCal.map(t=>`<button type="button" class="fbtn ${selectedTalleresCal.includes(t)?'on':''}" data-taller="${esc(t)}">${esc(t)}</button>`).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:0.75rem">
      <span class="filter-lbl">Prioridad</span>
      <button type="button" class="fbtn ${!f.prioridad?'on':''}" data-fk="prioridad" data-fv="">Todas</button>
      ${prioridades.map(p=>`<button type="button" class="fbtn ${f.prioridad===p?'on':''}" data-fk="prioridad" data-fv="${esc(p)}">${esc(p)}</button>`).join('')}
    </div>
    <div class="results-count">${filtered.length} de ${positions.length} posiciones${selectedTalleresCal.length>0?` · ${selectedTalleresCal.join(', ')}`:''}</div>

    <!-- DESKTOP: tabla -->
    <div class="tbl-wrap cal-desktop-table">
    <table class="tbl">
      <thead><tr>
        <th style="color:var(--text)">Prioridad</th>
        <th style="color:var(--text)">Posición</th>
        <th style="color:var(--text)">Denominación</th>
        <th style="color:var(--text)">Cant.</th>
        <th style="color:var(--text)">Proceso</th>
        <th style="color:var(--text)">Acción</th>
        ${hasAnyExt?`<th style="color:var(--text)">Avance ext.</th>`:''}
        <th style="color:var(--text)">Lote PIN</th>
      </tr></thead>
      <tbody>${rows.length?rows:`<tr><td colspan="${hasAnyExt?7:6}" style="text-align:center;padding:3rem;color:var(--text3);font-family:var(--mono);font-size:12px">Sin resultados.</td></tr>`}</tbody>
    </table>
    </div>

    <!-- MOBILE: cards -->
    <div class="cal-mobile-cards">
      ${filtered.length===0
        ? `<div style="text-align:center;padding:3rem 1rem;color:var(--text3);font-family:var(--mono);font-size:12px">Sin resultados.</div>`
        : filtered.map(pos=>{
            const hasSubs=pos.subs&&pos.subs.length>0;
            const isExpanded=!!state.expanded[pos.id];
            const ext=isExt(pos);
            const pipeline=hasSubs
              ? renderPipeline(CAL_PROCS.map((_,i)=>{
                  const subs=pos.subs;
                  const allOk=subs.every(s=>s.processes[i]?.status==='approved');
                  const anyRej=subs.some(s=>s.processes[i]?.status==='rejected');
                  const anyPartial=subs.some(s=>(s.processes[i]?.history||[]).length>0);
                  return {status:allOk?'approved':anyRej?'rejected':'pending',history:anyPartial&&!allOk&&!anyRej?[{}]:[]};
                }),CAL_SHORT)
              : renderPipeline(pos.processes,CAL_SHORT);
            const mainAction=calRowActions(pos.processes,pos.id,null);

            const allSubsAction = hasSubs ? `<div class="abtn-group">
              ${CAL_PROCS.map((n,i)=>{
                const allApproved=pos.subs.every(s=>s.processes[i]?.status==='approved');
                const canInsp=calCanInspect({processes:pos.subs[0]?.processes||[]},i);
                if(allApproved){
                  return `<button type="button" class="abtn corr" data-act="calapplyall-proc" data-id="${esc(pos.id)}" data-pidx="${i}">Mod. ${CAL_SHORT[i]}</button>`;
                } else {
                  return `<button type="button" class="abtn" ${canInsp?'':'disabled'} data-act="calapplyall-proc" data-id="${esc(pos.id)}" data-pidx="${i}">${CAL_SHORT[i]}</button>`;
                }
              }).join('')}
              <button type="button" class="abtn" style="font-size:10px;border-color:rgba(138,122,196,0.3);color:var(--purple)" data-expand-inline="${esc(pos.id)}" title="Ver unidades">
                <svg viewBox="0 0 16 16" fill="none" style="width:12px;height:12px;display:inline-block;vertical-align:middle"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>` : '';

            // mobile ext avance inputs
            const extMobile = ext ? (()=>{
              const qty=Number(pos.qty)||1;
              const d=ot.calExtData[pos.id]||{};
              const arm=d.armadas!==undefined?d.armadas:'';
              const sol=d.soldadas!==undefined?d.soldadas:'';
              const pin=d.pintadas!==undefined?d.pintadas:'';
              const armOk=arm!==''&&Number(arm)===qty;
              const solOk=sol!==''&&Number(sol)===qty;
              const pinOk=pin!==''&&Number(pin)===qty;
              return `<div style="margin-top:10px;padding:10px;background:rgba(138,122,196,0.06);border-radius:var(--r);border:1px solid rgba(138,122,196,0.2)">
                <div style="font-family:var(--mono);font-size:10px;color:var(--purple);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Avance en taller externo</div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
                  <div>
                    <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">Armadas</div>
                    <input type="number" class="prod-input calext-input" data-extid="${esc(pos.id)}" data-extfield="armadas" value="${arm}" min="0" max="${qty}" placeholder="0" style="width:100%;${armOk?sg2:''}"/>
                  </div>
                  <div>
                    <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">Soldadas</div>
                    <input type="number" class="prod-input calext-input" data-extid="${esc(pos.id)}" data-extfield="soldadas" value="${sol}" min="0" max="${qty}" placeholder="0" style="width:100%;${solOk?sg2:''}"/>
                  </div>
                  <div>
                    <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">Pintadas</div>
                    <input type="number" class="prod-input calext-input" data-extid="${esc(pos.id)}" data-extfield="pintadas" value="${pin}" min="0" max="${qty}" placeholder="0" style="width:100%;${pinOk?sg2:''}"/>
                  </div>
                </div>
              </div>`;
            })() : '';

            return `<div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
                <div>
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
                    ${hasSubs?`<button type="button" class="expand-btn ${isExpanded?'open':''}" data-expand="${esc(pos.id)}"><svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`:''}
                    <span style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)">${esc(pos.id)}</span>
                    ${pos.prioridad?`<span class="chip" style="background:rgba(79,142,247,0.1);color:var(--accent2);border-radius:20px;font-family:var(--mono);font-size:10px">${esc(pos.prioridad)}</span>`:''}
                    ${ext?`<span class="chip" style="background:rgba(138,122,196,0.12);color:var(--purple);border-radius:20px;font-family:var(--mono);font-size:10px">${esc(pos.construye)}</span>`:''}
                  </div>
                  <div style="font-size:13px;color:var(--text2)">${esc(pos.denom)}</div>
                  <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:2px">Cant: ${pos.qty!==''&&pos.qty!==undefined?pos.qty:'—'}</div>
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                <div class="pipeline">${pipeline}</div>
                ${hasSubs ? allSubsAction : `<div class="abtn-group">${mainAction}</div>`}
              </div>
              ${extMobile}
              ${hasSubs&&isExpanded?pos.subs.map((sub,i)=>`
                <div style="margin-top:8px;padding:10px 12px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border2)">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <span style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent2)">${esc(sub.subId)}</span>
                    ${(()=>{
                      const subLote=ot.lotes?.find(l=>l.id===sub.loteId);
                      return subLote?`<span style="font-family:var(--mono);font-size:10px;color:var(--accent2)">Lote: ${esc(subLote.nombre)}</span>`:'';
                    })()}
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <div class="pipeline">${renderPipeline(sub.processes,CAL_SHORT)}</div>
                    <div class="abtn-group">${calRowActions(sub.processes,pos.id,i)}</div>
                  </div>
                </div>`).join(''):''}
            </div>`;
          }).join('')
      }
    </div>
  </div>`;
}

// ── MODAL ─────────────────────────────────────────────────
function renderModal(){
  if(state.modal?.type==='lote-obs'||state.modal?.type==='lote-accion') return renderLoteModal();
  if(state.modal?.type==='lote-asignar') return renderLoteAsignModal();
  if(state.modal?.type==='lote-asignar-sub') return renderLoteAsignSubModal();
  const m=state.modal;
  if(m.type==='reupload-preview'){
    const c=m.changes;
    const totalChanges=c.added.length+c.removed.length+c.modified.length+c.qtyChanged.length;
    const sectionTitle=(label,count,color)=>`<div style="font-family:var(--mono);font-size:10px;color:${color};text-transform:uppercase;letter-spacing:0.1em;margin:14px 0 6px">${label} (${count})</div>`;
    const itemLi=(content,warn)=>`<li style="font-family:var(--mono);font-size:12px;padding:5px 10px;background:${warn?'rgba(240,94,106,0.08)':'var(--bg3)'};border-radius:var(--r);margin-bottom:4px${warn?';border:1px solid rgba(240,94,106,0.3)':''}">${content}</li>`;

    if(totalChanges===0){
      return `<div class="modal-overlay" id="modal-overlay"><div class="modal" style="max-width:500px">
        <div class="modal-title">Sin cambios detectados</div>
        <div class="modal-sub">El Excel subido es idéntico al packing list actual. No hay nada para actualizar.</div>
        <div class="modal-actions">
          <button type="button" class="btn-ok" id="btn-close">Entendido</button>
        </div>
      </div></div>`;
    }

    const hasRemovedWithData=c.removedWithData && c.removedWithData.length>0;

    return `<div class="modal-overlay" id="modal-overlay"><div class="modal" style="max-width:620px">
      <div class="modal-title">Confirmar resubida del packing list</div>
      <div class="modal-sub">Se detectaron <strong>${totalChanges} cambio${totalChanges!==1?'s':''}</strong>. Revisá antes de confirmar:</div>
      ${hasRemovedWithData?`<div style="padding:10px 12px;background:rgba(240,94,106,0.1);border:1px solid rgba(240,94,106,0.3);border-radius:var(--r);margin-bottom:10px;font-size:12px;color:var(--red)">⚠ <strong>${c.removedWithData.length} posición${c.removedWithData.length!==1?'es':''}</strong> a eliminar tienen datos cargados (avances, controles o lotes). Si confirmás, esos datos se pierden.</div>`:''}
      <div style="max-height:380px;overflow-y:auto">
        ${c.added.length?sectionTitle('Posiciones nuevas','+'+c.added.length,'var(--green)')+`<ul style="list-style:none;padding:0;margin:0">${c.added.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span> <span style="color:var(--text3)">×${p.qty}</span>`)).join('')}</ul>`:''}
        ${c.removed.length?sectionTitle('Posiciones a eliminar','-'+c.removed.length,'var(--red)')+`<ul style="list-style:none;padding:0;margin:0">${c.removed.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom||'—')}</span>${p.hasData?` <span style="color:var(--red);font-weight:600">⚠ con datos</span>`:''}`, p.hasData)).join('')}</ul>`:''}
        ${c.qtyChanged.length?sectionTitle('Cambios de cantidad',c.qtyChanged.length,'var(--amber)')+`<ul style="list-style:none;padding:0;margin:0">${c.qtyChanged.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span> <span style="color:var(--text3)">×${p.oldQty} → ×${p.newQty}</span>`)).join('')}</ul>`:''}
        ${c.modified.length?sectionTitle('Posiciones modificadas',c.modified.length,'var(--accent)')+`<ul style="list-style:none;padding:0;margin:0">${c.modified.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span><br><span style="color:var(--text3);font-size:11px">Campos: ${p.fields.join(', ')}</span>`)).join('')}</ul>`:''}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar resubida</button>
        <button type="button" class="${hasRemovedWithData?'btn-reject':'btn-ok'}" id="btn-reupload-confirm">${hasRemovedWithData?'Confirmar (perderé datos)':'Confirmar resubida'}</button>
      </div>
    </div></div>`;
  }
  if(m.type==='reupload-success'){
    const c=m.changes;
    const totalChanges=c.added.length+c.removed.length+c.modified.length+c.qtyChanged.length;
    const sectionTitle=(label,count,color)=>`<div style="font-family:var(--mono);font-size:10px;color:${color};text-transform:uppercase;letter-spacing:0.1em;margin:14px 0 6px">${label} (${count})</div>`;
    const itemLi=(content)=>`<li style="font-family:var(--mono);font-size:12px;padding:5px 10px;background:var(--bg3);border-radius:var(--r);margin-bottom:4px">${content}</li>`;

    return `<div class="modal-overlay" id="modal-overlay"><div class="modal" style="max-width:600px">
      <div class="modal-title" style="color:var(--green)">✓ Packing list actualizado</div>
      <div class="modal-sub">El Excel se reprocesó correctamente. ${totalChanges===0?'No hubo cambios respecto a la versión anterior.':`Se detectaron <strong>${totalChanges} cambio${totalChanges!==1?'s':''}</strong>:`}</div>
      <div style="max-height:380px;overflow-y:auto">
        ${c.added.length?sectionTitle('Posiciones agregadas','+'+c.added.length,'var(--green)')+`<ul style="list-style:none;padding:0;margin:0">${c.added.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span> <span style="color:var(--text3)">×${p.qty}</span>`)).join('')}</ul>`:''}
        ${c.removed.length?sectionTitle('Posiciones eliminadas','-'+c.removed.length,'var(--red)')+`<ul style="list-style:none;padding:0;margin:0">${c.removed.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom||'—')}</span>`)).join('')}</ul>`:''}
        ${c.qtyChanged.length?sectionTitle('Cambios de cantidad',c.qtyChanged.length,'var(--amber)')+`<ul style="list-style:none;padding:0;margin:0">${c.qtyChanged.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span> <span style="color:var(--text3)">×${p.oldQty} → ×${p.newQty}</span>`)).join('')}</ul>`:''}
        ${c.modified.length?sectionTitle('Posiciones modificadas',c.modified.length,'var(--accent)')+`<ul style="list-style:none;padding:0;margin:0">${c.modified.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span><br><span style="color:var(--text3);font-size:11px">Campos: ${p.fields.join(', ')}</span>`)).join('')}</ul>`:''}
        ${totalChanges===0?`<div style="text-align:center;padding:2rem;color:var(--text3);font-family:var(--mono);font-size:12px">No se detectaron diferencias</div>`:''}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ok" id="btn-close">Entendido</button>
      </div>
    </div></div>`;
  }
  if(m.type==='role-select'){
    const currentRole=state.role;
    const opts=ROLES.map(r=>`<option value="${r.id}" ${r.id===currentRole?'selected':''}>${r.label}</option>`).join('');
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Cambiar rol</div>
      <div class="modal-sub">Elegí el rol con el que querés acceder a la aplicación.</div>
      <div class="modal-field"><label>Rol</label>
        <select id="sel-role" style="width:100%;padding:10px 12px;font-size:14px">${opts}</select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar</button>
        <button type="button" class="btn-ok" id="btn-role-confirm">Confirmar</button>
      </div>
    </div></div>`;
  }
  if(m.type==='new-ot'){
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Nueva OT</div>
      <div class="modal-sub">Se crea una OT en blanco. Los datos del proyecto (nombre, número de OT y cliente) se cargarán automáticamente cuando subas el Excel del packing list.</div>
      <div class="modal-actions"><button type="button" class="btn-cancel" id="btn-close">Cancelar</button><button type="button" class="btn-ok" id="btn-confirm-new-ot">Crear OT</button></div>
    </div></div>`;
  }
  if(m.type==='delete-ot'){
    const ot=activeOt();
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Eliminar OT</div>
      <div class="modal-sub">¿Seguro que querés eliminar la OT <strong>${esc(ot?.info.ot||'')}</strong> — ${esc(ot?.info.proyecto||'')}? Esta acción es irreversible y borrará todos los datos.</div>
      <div class="modal-field"><label>Contraseña de confirmación</label>
        <input id="inp-delete-pw" type="password" placeholder="Ingresá la contraseña" autocomplete="off"/>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar</button>
        <button type="button" class="btn-reject" id="btn-confirm-delete-ot">Eliminar definitivamente</button>
      </div>
    </div></div>`;
  }

  const ot=activeOt();
  const positions=ot?.positions||[];
  const pos=positions.find(p=>p.id===m.posId);
  if(!pos) return '';
  const ap=pos.activeProc;

  if(m.type==='assign'||m.type==='reassign'){
    const wopts=WORKERS.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Asignar: ${PROCS[ap]}</div>
      <div class="modal-sub">Posición <strong>${esc(pos.id)}</strong> — ${esc(pos.denom)}<br>Plano: ${esc(pos.plano)}</div>
      <div class="modal-field"><label>Responsable</label><select id="sel-w">${wopts}</select></div>
      <div class="modal-actions"><button type="button" class="btn-cancel" id="btn-close">Cancelar</button><button type="button" class="btn-ok" id="btn-confirm-assign">Confirmar</button></div>
    </div></div>`;
  }
  if(m.type==='corregir'){
    const opts=[];
    if(ap>0) opts.push({idx:ap-1,label:PROCS[ap-1],sub:'proceso anterior'});
    if(ap>1) opts.push({idx:ap-2,label:PROCS[ap-2],sub:'dos procesos atrás'});
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Corregir proceso</div>
      <div class="modal-sub">Posición <strong>${esc(pos.id)}</strong> — ${esc(pos.denom)}<br>Proceso actual: <strong>${PROCS[ap]}</strong></div>
      <div class="modal-warn">Se borrarán las asignaciones y aprobaciones desde el proceso seleccionado en adelante.</div>
      <div class="proc-grid">${opts.map(o=>`<div class="proc-opt ${state.corrTarget===o.idx?'sel':''}" data-pidx="${o.idx}"><div class="proc-opt-name">${o.label}</div><div class="proc-opt-sub">${o.sub}</div></div>`).join('')}</div>
      <div class="modal-actions"><button type="button" class="btn-cancel" id="btn-close">Cancelar</button><button type="button" class="btn-corregir" id="btn-confirm-corr" ${state.corrTarget===null?'disabled':''}>Aplicar</button></div>
    </div></div>`;
  }
  if(m.type==='inspect'){
    const pidx=m.procIdx!==undefined?m.procIdx:ap;
    const subIdx=m.subIdx!==undefined?m.subIdx:null;
    const applyAll=m.applyAllSubs&&pos.subs&&pos.subs.length>0;
    const subLabel=applyAll?` — todas las unidades`:subIdx!==null&&pos.subs?` (${pos.subs[subIdx]?.subId||''})`:'' ;
    const showHistory=!applyAll;
    const procForHistory=applyAll?null:getProcesses(pos,subIdx)[pidx];
    const history=procForHistory?.history||[];
    const historyHtml=history.length
      ? history.map(h=>`<div class="history-item">
          <div class="history-meta"><span class="history-author">${esc(h.author||'—')}</span><span>${esc(h.date||'')}</span>${historyTag(h.action)}</div>
          <div class="history-text">${esc(h.text||'(sin observaciones)')}</div>
        </div>`).join('')
      : `<div class="history-empty">Sin controles previos</div>`;
    const isPIN = pidx===2;
    const lotes=ot.lotes||[];
    const loteOpts=lotes.map(l=>`<option value="${esc(l.id)}">${esc(l.nombre)}</option>`).join('');
    const loteSection = isPIN ? `
      <div class="modal-field"><label>Lote de pintura</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div style="flex:1;min-width:160px">
            <input id="inp-lote-nuevo" type="text" placeholder="Nuevo lote (ej: L-001)" value="" style="margin-bottom:6px"/>
            <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">— o asignar a existente —</div>
            <select id="sel-lote-existente" style="width:100%">
              <option value="">Seleccionar lote existente…</option>
              ${loteOpts}
            </select>
          </div>
        </div>
      </div>` : `
      <div class="modal-field"><label>Observaciones (opcional)</label>
        <textarea id="inp-obs" rows="3" style="resize:vertical" placeholder="Comentarios sobre el control"></textarea>
      </div>`;
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Inspección: ${PROCS[pidx]}</div>
      <div class="modal-sub">Posición <strong>${esc(pos.id)}${esc(subLabel)}</strong> — ${esc(pos.denom)}
        ${applyAll?`<br><span style="color:var(--amber);font-family:var(--mono);font-size:11px">Se aplicará a las ${pos.subs.length} unidades</span>`:''}
      </div>
      ${showHistory?`<div class="modal-field"><label>Historial de controles</label><div class="history-list">${historyHtml}</div></div>`:''}
      <div class="modal-field"><label>Inspector</label>
        <input id="inp-author" type="text" placeholder="Tu nombre" value="${esc(state.lastAuthor||'')}"/>
      </div>
      ${loteSection}
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar</button>
        ${!isPIN?`<button type="button" class="btn-partial" id="btn-do-partial">Control parcial</button>`:''}
        <button type="button" class="btn-reject" id="btn-do-reject">Rechazar</button>
        <button type="button" class="btn-approve" id="btn-do-approve">Aprobar</button>
      </div>
    </div></div>`;
  }
  if(m.type==='modificar'){
    const pidx=m.procIdx;
    const subIdx=m.subIdx!==undefined?m.subIdx:null;
    const processes=getProcesses(pos,subIdx);
    const proc=processes[pidx];
    const subLabel=subIdx!==null&&pos.subs?` (${pos.subs[subIdx]?.subId||''})`:'' ;
    const estadoActual=proc.status==='approved'?'Aprobado':'Rechazado';
    const estadoActualCls=proc.status==='approved'?'color:var(--green)':'color:var(--red)';
    const history=proc.history||[];
    const editIdx=m.editHistoryIdx!==undefined?m.editHistoryIdx:null;

    const historyHtml=history.length
      ? history.map((h,i)=>{
          
          
          if(editIdx===i){
            return `<div class="history-item" style="background:var(--bg4)">
              <div class="history-meta"><span class="history-author">${esc(h.author||'—')}</span><span>${esc(h.date||'')}</span>${historyTag(h.action)}</div>
              <textarea id="inp-edit-obs" rows="2" style="width:100%;resize:vertical;margin-top:4px;font-size:12px">${esc(h.text||'')}</textarea>
              <div style="display:flex;gap:6px;margin-top:6px">
                <button type="button" class="abtn" id="btn-save-edit" style="font-size:11px">Guardar</button>
                <button type="button" class="abtn" id="btn-cancel-edit" style="font-size:11px">Cancelar</button>
              </div>
            </div>`;
          }
          return `<div class="history-item" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="flex:1">
              <div class="history-meta"><span class="history-author">${esc(h.author||'—')}</span><span>${esc(h.date||'')}</span>${historyTag(h.action)}</div>
              <div class="history-text">${esc(h.text||'(sin observaciones)')}</div>
            </div>
            <button type="button" class="abtn" style="font-size:10px;flex-shrink:0" data-edit-idx="${i}">Editar</button>
          </div>`;
        }).join('')
      : `<div class="history-empty">Sin historial</div>`;

    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Modificar inspección: ${PROCS[pidx]}</div>
      <div class="modal-sub">Posición <strong>${esc(pos.id)}${esc(subLabel)}</strong> — ${esc(pos.denom)}<br>
        Estado actual: <strong style="${estadoActualCls}">${estadoActual}</strong>
      </div>
      <div class="modal-field"><label>Historial</label>
        <div class="history-list">${historyHtml}</div>
      </div>
      ${editIdx===null?`
      <div class="modal-field"><label>Inspector</label>
        <input id="inp-author" type="text" placeholder="Tu nombre" value="${esc(state.lastAuthor||'')}"/>
      </div>
      <div class="modal-field"><label>Nueva observación</label>
        <textarea id="inp-obs" rows="2" style="resize:vertical" placeholder="Agregar comentario al historial…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar</button>
        <button type="button" class="btn-ok" id="btn-mod-save">Agregar observación</button>
        ${proc.status==='approved'
          ? `<button type="button" class="btn-reject" id="btn-mod-reject">Cambiar a Rechazado</button>`
          : `<button type="button" class="btn-approve" id="btn-mod-approve">Cambiar a Aprobado</button>`
        }
        <button type="button" class="btn-anular" id="btn-mod-anular">Anular control</button>
      </div>`:''}
    </div></div>`;
  }
  return '';
}

// ── PINTURA VIEW ──────────────────────────────────────────
function renderPinturaView(ot){
  if(!ot||!ot.plPublished){
    return `<div class="topbar"><div><div class="topbar-title">Pintura</div></div></div>
    <div class="content"><div class="empty"><div class="empty-title">Sin packing list publicado</div></div></div>`;
  }
  const pi=ot.info;
  const lotes=ot.lotes||[];
  const positions=ot.positions||[];
  const filterLote=state.filters.filterLote||'';
  const loteOpts=[...lotes].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es',{numeric:true}));
  const selectedLote=filterLote?lotes.find(l=>l.id===filterLote):null;

  // build lote list
  const loteListHtml = loteOpts.length===0
    ? `<div style="text-align:center;padding:2rem 1rem;color:var(--text3);font-family:var(--mono);font-size:12px">Los lotes se crean al inspeccionar PIN en Posiciones.</div>`
    : loteOpts.map(l=>{
        let totalUnits=0,rejUnits=0;
        (l.posIds||[]).forEach(pid=>{totalUnits++;if((l.posEstados?.[pid]||'pendiente')==='rechazado') rejUnits++;});
        (l.subPosIds||[]).forEach(spid=>{totalUnits++;if((l.subPosEstados?.[spid]||'pendiente')==='rechazado') rejUnits++;});
        const isSelected=l.id===filterLote;
        const estadoColor=l.estado==='aprobado'?'var(--green)':l.estado==='rechazado'?'var(--red)':'var(--amber)';
        const estadoLabel=l.estado==='aprobado'?'Aprobado':l.estado==='rechazado'?'Rechazado':'Pendiente';
        const hasMedidas=l.min||l.max||l.promedio;
        return `<div style="border-radius:var(--r2);border:1.5px solid ${isSelected?'var(--accent)':'var(--border)'};overflow:hidden;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;background:var(--bg2)" data-sel-lote="${esc(l.id)}">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)">${esc(l.nombre)}</span>
                <span style="font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid ${estadoColor};color:${estadoColor}">${estadoLabel}</span>
                ${rejUnits>0?`<span style="font-family:var(--mono);font-size:10px;color:var(--red)">⚠ ${rejUnits} rechazada${rejUnits!==1?'s':''}</span>`:''}
              </div>
              <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:3px">${totalUnits} unidad${totalUnits!==1?'es':''} · ${esc(l.fecha)}${hasMedidas?` · Mín:${l.min||'—'} Máx:${l.max||'—'} Prom:${l.promedio||'—'}`:''}</div>
            </div>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="flex-shrink:0;margin-left:8px;transform:${isSelected?'rotate(90deg)':'rotate(0)'};transition:transform 0.2s"><path d="M7 5l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          ${isSelected ? renderLoteDetalle(l, positions) : ''}
        </div>`;
      }).join('');

  return `<div class="topbar">
    <div><div class="topbar-title">Pintura</div><div class="topbar-meta">OT ${esc(pi.ot)} · ${esc(pi.proyecto||'')}</div></div>
  </div>
  <div class="content">
    <div style="max-width:720px">${loteListHtml}</div>
  </div>`;
}

function renderLoteDetalle(l, positions){
  // metrics
  const metrics=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 14px;background:var(--bg3);border-top:1px solid var(--border)">
    <div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Mín. medido</div>
      <input type="text" class="lote-metric-input" data-lote-id="${esc(l.id)}" data-metric="min" value="${esc(l.min||'')}" placeholder="—" style="width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:6px 8px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)"/>
    </div>
    <div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Máx. medido</div>
      <input type="text" class="lote-metric-input" data-lote-id="${esc(l.id)}" data-metric="max" value="${esc(l.max||'')}" placeholder="—" style="width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:6px 8px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)"/>
    </div>
    <div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Prom. medido</div>
      <input type="text" class="lote-metric-input" data-lote-id="${esc(l.id)}" data-metric="promedio" value="${esc(l.promedio||'')}" placeholder="—" style="width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:6px 8px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)"/>
    </div>
  </div>`;

  // actions
  const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--bg3);border-top:1px solid var(--border)">
    <button type="button" class="abtn" data-lote-accion="obs" data-lote-id="${esc(l.id)}">+ Observación</button>
    ${l.estado!=='aprobado'?`<button type="button" class="abtn" style="color:var(--green);border-color:rgba(62,207,122,0.3)" data-lote-accion="aprobar" data-lote-id="${esc(l.id)}">Aprobar lote</button>`:''}
    ${l.estado!=='rechazado'?`<button type="button" class="abtn" style="color:var(--red);border-color:rgba(240,94,106,0.3)" data-lote-accion="rechazar" data-lote-id="${esc(l.id)}">Rechazar lote</button>`:''}
    <button type="button" class="abtn" style="color:var(--text3);border-color:rgba(120,120,120,0.3)" data-lote-accion="borrar" data-lote-id="${esc(l.id)}">Borrar</button>
  </div>`;

  // positions
  const posRowsArr=[];
  (l.posIds||[]).forEach(pid=>{
    const p=positions.find(x=>x.id===pid); if(!p) return;
    const est=l.posEstados?.[pid]||'pendiente';
    const estColor=est==='aprobado'?'var(--green)':est==='rechazado'?'var(--red)':'var(--text3)';
    const estLabel=est==='aprobado'?'✓ Aprobado':est==='rechazado'?'✗ Rechazado':'Pendiente';
    const obs=l.posObs?.[pid]||'';
    posRowsArr.push(`<div style="padding:10px 14px;border-top:1px solid var(--border);background:var(--bg2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px">
        <div>
          <span style="font-family:var(--mono);font-size:13px;font-weight:700">${esc(p.id)}</span>
          <span style="font-size:12px;color:var(--text2);margin-left:8px">${esc(p.denom)}</span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:6px">×${p.qty||1}</span>
        </div>
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:${estColor}">${estLabel}</span>
      </div>
      ${obs?`<div style="font-size:12px;color:var(--text2);margin-bottom:6px;font-style:italic">"${esc(obs)}"</div>`:''}
      <div class="abtn-group">
        <button type="button" class="abtn" style="font-size:11px" data-lote-pos-obs="${esc(l.id)}" data-pos-id="${esc(pid)}">Obs.</button>
        ${est!=='aprobado'?`<button type="button" class="abtn" style="font-size:11px;color:var(--green);border-color:rgba(62,207,122,0.3)" data-lote-pos-est="${esc(l.id)}" data-pos-id="${esc(pid)}" data-est="aprobado">✓</button>`:''}
        ${est!=='rechazado'?`<button type="button" class="abtn" style="font-size:11px;color:var(--red);border-color:rgba(240,94,106,0.3)" data-lote-pos-est="${esc(l.id)}" data-pos-id="${esc(pid)}" data-est="rechazado">✗</button>`:''}
      </div>
    </div>`);
  });
  (l.subPosIds||[]).forEach(spid=>{
    const [parentId,subId]=spid.split('::');
    const p=positions.find(x=>x.id===parentId); if(!p) return;
    const est=l.subPosEstados?.[spid]||'pendiente';
    const estColor=est==='aprobado'?'var(--green)':est==='rechazado'?'var(--red)':'var(--text3)';
    const estLabel=est==='aprobado'?'✓ Aprobado':est==='rechazado'?'✗ Rechazado':'Pendiente';
    const obs=l.subPosObs?.[spid]||'';
    posRowsArr.push(`<div style="padding:8px 14px 8px 28px;border-top:1px solid var(--border);background:var(--bg3)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px">
        <div>
          <span style="font-family:var(--mono);font-size:12px;color:var(--accent2)">↳ ${esc(subId)}</span>
          <span style="font-size:11px;color:var(--text3);margin-left:6px">${esc(p.denom)}</span>
        </div>
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:${estColor}">${estLabel}</span>
      </div>
      ${obs?`<div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-style:italic">"${esc(obs)}"</div>`:''}
      <div class="abtn-group">
        <button type="button" class="abtn" style="font-size:11px" data-lote-sub-obs="${esc(l.id)}" data-spid="${esc(spid)}">Obs.</button>
        ${est!=='aprobado'?`<button type="button" class="abtn" style="font-size:11px;color:var(--green);border-color:rgba(62,207,122,0.3)" data-lote-sub-est="${esc(l.id)}" data-spid="${esc(spid)}" data-est="aprobado">✓</button>`:''}
        ${est!=='rechazado'?`<button type="button" class="abtn" style="font-size:11px;color:var(--red);border-color:rgba(240,94,106,0.3)" data-lote-sub-est="${esc(l.id)}" data-spid="${esc(spid)}" data-est="rechazado">✗</button>`:''}
      </div>
    </div>`);
  });

  // historial
  const histHtml=(l.historial||[]).length
    ? (l.historial||[]).map(h=>`<div class="history-item" style="margin:0;border-radius:0;border-bottom:1px solid var(--border)">
        <div class="history-meta"><span class="history-author">${esc(h.author||'—')}</span><span>${esc(h.date||'')}</span>${historyTag(h.action)}</div>
        <div class="history-text">${esc(h.text||'—')}</div>
        ${h.min||h.max||h.promedio?`<div style="font-family:var(--mono);font-size:10px;color:var(--text3)">Mín:${h.min||'—'} Máx:${h.max||'—'} Prom:${h.promedio||'—'}</div>`:''}
      </div>`).join('')
    : `<div style="padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--text3);border-top:1px solid var(--border)">Sin historial</div>`;

  return `
    ${metrics}
    ${actions}
    ${posRowsArr.length?`<div style="border-top:1px solid var(--border)">
      <div style="padding:8px 14px;font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;background:var(--bg3)">Posiciones (${posRowsArr.length})</div>
      ${posRowsArr.join('')}
    </div>`:''}
    <div style="border-top:1px solid var(--border)">
      <div style="padding:8px 14px;font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;background:var(--bg3)">Historial</div>
      ${histHtml}
    </div>`;
}
