// ── PINTURA LOTE SELECTOR MODAL (Nuevo lote + Agregar piezas) ────
function renderLoteSelectorModal(){
  const m=state.modal; if(!m) return '';
  const ot=activeOt(); if(!ot) return '';
  const lote = m.loteId ? ot.lotes?.find(l=>l.id===m.loteId) : null;
  const isNew = !lote;

  // Build set of already-assigned items (so we hide them)
  const assignedPosKeys = new Set();
  const assignedSubSpids = new Set();
  (ot.lotes||[]).forEach(l=>{
    (l.posIds||[]).forEach(pid=>assignedPosKeys.add(pid));
    (l.subPosIds||[]).forEach(spid=>assignedSubSpids.add(spid));
  });

  // selected items: array of {posKey, subId|null}
  if(!Array.isArray(m.selected)) m.selected = [];
  if(!m.filters) m.filters = {q:'', taller:[], prioridad:'', estado:''};
  if(!m.expanded) m.expanded = {};

  // Build list of selectable items (positions and their subs)
  const positions = ot.positions || [];

  // Filters: taller, prioridad
  const allTalleres = [...new Set(positions.map(p=>String(p.construye||'').trim()||'CIMOMET'))].sort();
  const allPrios = [...new Set(positions.map(p=>String(p.prioridad||'')).filter(Boolean))]
    .sort((a,b)=>Number(a)-Number(b)||a.localeCompare(b,'es',{numeric:true}));

  // Filter positions per filters and search
  const q = (m.filters.q||'').toLowerCase().trim();
  const filteredPositions = positions.filter(p=>{
    const taller=String(p.construye||'').trim()||'CIMOMET';
    if(m.filters.taller.length>0 && !m.filters.taller.includes(taller)) return false;
    if(m.filters.prioridad && String(p.prioridad||'')!==m.filters.prioridad) return false;
    if(q && !String(p.id||'').toLowerCase().includes(q) && !String(p.denom||'').toLowerCase().includes(q)) return false;
    return true;
  });

  // For each position, determine selectable items
  // A position is "selectable as whole" if it's not in any lote AND none of its subs are in any lote
  // Subs are selectable individually if their parent isn't whole-assigned AND the sub isn't already
  const itemRows = [];
  filteredPositions.forEach(p=>{
    const posKey = p.uid || p.id;
    const parentAssigned = assignedPosKeys.has(posKey);
    const hasSubs = p.subs && p.subs.length>0;
    const subsAssignedSet = new Set();
    if(hasSubs){
      p.subs.forEach(s=>{
        const spid=`${posKey}::${s.subId}`;
        if(assignedSubSpids.has(spid)) subsAssignedSet.add(s.subId);
      });
    }
    const anySubAssigned = subsAssignedSet.size>0;
    // Estados CD/AP
    const procs = p.processes || [];
    const cdStatus = procs[0]?.status || 'pending';
    const apStatus = procs[1]?.status || 'pending';

    // Hide entirely if all relevant items are already assigned somewhere
    if(parentAssigned) return;
    if(hasSubs && subsAssignedSet.size === p.subs.length) return;

    const expanded = !!m.expanded[posKey];
    const taller = String(p.construye||'').trim()||'CIMOMET';
    const prio = p.prioridad||'—';

    // Sub-level CD/AP aggregate
    const subStatusInfo = hasSubs ? p.subs.map(s=>{
      const subAssigned = subsAssignedSet.has(s.subId);
      const sp = s.processes||[];
      return {
        subId: s.subId,
        assigned: subAssigned,
        cd: sp[0]?.status||'pending',
        ap: sp[1]?.status||'pending'
      };
    }) : null;

    // "Toda la posición" checkbox: only enabled if no subs already assigned individually
    const canSelectWhole = !anySubAssigned;
    const wholeSelected = m.selected.some(it=>it.posKey===posKey && it.subId===null);

    const cdBadge = (s)=>{
      const c = s==='approved'?'var(--green)':s==='rejected'?'var(--red)':'var(--text3)';
      const t = s==='approved'?'✓':s==='rejected'?'✗':'—';
      return `<span style="font-family:var(--mono);font-size:10px;color:${c}">${t}</span>`;
    };

    itemRows.push(`<div style="border-bottom:1px solid var(--border);padding:10px 14px">
      <div style="display:flex;align-items:center;gap:12px;${!canSelectWhole?'opacity:0.55':''}">
        ${canSelectWhole
          ? `<input type="checkbox" class="lote-sel-whole" data-pos-key="${esc(posKey)}" ${wholeSelected?'checked':''} style="flex-shrink:0;width:16px;height:16px;cursor:pointer"/>`
          : '<span style="display:inline-block;width:16px;flex-shrink:0"></span>'}
        <div style="display:flex;flex-direction:column;min-width:90px;flex-shrink:0">
          <span style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text)">${esc(p.id)}</span>
          <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">×${p.qty||1} · P${prio}</span>
        </div>
        <span style="flex:1;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.denom||'')}">${esc(p.denom||'')}</span>
        <span style="font-family:var(--mono);font-size:10px;color:var(--text3);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0">${esc(taller)}</span>
        <div style="display:flex;gap:8px;flex-shrink:0;font-family:var(--mono);font-size:10px;color:var(--text3)">
          <span>CD ${cdBadge(cdStatus)}</span>
          <span>AP ${cdBadge(apStatus)}</span>
        </div>
        ${hasSubs ? `<button type="button" class="abtn" style="font-size:10px;padding:3px 8px;flex-shrink:0" data-lote-sel-expand="${esc(posKey)}">${expanded?'▾':'▸'} ${p.subs.length-subsAssignedSet.size}/${p.subs.length}</button>` : '<span style="width:64px;flex-shrink:0"></span>'}
      </div>
      ${hasSubs && expanded ? `<div style="margin-top:8px;padding-left:28px;border-left:2px solid var(--border);margin-left:8px">${subStatusInfo.filter(s=>!s.assigned).map(s=>{
        const subSelected = m.selected.some(it=>it.posKey===posKey && it.subId===s.subId);
        const disabledBySelected = wholeSelected;
        return `<div style="display:flex;align-items:center;gap:12px;padding:5px 8px;${disabledBySelected?'opacity:0.5':''}">
          <input type="checkbox" class="lote-sel-sub" data-pos-key="${esc(posKey)}" data-sub-id="${esc(s.subId)}" ${subSelected||disabledBySelected?'checked':''} ${disabledBySelected?'disabled':''} style="flex-shrink:0;width:14px;height:14px;cursor:${disabledBySelected?'default':'pointer'}"/>
          <span style="font-family:var(--mono);font-size:11px;color:var(--accent2);flex:1">↳ ${esc(s.subId)}</span>
          <div style="display:flex;gap:8px;font-family:var(--mono);font-size:10px;color:var(--text3)">
            <span>CD ${cdBadge(s.cd)}</span>
            <span>AP ${cdBadge(s.ap)}</span>
          </div>
        </div>`;
      }).join('')}</div>` : ''}
    </div>`);
  });

  // Count selected (effective unique items)
  let countSel = 0;
  m.selected.forEach(it=>{
    if(it.subId===null){
      const p = positions.find(x=>(x.uid||x.id)===it.posKey);
      countSel += (p?.subs?.length || 1);
    } else {
      countSel++;
    }
  });

  const nameInput = isNew
    ? `<div class="modal-field" style="margin-bottom:14px">
        <label>Nombre del lote</label>
        <input id="inp-lote-sel-nombre" type="text" placeholder="Ej: L-001, Capa 1, etc." value="${esc(m.loteNombre||'')}" style="width:100%"/>
      </div>`
    : `<div style="margin-bottom:14px;font-family:var(--mono);font-size:12px;color:var(--text2)">Agregando a lote: <strong style="color:var(--text)">${esc(lote.nombre)}</strong></div>`;

  return `<div class="modal-overlay" id="modal-overlay"><div class="modal" style="max-width:780px;width:96vw">
    <div class="modal-title">${isNew?'Nuevo lote de pintura':'Agregar piezas al lote'}</div>
    ${nameInput}
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
      <input type="text" id="inp-lote-sel-q" placeholder="Buscar posición o denominación…" value="${esc(m.filters.q||'')}" style="flex:1;min-width:180px;padding:8px 10px;font-size:13px"/>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <span style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;align-self:center;margin-right:4px">Taller</span>
      <button type="button" class="fbtn ${m.filters.taller.length===0?'on':''}" data-lote-sel-taller="">Todos</button>
      ${allTalleres.map(t=>`<button type="button" class="fbtn ${m.filters.taller.includes(t)?'on':''}" data-lote-sel-taller="${esc(t)}">${esc(t)}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      <span style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;align-self:center;margin-right:4px">Prioridad</span>
      <button type="button" class="fbtn ${!m.filters.prioridad?'on':''}" data-lote-sel-prio="">Todas</button>
      ${allPrios.map(p=>`<button type="button" class="fbtn ${m.filters.prioridad===p?'on':''}" data-lote-sel-prio="${esc(p)}">${esc(p)}</button>`).join('')}
    </div>
    <div style="border:1px solid var(--border);border-radius:var(--r);max-height:50vh;overflow-y:auto;background:var(--bg2)">
      ${itemRows.length>0 ? itemRows.join('') : '<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">No hay posiciones disponibles con los filtros actuales.</div>'}
    </div>
    <div class="modal-actions" style="justify-content:space-between;align-items:center">
      <span style="font-family:var(--mono);font-size:12px;color:var(--text2)">${countSel} unidad${countSel!==1?'es':''} seleccionada${countSel!==1?'s':''}</span>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar</button>
        <button type="button" class="btn-ok" id="btn-lote-sel-confirm" ${countSel===0?'disabled style="opacity:0.5;cursor:not-allowed"':''}>${isNew?'Crear lote':'Agregar al lote'}</button>
      </div>
    </div>
  </div></div>`;
}


// ── BIND ──────────────────────────────────────────────────
function bind(){
  const $=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el.addEventListener(ev,fn); };

  // lote filter (pintura view)
  document.querySelectorAll('[data-sel-lote]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.selLote;
      state.filters.filterLote=state.filters.filterLote===id?'':id;
      render();
    });
  });

  // lote metric inputs
  document.querySelectorAll('.lote-metric-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot||!ot.lotes) return;
      const lote=ot.lotes.find(l=>l.id===inp.dataset.loteId); if(!lote) return;
      lote[inp.dataset.metric]=inp.value.trim();
      savePersisted();
    });
  });

  // lote sub-pos obs
  document.querySelectorAll('[data-lote-sub-obs]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.modal={type:'lote-obs',loteId:b.dataset.loteSubObs,spid:b.dataset.spid,posId:null};
      render();
    });
  });
  // lote sub-pos estado
  document.querySelectorAll('[data-lote-sub-est]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===b.dataset.loteSubEst); if(!lote) return;
      if(!lote.subPosEstados) lote.subPosEstados={};
      lote.subPosEstados[b.dataset.spid]=b.dataset.est;
      savePersisted(); render();
    });
  });

  // lote accion buttons (aprobar/rechazar lote)
  document.querySelectorAll('[data-lote-accion]').forEach(b=>{
    b.addEventListener('click',()=>{
      const accion=b.dataset.loteAccion;
      if(accion==='obs'){
        state.modal={type:'lote-obs',loteId:b.dataset.loteId,posId:null,spid:null};
        render();
      } else if(accion==='borrar'){
        if(!confirm('¿Borrar este lote? Las posiciones y sub-posiciones asignadas quedarán sin lote, y los lotes posteriores se renumerarán.')) return;
        const ot=activeOt(); if(!ot||!ot.lotes) return;
        const loteId=b.dataset.loteId;
        const lote=ot.lotes.find(l=>l.id===loteId); if(!lote) return;
        const deletedNombre=lote.nombre;
        // clear loteId from positions and subs
        (ot.positions||[]).forEach(pos=>{
          if(pos.loteId===loteId) pos.loteId=null;
          (pos.subs||[]).forEach(sub=>{ if(sub.loteId===loteId) sub.loteId=null; });
        });
        // remove lote
        ot.lotes=ot.lotes.filter(l=>l.id!==loteId);
        // renumber remaining lotes that have numeric names after the deleted one
        // extract numeric suffix from deleted nombre (e.g. "L-003" → 3)
        const numMatch=deletedNombre.match(/(\d+)$/);
        if(numMatch){
          const prefix=deletedNombre.slice(0,deletedNombre.length-numMatch[1].length);
          const deletedNum=parseInt(numMatch[1]);
          const pad=numMatch[1].length;
          ot.lotes.forEach(l=>{
            const m=l.nombre.match(/^(.+?)(\d+)$/);
            if(m && m[1]===prefix){
              const n=parseInt(m[2]);
              if(n>deletedNum){
                l.nombre=prefix+String(n-1).padStart(pad,'0');
              }
            }
          });
        }
        if(state.filters.filterLote===loteId) state.filters.filterLote='';
        savePersisted(); render();
      } else {
        state.modal={type:'lote-accion',loteId:b.dataset.loteId,accion};
        render();
      }
    });
  });
  on('btn-lote-confirm','click',()=>{
    const obs=document.getElementById('inp-obs')?.value||'';
    const author=(()=>{
      if(state.role==='calidad'&&state.inspectorActivo) return state.inspectorActivo.nombre;
      const v=(document.getElementById('inp-author')?.value||'').trim();
      if(!v){ alert('Ingresá tu nombre.'); return null; }
      return v;
    })();
    if(!author) return;
    const ot=activeOt(); if(!ot) return;
    const lote=ot.lotes?.find(l=>l.id===state.modal.loteId); if(!lote) return;
    const accion=state.modal.accion;
    lote.estado=accion==='aprobar'?'aprobado':'rechazado';
    if(!lote.historial) lote.historial=[];
    lote.historial.push({author,date:nowStr(),text:obs,action:accion==='aprobar'?'approved':'rejected'});
    state.lastAuthor=author; state.modal=null; savePersisted(); render();
  });

  // lote pos obs
  document.querySelectorAll('[data-lote-pos-obs]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.modal={type:'lote-obs',loteId:b.dataset.lotePosObs,posId:b.dataset.posId};
      render();
    });
  });
  on('btn-lote-save-obs','click',()=>{
    const obs=(document.getElementById('inp-obs')?.value||'').trim();
    const author=(()=>{
      if(state.role==='calidad'&&state.inspectorActivo) return state.inspectorActivo.nombre;
      const v=(document.getElementById('inp-author')?.value||'').trim();
      if(!v){ alert('Ingresá tu nombre.'); return null; }
      return v;
    })();
    if(!author) return;
    if(!obs){ alert('Escribí una observación.'); return; }
    const ot=activeOt(); if(!ot) return;
    const lote=ot.lotes?.find(l=>l.id===state.modal.loteId); if(!lote) return;
    if(state.modal.spid){
      if(!lote.subPosObs) lote.subPosObs={};
      lote.subPosObs[state.modal.spid]=obs;
    } else if(state.modal.posId){
      if(!lote.posObs) lote.posObs={};
      lote.posObs[state.modal.posId]=obs;
    } else {
      if(!lote.historial) lote.historial=[];
      lote.historial.push({author,date:nowStr(),text:obs,action:'note'});
    }
    state.lastAuthor=author; state.modal=null; savePersisted(); render();
  });

  // lote pos estado
  document.querySelectorAll('[data-lote-pos-est]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===b.dataset.lotePosEst); if(!lote) return;
      if(!lote.posEstados) lote.posEstados={};
      lote.posEstados[b.dataset.posId]=b.dataset.est;
      savePersisted(); render();
    });
  });

  // expand a position in lote view (show sub-units)
  document.querySelectorAll('[data-expand-lote-pos]').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const k=b.dataset.expandLotePos;
      state.expanded[k]=!state.expanded[k];
      render();
    });
  });

  // approve/reject ALL sub-units of a position in lote
  document.querySelectorAll('[data-lote-pos-est-all]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===b.dataset.lotePosEstAll); if(!lote) return;
      const posId=b.dataset.posId;
      const est=b.dataset.est;
      const pos=findPos(ot, posId);
      if(!pos||!pos.subs) return;
      if(!lote.subPosEstados) lote.subPosEstados={};
      pos.subs.forEach(sub=>{
        const spid=`${posId}::${sub.subId}`;
        lote.subPosEstados[spid]=est;
      });
      savePersisted(); render();
    });
  });

  // levantar observación general del lote (historial note)
  document.querySelectorAll('[data-lote-obs-levantar]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===b.dataset.loteObsLevantar); if(!lote) return;
      const hidx=parseInt(b.dataset.hidx);
      const h=lote.historial?.[hidx];
      if(!h) return;
      // determine the inspector/author
      const who = state.role==='calidad' && state.inspectorActivo
        ? state.inspectorActivo.nombre
        : (state.lastAuthor||'Admin');
      h.levantada=true;
      h.levantadaPor=who;
      h.levantadaFecha=nowStr();
      savePersisted(); render();
    });
  });

  // capas de medición — agregar nueva capa
  document.querySelectorAll('[data-lote-capa-agregar]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===b.dataset.loteCapaAgregar); if(!lote) return;
      if(!Array.isArray(lote.capas)) lote.capas=[];
      const n=lote.capas.length+1;
      lote.capas.push({
        id: 'capa_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        nombre: 'Capa '+n,
        min: '',
        max: '',
        promedio: '',
        fecha: nowStr(),
      });
      savePersisted(); render();
    });
  });

  // capa — borrar
  document.querySelectorAll('[data-lote-capa-borrar]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===b.dataset.loteCapaBorrar); if(!lote||!Array.isArray(lote.capas)) return;
      const capaId=b.dataset.capaId;
      const capa=lote.capas.find(c=>c.id===capaId);
      if(!capa) return;
      if(!confirm(`¿Borrar "${capa.nombre||'esta capa'}"?`)) return;
      lote.capas=lote.capas.filter(c=>c.id!==capaId);
      savePersisted(); render();
    });
  });

  // capa — editar valores (min/max/promedio)
  document.querySelectorAll('.lote-capa-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===inp.dataset.loteId); if(!lote||!Array.isArray(lote.capas)) return;
      const capa=lote.capas.find(c=>c.id===inp.dataset.capaId); if(!capa) return;
      capa[inp.dataset.metric]=inp.value.trim();
      // also sync legacy fields on the lote root if this is the first capa (for back-compat with home/header)
      if(lote.capas[0]?.id===capa.id){
        lote.min=lote.capas[0].min||'';
        lote.max=lote.capas[0].max||'';
        lote.promedio=lote.capas[0].promedio||'';
      }
      savePersisted();
      // no render needed (input keeps focus)
    });
  });

  // capa — editar nombre
  document.querySelectorAll('.lote-capa-nombre').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===inp.dataset.loteId); if(!lote||!Array.isArray(lote.capas)) return;
      const capa=lote.capas.find(c=>c.id===inp.dataset.capaId); if(!capa) return;
      capa.nombre=inp.value.trim();
      savePersisted();
    });
  });

  // quitar posición entera del lote
  // ── PINTURA LOTE SELECTOR (Nuevo lote + Agregar piezas) ──
  on('btn-nuevo-lote','click',()=>{
    state.modal={type:'lote-selector', loteId:null, selected:[], filters:{q:'',taller:[],prioridad:'',estado:''}, expanded:{}, loteNombre:''};
    render();
  });
  document.querySelectorAll('[data-lote-agregar-piezas]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.modal={type:'lote-selector', loteId:b.dataset.loteAgregarPiezas, selected:[], filters:{q:'',taller:[],prioridad:'',estado:''}, expanded:{}, loteNombre:''};
      render();
    });
  });
  // search input
  const loteSelQ=document.getElementById('inp-lote-sel-q');
  if(loteSelQ){
    loteSelQ.addEventListener('input',()=>{ if(state.modal) state.modal.filters.q=loteSelQ.value; render(); setTimeout(()=>document.getElementById('inp-lote-sel-q')?.focus(),0); });
  }
  // nombre input (don't re-render to keep focus; read on confirm)
  const loteSelNombre=document.getElementById('inp-lote-sel-nombre');
  if(loteSelNombre){
    loteSelNombre.addEventListener('input',()=>{ if(state.modal) state.modal.loteNombre=loteSelNombre.value; });
  }
  // taller filter
  document.querySelectorAll('[data-lote-sel-taller]').forEach(b=>{
    b.addEventListener('click',()=>{
      if(!state.modal) return;
      const t=b.dataset.loteSelTaller;
      if(t===''){ state.modal.filters.taller=[]; }
      else {
        const arr=state.modal.filters.taller||[];
        if(arr.includes(t)) state.modal.filters.taller=arr.filter(x=>x!==t);
        else state.modal.filters.taller=[...arr,t];
      }
      render();
    });
  });
  // prio filter
  document.querySelectorAll('[data-lote-sel-prio]').forEach(b=>{
    b.addEventListener('click',()=>{
      if(!state.modal) return;
      state.modal.filters.prioridad=b.dataset.loteSelPrio;
      render();
    });
  });
  // expand
  document.querySelectorAll('[data-lote-sel-expand]').forEach(b=>{
    b.addEventListener('click',e=>{
      e.preventDefault(); e.stopPropagation();
      if(!state.modal) return;
      const k=b.dataset.loteSelExpand;
      state.modal.expanded[k]=!state.modal.expanded[k];
      render();
    });
  });
  // checkbox whole
  document.querySelectorAll('.lote-sel-whole').forEach(cb=>{
    cb.addEventListener('change',()=>{
      if(!state.modal) return;
      const posKey=cb.dataset.posKey;
      // remove any prior selections for this pos (both whole and sub)
      state.modal.selected = state.modal.selected.filter(it=>it.posKey!==posKey);
      if(cb.checked){
        state.modal.selected.push({posKey, subId:null});
      }
      render();
    });
  });
  // checkbox sub
  document.querySelectorAll('.lote-sel-sub').forEach(cb=>{
    cb.addEventListener('change',()=>{
      if(!state.modal) return;
      const posKey=cb.dataset.posKey;
      const subId=cb.dataset.subId;
      // if there's a "whole" selection for this pos, remove it and replace with individual subs
      const wholeIdx=state.modal.selected.findIndex(it=>it.posKey===posKey&&it.subId===null);
      if(wholeIdx>=0){
        // expand whole into individual subs minus the toggled one
        const ot2=activeOt();
        const p2=ot2?.positions.find(x=>(x.uid||x.id)===posKey);
        state.modal.selected.splice(wholeIdx,1);
        (p2?.subs||[]).forEach(s=>{ if(s.subId!==subId) state.modal.selected.push({posKey, subId:s.subId}); });
        // since the toggled one is being checked, also add it (it would have been excluded above)
        if(cb.checked) state.modal.selected.push({posKey, subId});
      } else {
        const idx=state.modal.selected.findIndex(it=>it.posKey===posKey&&it.subId===subId);
        if(cb.checked){ if(idx<0) state.modal.selected.push({posKey, subId}); }
        else { if(idx>=0) state.modal.selected.splice(idx,1); }
      }
      render();
    });
  });

    // Get lote (existing or create new)

      ot.lotes.push(lote);
    }

    // Check pieces without AP approved
    const positions=ot.positions||[];
    const piecesWithoutAp=[];
    m.selected.forEach(it=>{
      const p=positions.find(x=>(x.uid||x.id)===it.posKey);
      if(!p) return;
      if(it.subId===null){
        // whole position: check parent's AP, and each sub's AP if subs exist
        const apOk=p.processes?.[1]?.status==='approved';
        if(!apOk){
          if(p.subs && p.subs.length>0){
            p.subs.forEach(s=>{
              if(s.processes?.[1]?.status!=='approved') piecesWithoutAp.push(`${p.id}-${s.subId.replace(p.id+'-','')}`);
            });
          } else {
            piecesWithoutAp.push(p.id);
          }
        }
      } else {
        const sub=p.subs?.find(s=>s.subId===it.subId);
        if(sub && sub.processes?.[1]?.status!=='approved'){
          piecesWithoutAp.push(`${p.id}-${it.subId.replace(p.id+'-','')}`);
        }
      }
    });
    if(piecesWithoutAp.length>0){
      const sample=piecesWithoutAp.slice(0,6).join(', ')+(piecesWithoutAp.length>6?`, … (+${piecesWithoutAp.length-6} más)`:'');
      if(!confirm(`${piecesWithoutAp.length} pieza${piecesWithoutAp.length!==1?'s':''} no tiene${piecesWithoutAp.length!==1?'n':''} AP aprobado: ${sample}\n\n¿Querés agregarlas al lote igualmente?`)) return;
    }

    // Add items to lote
    if(!Array.isArray(lote.posIds)) lote.posIds=[];
    if(!Array.isArray(lote.subPosIds)) lote.subPosIds=[];
    m.selected.forEach(it=>{
      const p=positions.find(x=>(x.uid||x.id)===it.posKey);
      if(!p) return;
      const posKey=p.uid||p.id;
      if(it.subId===null){
        if(!lote.posIds.includes(posKey)) lote.posIds.push(posKey);
        // mark all subs as belonging to this lote
        p.loteId=lote.id;
        (p.subs||[]).forEach(s=>{ s.loteId=lote.id; });
      } else {
        const spid=`${posKey}::${it.subId}`;
        if(!lote.subPosIds.includes(spid)) lote.subPosIds.push(spid);
        const sub=p.subs?.find(s=>s.subId===it.subId);
        if(sub) sub.loteId=lote.id;

    state.modal=null;
    state.filters.filterLote=lote.id; // open the lote we just added to
    savePersisted();
    render();

  document.querySelectorAll('[data-lote-pos-quitar]').forEach(b=>{

      const pid=b.dataset.posId;
      const pos=ot.positions.find(p=>p.uid===pid)||ot.positions.find(p=>p.id===pid);
      if(!confirm('¿Quitar esta posición del lote? El estado de pintura volverá a "pendiente".')) return;
      // remove from posIds
      if(Array.isArray(lote.posIds)) lote.posIds=lote.posIds.filter(x=>x!==pid);
      // remove any sub of this parent in subPosIds too
      if(Array.isArray(lote.subPosIds)) lote.subPosIds=lote.subPosIds.filter(spid=>!spid.startsWith(pid+'::'));
      // cleanup state and obs
      if(lote.posEstados) delete lote.posEstados[pid];
      if(lote.posObs) delete lote.posObs[pid];
      if(lote.subPosEstados){
        Object.keys(lote.subPosEstados).forEach(k=>{ if(k.startsWith(pid+'::')) delete lote.subPosEstados[k]; });
      }
      if(lote.subPosObs){
        Object.keys(lote.subPosObs).forEach(k=>{ if(k.startsWith(pid+'::')) delete lote.subPosObs[k]; });
      }
      // reset PIN status on position and subs
      if(pos){
        if(pos.loteId===lote.id) pos.loteId=null;
        if(pos.processes && pos.processes[2]){
          pos.processes[2].status='pending';
          pos.processes[2].obs='';
        }
        (pos.subs||[]).forEach(s=>{
          if(s.loteId===lote.id) s.loteId=null;
          if(s.processes && s.processes[2]){
            s.processes[2].status='pending';
            s.processes[2].obs='';
          }
        });
        // recompute activeProc
        let next=0;
        while(next<3 && pos.processes?.[next]?.status==='approved') next++;
        pos.activeProc=next;

      savePersisted(); render();

      const ot=activeOt(); if(!ot) return;
      const lote=ot.lotes?.find(l=>l.id===b.dataset.loteSubQuitar); if(!lote) return;
      const spid=b.dataset.spid;
      const parentId=b.dataset.parentId;
      const [_, subId]=spid.split('::');
      const pos=ot.positions.find(p=>p.uid===parentId)||ot.positions.find(p=>p.id===parentId);
      const sub=pos?.subs?.find(s=>s.subId===subId);
      if(!confirm('¿Quitar esta sub-posición del lote? El estado de pintura volverá a "pendiente".')) return;

      // CASE A: parent was assigned whole (in posIds) → "break" assignment into individual subs
      // and exclude the one being removed
      if(Array.isArray(lote.posIds) && lote.posIds.includes(parentId)){
        // remove parent from posIds
        lote.posIds=lote.posIds.filter(x=>x!==parentId);
        // ensure subPosIds exists
        if(!Array.isArray(lote.subPosIds)) lote.subPosIds=[];
        // add ALL the parent's subs to subPosIds EXCEPT the one being removed
        (pos?.subs||[]).forEach(s=>{
          const ss=`${parentId}::${s.subId}`;
          if(s.subId!==subId && !lote.subPosIds.includes(ss)){
            lote.subPosIds.push(ss);
          }
        });
      } else {
        // CASE B: sub was an individual assignment in subPosIds → just remove it
        if(Array.isArray(lote.subPosIds)) lote.subPosIds=lote.subPosIds.filter(x=>x!==spid);
      }
      // cleanup state and obs for this specific sub
      if(lote.subPosEstados) delete lote.subPosEstados[spid];
      if(lote.subPosObs) delete lote.subPosObs[spid];
      // reset PIN status on the sub
      if(sub){
        if(sub.loteId===lote.id) sub.loteId=null;
        if(sub.processes && sub.processes[2]){
          sub.processes[2].status='pending';
          sub.processes[2].obs='';

  on('btn-sub-lote-ok','click',()=>{
    const ot=activeOt(); if(!ot) return;
    const [parentId,subId]=state.modal.spid.split('::');
    const pos=findPos(ot, parentId); if(!pos) return;
    const sub=pos.subs?.find(s=>s.subId===subId); if(!sub) return;
    const loteNuevo=(document.getElementById('inp-lote-nuevo')?.value||'').trim();
    const loteExistente=document.getElementById('sel-lote-existente')?.value||'';
    if(!loteNuevo && !loteExistente){ alert('Elegí o creá un lote.'); return; }
    if(!ot.lotes) ot.lotes=[];

    } else { loteId=loteExistente; }
    const spid=state.modal.spid;
    const parentKey=pos.uid||pos.id;

    // CONFLICT: if parent position is in posIds of ANOTHER lote (or even the same), break it into individual sub assignments
    const oldLoteWithParent = ot.lotes.find(l=>(l.posIds||[]).includes(parentKey));
    if(oldLoteWithParent && oldLoteWithParent.id!==loteId){
      const confirmMsg = `${pos.id}-${subId.replace(pos.id+'-','').replace(pos.id,'')} ya está en el lote "${oldLoteWithParent.nombre}" como parte de la posición ${pos.id}. ¿Querés moverla al lote nuevo? Las otras unidades quedarán en "${oldLoteWithParent.nombre}".`;
      if(!confirm(confirmMsg)){ return; }
      // break the parent assignment into individual subs in the old lote, except the one we're moving
      oldLoteWithParent.posIds = oldLoteWithParent.posIds.filter(id=>id!==parentKey);
      if(!oldLoteWithParent.subPosIds) oldLoteWithParent.subPosIds=[];
      (pos.subs||[]).forEach(s=>{
        const otherSpid=`${parentKey}::${s.subId}`;
        if(s.subId!==subId && !oldLoteWithParent.subPosIds.includes(otherSpid)){
          oldLoteWithParent.subPosIds.push(otherSpid);
          s.loteId = oldLoteWithParent.id;
        }
      });
    }

    // remove from old lote (subPosIds)
    if(sub.loteId && sub.loteId!==loteId){
      const old=ot.lotes.find(l=>l.id===sub.loteId);
      if(old?.subPosIds) old.subPosIds=old.subPosIds.filter(x=>x!==spid);
    }

    const lote=ot.lotes.find(l=>l.id===loteId);
    if(lote){ if(!lote.subPosIds) lote.subPosIds=[]; if(!lote.subPosIds.includes(spid)) lote.subPosIds.push(spid); }
    state.modal=null; savePersisted(); render();
  });

  on('btn-lote-asignar-ok','click',()=>{

    const pos=findPos(ot, state.modal.posId); if(!pos) return;
    const loteNuevo=(document.getElementById('inp-lote-nuevo')?.value||'').trim();
    const loteExistente=document.getElementById('sel-lote-existente')?.value||'';
    if(!loteNuevo && !loteExistente){ alert('Elegí o creá un lote.'); return; }
    if(!ot.lotes) ot.lotes=[];
    let loteId;
    if(loteNuevo){
      const existe=ot.lotes.find(l=>l.nombre===loteNuevo);
      if(existe){ loteId=existe.id; }
      else { loteId=genId(); ot.lotes.push({id:loteId,nombre:loteNuevo,fecha:nowStr(),estado:'pendiente',posIds:[],subPosIds:[],historial:[],capas:[]}); }
    } else {
      loteId=loteExistente;
    }
    const posKey=pos.uid||pos.id;

    // CONFLICT: if any sub of this position is in subPosIds of ANOTHER lote, ask to move them all
    if(pos.subs && pos.subs.length>0){
      const conflicts=[];
      pos.subs.forEach(s=>{
        const spid=`${posKey}::${s.subId}`;
        ot.lotes.forEach(l=>{
          if(l.id===loteId) return;
          if((l.subPosIds||[]).includes(spid)){
            conflicts.push({sub:s, lote:l, spid});
          }
        });
      });
      if(conflicts.length>0){
        const loteNames=[...new Set(conflicts.map(c=>c.lote.nombre))].join(', ');
        const msg=`${conflicts.length} sub-posicion${conflicts.length!==1?'es':''} de ${pos.id} ya está${conflicts.length!==1?'n':''} en el lote "${loteNames}". ¿Querés moverlas al lote actual?`;
        if(!confirm(msg)) return;
        // remove from old lotes
        conflicts.forEach(c=>{
          c.lote.subPosIds=c.lote.subPosIds.filter(x=>x!==c.spid);
          // cleanup state/obs in the old lote
          if(c.lote.subPosEstados) delete c.lote.subPosEstados[c.spid];
          if(c.lote.subPosObs) delete c.lote.subPosObs[c.spid];
          c.sub.loteId=null;
        });
      }
    }

    // remove from old lote if any
    if(pos.loteId && pos.loteId!==loteId){
      const oldLote=ot.lotes.find(l=>l.id===pos.loteId);
      if(oldLote) oldLote.posIds=oldLote.posIds.filter(id=>id!==posKey);

    pos.loteId=loteId;
    const lote=ot.lotes.find(l=>l.id===loteId);
    if(lote && !lote.posIds.includes(posKey)) lote.posIds.push(posKey);

    (pos.subs||[]).forEach(s=>{ s.loteId=loteId; });
    state.modal=null; savePersisted(); render();

  });
  const reuploadInput=document.getElementById('file-input-reupload');

    reuploadInput.addEventListener('change',e=>{

      if(file) parseExcel(file);
    });
  }
  on('btn-reupload-confirm','click',()=>{
    const ot=activeOt(); if(!ot||!state.modal?.newRows) return;
    performReuploadMerge(ot, state.modal.newRows);
  });

  // home tab switcher
  document.querySelectorAll('[data-home-tab]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.homeTab=b.dataset.homeTab;
      render();
    });
  });

  on('btn-archive-ot','click',()=>{

    const ot=activeOt(); if(!ot) return;
    if(!confirm(`¿Archivar la OT ${ot.info.ot||''} — ${ot.info.proyecto||''}?\n\nLa OT desaparecerá del listado principal pero seguirá accesible en "Archivadas". Podés reabrirla en cualquier momento.`)) return;
    ot.archived=true;
    ot.archivedAt=nowStr();
    state.view='home';
    state.homeTab='activas';
    state.activeOtId=null;

  });
  on('btn-unarchive-ot','click',()=>{

  on('btn-reset','click',()=>{
    const ot=activeOt(); if(ot){ ot.draftPositions=[]; state.parseError=null; savePersisted(); render(); }
  });
  on('btn-publish','click',()=>{
    const ot=activeOt(); if(!ot) return;
    ot.positions=ot.draftPositions.map(p=>{
      const qty=Number(p.qty)||1;
      const subs = qty>1
        ? Array.from({length:qty},(_,i)=>({
            subId:`${p.pos}-${i+1}`,
            processes:mkProcs(), activeProc:0
          }))
        : null;
      return {id:p.pos, uid:p.uid||genId(), ...p, processes:mkProcs(), activeProc:0, subs};
    });
    ot.plPublished=true; savePersisted(); render();
  });

  // packing list — editable cells (OT info)
  document.querySelectorAll('.ing-info-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      ot.info[inp.dataset.field]=inp.value.trim();

    });
  });

  // editable position cells
  document.querySelectorAll('.pl-cell-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      const idx=parseInt(inp.dataset.idx); const col=inp.dataset.col;
      const row=ot.draftPositions[idx]; if(!row) return;
      // ensure row has uid for future syncs
      if(!row.uid) row.uid=genId();
      const oldQty=Number(row.qty)||0;
      if(col==='qty'||col==='pesoUnit'||col==='pesoTotal') row[col]=inp.value===''?'':Number(inp.value);
      else row[col]=inp.value;
      // auto-recalculate pesoTotal when qty or pesoUnit changes (if pesoUnit is known)
      if(col==='qty'||col==='pesoUnit'){
        const q=Number(row.qty)||0, pu=Number(row.pesoUnit)||0;
        if(q>0 && pu>0) row.pesoTotal=q*pu;
      }
      // sync to positions if published — match by uid (unique per row), fallback to pos.id+index
      if(ot.plPublished){
        let pos = ot.positions.find(p=>p.uid===row.uid);
        if(!pos){
          // fallback: match by index since draft and positions arrays should be aligned
          pos = ot.positions[idx];
          // ensure the uid is propagated
          if(pos && !pos.uid) pos.uid=row.uid;
        }
        if(pos){
          // sync changed field
          pos[col]=row[col];
          // also sync pesoTotal if it was auto-recalculated
          if((col==='qty'||col==='pesoUnit') && row.pesoTotal!==undefined){
            pos.pesoTotal=row.pesoTotal;
          }
          if(col==='qty'){
            const newQty=Number(row.qty)||0;
            pos.qty=newQty;
            if(newQty>1){
              if(!pos.subs) pos.subs=[];
              while(pos.subs.length<newQty) pos.subs.push({subId:`${pos.id}-${pos.subs.length+1}`,processes:mkProcs(),activeProc:0});
              if(pos.subs.length>newQty) pos.subs=pos.subs.slice(0,newQty);
            } else {
              pos.subs=null;
            }
          }
        } else {
          console.warn('[pl-cell-input] No se encontró la posición correspondiente para sincronizar', {row, idx});
        }
      }
      savePersisted(); render();
    });
  });

  // delete row
  document.querySelectorAll('[data-del-row]').forEach(b=>{
    b.addEventListener('click',()=>{
      const ot=activeOt(); if(!ot) return;
      const idx=parseInt(b.dataset.delRow);

      if(ot.plPublished){

        else if(row?.pos) ot.positions=ot.positions.filter(p=>p.id!==row.pos);

  });

  on('btn-add-row','click',()=>{
    const ot=activeOt(); if(!ot) return;

    const denom =($('nr-denom')?.value||'').trim();
    const plano =($('nr-plano')?.value||'').trim();

    const puint =Number($('nr-puint')?.value)||0;

    ot.draftPositions.push(newRow);
    if(ot.plPublished){

  if(uz){
    uz.addEventListener('click',()=>fi&&fi.click());
    uz.addEventListener('dragover',e=>{ e.preventDefault(); uz.classList.add('drag'); });
    uz.addEventListener('dragleave',()=>uz.classList.remove('drag'));

  // calidad ext avance inputs
  document.querySelectorAll('.calext-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      if(!ot.calExtData) ot.calExtData={};
      const id=inp.dataset.extid; const field=inp.dataset.extfield;
      if(!ot.calExtData[id]) ot.calExtData[id]={};

      if(isNaN(val)) val=''; else val=Math.max(0,val);
      inp.value=val===''?'':val;
      ot.calExtData[id][field]=val;
      savePersisted(); render();
    });
  });

  // rendimiento inputs (admin only)
  document.querySelectorAll('.rend-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      if(!ot.rendimientos) ot.rendimientos={};
      ot.rendimientos[inp.dataset.rend]=inp.value.trim();
      savePersisted();
    });
  });

  // prod inputs — save on change
  document.querySelectorAll('.prod-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ot=activeOt(); if(!ot) return;
      if(!ot.prodData) ot.prodData={};

      if(!ot.prodData[id]) ot.prodData[id]={};

  if(inpB){

  document.querySelectorAll('[data-taller-all]').forEach(b=>{
    b.addEventListener('click',()=>{

  // cal estado single-select
  document.querySelectorAll('[data-cal-estado]').forEach(b=>{

    });

    b.addEventListener('click',()=>{

      render();

  document.querySelectorAll('[data-fk]').forEach(b=>b.addEventListener('click',()=>{
    state.filters[b.dataset.fk]=b.dataset.fv; render();
  }));

  // prod apply-all: copy parent prodData to all sub-positions
  document.querySelectorAll('[data-applyall]').forEach(b=>{
    b.addEventListener('click',()=>{

    b.addEventListener('click',e=>{

  document.querySelectorAll('[data-edit-idx]').forEach(b=>{

      render();

    render();
  });
  on('btn-save-edit','click',()=>{

    const ot=activeOt(); if(!ot) return;
    const pos=findPos(ot, state.modal.posId); if(!pos) return;
    const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
    const processes=getProcesses(pos,subIdx);
    const proc=processes[state.modal.procIdx];
    if(!proc.history) proc.history=[];
    proc.history[state.modal.editHistoryIdx].text=newText;
    state.modal={...state.modal, editHistoryIdx:undefined};
    savePersisted(); render();
  });
}

function doModificar(result){
  const obs=document.getElementById('inp-obs')?.value||'';
  const author=(()=>{
    if(state.role==='calidad'&&state.inspectorActivo) return state.inspectorActivo.nombre;
    const v=(document.getElementById('inp-author')?.value||'').trim();
    if(!v){ alert('Ingresá tu nombre como inspector.'); return null; }
    return v;
  })();
  if(!author) return;
  const ot=activeOt(); if(!ot) return;
  const pos=findPos(ot, state.modal.posId); if(!pos) return;
  const pidx=state.modal.procIdx;
  const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
  const processes=getProcesses(pos,subIdx);
  const proc=processes[pidx];
  if(!proc.history) proc.history=[];
  if(result===null){
    // just add a note, keep status — tag shows current status
    const currentAction=proc.status==='approved'?'approved':proc.status==='rejected'?'rejected':'note';
    proc.history.push({author,date:nowStr(),text:obs,action:currentAction});
  } else {
    if(result==='approved'&&pidx===1&&processes[0].status!=='approved'){
      alert('No se puede aprobar Soldadura sin haber aprobado el Armado primero.');
      return;
    }
    proc.history.push({author,date:nowStr(),text:obs,action:result});
    proc.status=result;
    proc.obs=obs;
    state.lastAuthor=author;
    let next=0;
    while(next<PROCS.length&&processes[next].status==='approved') next++;
    if(subIdx===null) pos.activeProc=next;
    else if(pos.subs[subIdx]) pos.subs[subIdx].activeProc=next;
  }
  state.lastAuthor=author;
  state.modal=null; savePersisted(); render();
}

function getProcesses(pos, subIdx){
  if(subIdx!==null&&subIdx!==undefined&&pos.subs&&pos.subs[subIdx]) return pos.subs[subIdx].processes;
  return pos.processes;
}

function historyTag(action){
  const map={
    partial:  ['tag-partial','Parcial'],
    approved: ['tag-approved','Aprobó'],
    rejected: ['tag-rejected','Rechazó'],
    note:     ['tag-note','Nota'],
    anulado:  ['tag-anulado','Anuló'],
  };
  const [cls,label]=map[action]||['tag-note','—'];
  return `<span class="history-tag ${cls}">${label}</span>`;
}

function doAnular(){
  if(state.role==='calidad' && !state.inspectorActivo){
    alert('Tenés que iniciar sesión como inspector antes de realizar controles.');
    state.modal={type:'inspector-login'}; render(); return;
  }
  const obs=document.getElementById('inp-obs')?.value||'';
  const author=(document.getElementById('inp-author')?.value||'').trim();
  if(!author){ alert('Ingresá tu nombre.'); return; }
  if(!obs.trim()){ alert('La causa de anulación es obligatoria.'); return; }
  const ot=activeOt(); if(!ot) return;
  const pos=findPos(ot, state.modal.posId); if(!pos) return;
  const pidx=state.modal.procIdx;
  const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
  const processes=getProcesses(pos,subIdx);
  const proc=processes[pidx];
  if(!proc.history) proc.history=[];
  proc.history.push({author,date:nowStr(),text:obs,action:'anulado'});
  // reset to pending
  proc.status='pending';
  proc.obs='';
  // recalc activeProc
  let next=0;
  while(next<PROCS.length&&processes[next].status==='approved') next++;
  if(subIdx===null) pos.activeProc=next;
  else if(pos.subs?.[subIdx]) pos.subs[subIdx].activeProc=next;
  state.lastAuthor=author;
  state.modal=null; savePersisted(); render();
}

function nowStr(){
  const d=new Date();
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  const hh=String(d.getHours()).padStart(2,'0');
  const mi=String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
}

function doPartial(){
  if(state.role==='calidad' && !state.inspectorActivo){
    alert('Tenés que iniciar sesión como inspector antes de realizar controles.');
    state.modal={type:'inspector-login'}; render(); return;
  }
  const obs=document.getElementById('inp-obs')?.value||'';
  const author=(()=>{
    if(state.role==='calidad'&&state.inspectorActivo) return state.inspectorActivo.nombre;
    const v=(document.getElementById('inp-author')?.value||'').trim();
    if(!v){ alert('Ingresá tu nombre como inspector.'); return null; }
    return v;
  })();
  if(!author) return;
  if(!obs.trim()){ alert('Escribí al menos una observación para registrar el control parcial.'); return; }
  const ot=activeOt(); if(!ot) return;
  const pos=findPos(ot, state.modal.posId); if(!pos) return;
  const pidx=state.modal.procIdx!==undefined?state.modal.procIdx:pos.activeProc;
  const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
  const applyAll=state.modal.applyAllSubs&&pos.subs&&pos.subs.length>0;

  const applyToProcesses=(processes)=>{
    if(!processes[pidx].history) processes[pidx].history=[];
    processes[pidx].history.push({author,date:nowStr(),text:obs,action:'partial'});
  };

  if(applyAll){
    pos.subs.forEach(sub=>applyToProcesses(sub.processes));
  } else {
    applyToProcesses(getProcesses(pos,subIdx));
  }
  state.lastAuthor=author;
  state.modal=null; savePersisted(); render();
}

function doInspect(result){
  // block calidad without inspector session
  if(state.role==='calidad' && !state.inspectorActivo){
    alert('Tenés que iniciar sesión como inspector antes de realizar controles.');
    state.modal={type:'inspector-login'}; render(); return;
  }
  // get author from inspector session or input
  let author;
  if(state.role==='calidad' && state.inspectorActivo){
    author=state.inspectorActivo.nombre;
  } else {
    author=(document.getElementById('inp-author')?.value||'').trim();
    if(!author){ alert('Ingresá tu nombre como inspector.'); return; }
  }
  const ot=activeOt(); if(!ot) return;
  const pos=findPos(ot, state.modal.posId); if(!pos) return;
  const pidx=state.modal.procIdx!==undefined?state.modal.procIdx:pos.activeProc;
  const subIdx=state.modal.subIdx!==undefined?state.modal.subIdx:null;
  const applyAll=state.modal.applyAllSubs&&pos.subs&&pos.subs.length>0;
  const isPIN=pidx===2;
  const obs=isPIN?'':(document.getElementById('inp-obs')?.value||'');

  // handle lote assignment for PIN approval
  let loteId=null;
  if(isPIN && result==='approved'){
    const loteNuevo=(document.getElementById('inp-lote-nuevo')?.value||'').trim();
    const loteExistente=document.getElementById('sel-lote-existente')?.value||'';
    if(!loteNuevo && !loteExistente){ alert('Asigná un lote de pintura antes de aprobar.'); return; }
    if(!ot.lotes) ot.lotes=[];
    if(loteNuevo){
      const existe=ot.lotes.find(l=>l.nombre===loteNuevo);
      if(existe){ loteId=existe.id; }
      else {
        loteId=genId();
        ot.lotes.push({id:loteId,nombre:loteNuevo,fecha:nowStr(),estado:'pendiente',posIds:[],historial:[],min:'',max:'',promedio:''});
      }
    } else {
      loteId=loteExistente;
    }
  }

  const applyToProcesses=(processes, posId)=>{
    if(result==='approved'&&pidx===1&&processes[0].status!=='approved') return false;
    if(!processes[pidx].history) processes[pidx].history=[];
    processes[pidx].history.push({author,date:nowStr(),text:obs,action:result,loteId:loteId||undefined});
    processes[pidx].status=result;
    processes[pidx].obs=obs;
    if(isPIN && loteId && result==='approved'){
      const targetPos=findPos(ot, posId);
      if(targetPos){
        if(subIdx!==null && targetPos.subs?.[subIdx]){
          // assign to sub-posicion
          const sub=targetPos.subs[subIdx];
          const spid=`${posId}::${sub.subId}`;
          if(!sub.loteId) sub.loteId=loteId;
          const lote=ot.lotes?.find(l=>l.id===loteId);
          if(lote){ if(!lote.subPosIds) lote.subPosIds=[]; if(!lote.subPosIds.includes(spid)) lote.subPosIds.push(spid); }
        } else {
          // assign to position
          if(!targetPos.loteId) targetPos.loteId=loteId;
          const lote=ot.lotes?.find(l=>l.id===loteId);
          if(lote && !lote.posIds.includes(posId)) lote.posIds.push(posId);
        }
      }
    }
    return true;
  };

  if(applyAll){
    let blocked=false;
    pos.subs.forEach(sub=>{ if(!applyToProcesses(sub.processes, pos.uid||pos.id)) blocked=true; });
    if(blocked){ alert('No se puede aprobar Soldadura sin haber aprobado el Armado primero.'); return; }
  } else {
    const processes=getProcesses(pos,subIdx);
    if(!applyToProcesses(processes, pos.uid||pos.id)){ alert('No se puede aprobar Soldadura sin haber aprobado el Armado primero.'); return; }
    let next=0;
    while(next<PROCS.length&&processes[next].status==='approved') next++;
    if(subIdx===null) pos.activeProc=next;
    else if(pos.subs?.[subIdx]) pos.subs[subIdx].activeProc=next;
  }

  state.lastAuthor=author;
  state.modal=null; savePersisted(); render();
}

// ── EXCEL PARSER ──────────────────────────────────────────
function parseExcel(file){
  const ot=activeOt(); if(!ot) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

      // read project info from Excel header rows (col 3=label, col 4=value)
      const info={proyecto:'',ot:'',cliente:''};
      // scan first 8 rows, all columns, looking for label+value pairs
      for(let i=0;i<8;i++){
        const row=raw[i]||[];
        for(let c=0;c<row.length-1;c++){
          const lbl=String(row[c]||'').toUpperCase().trim();
          const val=String(row[c+1]||'').trim();
          if(!lbl||!val) continue;
          if(lbl.includes('PROYECTO')) info.proyecto=val;
          else if((lbl==='OT'||lbl==='OT:'||lbl.match(/^N[°ºo]?\s*(DE\s*)?OT/))) info.ot=val.replace(/\.0$/,'');
          else if(lbl.includes('CLIENTE')) info.cliente=val;
        }
      }
      // always update OT info from Excel
      console.log('Info leída del Excel:', info);
      if(info.proyecto) ot.info.proyecto=info.proyecto;
      if(info.ot) ot.info.ot=info.ot;
      if(info.cliente) ot.info.cliente=info.cliente;

      // find header row by looking for 'POSICIÓN' or 'POSICION'
      let headerRow=-1;
      let colMap={pos:-1,plano:-1,denom:-1,qty:-1,pesoUnit:-1,pesoTotal:-1,construye:-1,prioridad:-1};
      for(let i=0;i<20;i++){
        const row=raw[i]||[];
        const rowStr=row.map(c=>String(c||'').toUpperCase().trim());
        const posIdx=rowStr.findIndex(c=>c==='POSICIÓN'||c==='POSICION');
        if(posIdx>=0){
          headerRow=i;
          colMap.pos=posIdx;
          colMap.plano=rowStr.findIndex(c=>c.includes('PLANO'));
          colMap.denom=rowStr.findIndex(c=>c.includes('DENOM'));
          colMap.qty=rowStr.findIndex(c=>c==='CANTIDAD'||c==='CANT.');
          colMap.pesoUnit=rowStr.findIndex(c=>c.includes('PESO')&&c.includes('UNIT'));
          colMap.pesoTotal=rowStr.findIndex(c=>c.includes('PESO')&&(c.includes('TOTAL')||c.includes('TOT')));
          colMap.construye=rowStr.findIndex(c=>c.includes('CONSTRUYE'));
          colMap.prioridad=rowStr.findIndex(c=>c.includes('PRIORIDAD')||c.includes('PRIOR'));
          break;
        }
      }
      if(headerRow<0){ state.parseError='No se encontró la fila de encabezados. Verificá el archivo.'; render(); return; }

      const positions=[];
      for(let i=headerRow+1;i<raw.length;i++){
        const row=raw[i];
        const pos=colMap.pos>=0?String(row[colMap.pos]||'').trim():'';
        const plano=colMap.plano>=0?String(row[colMap.plano]||'').trim():'';
        if(!pos) continue;

        const rawQty=colMap.qty>=0?row[colMap.qty]:'';
        const rawPU=colMap.pesoUnit>=0?row[colMap.pesoUnit]:'';
        const rawPT=colMap.pesoTotal>=0?row[colMap.pesoTotal]:'';
        const rawConstr=colMap.construye>=0?String(row[colMap.construye]||'').trim():'';
        const rawPrior=colMap.prioridad>=0?String(row[colMap.prioridad]||'').trim():'';

        const qty=rawQty!==''?Number(rawQty):'' ;
        const pesoUnit=rawPU!==''?Number(rawPU):'';
        const pesoTotal=rawPT!==''?Number(rawPT):'';

        positions.push({
          uid: genId(),
          pos, plano,
          denom:  colMap.denom>=0?String(row[colMap.denom]||'').trim():'',
          qty:    isNaN(qty)?'':qty,
          pesoUnit:  isNaN(pesoUnit)?'':pesoUnit,
          pesoTotal: isNaN(pesoTotal)?'':pesoTotal,
          construye: rawConstr,
          prioridad: rawPrior,
        });
      }

      if(!positions.length){ state.parseError='No se encontraron posiciones válidas.'; }
      else{
        state.parseError=null;
        // Check if this is a re-upload (packing already published)
        if(ot.plPublished){
          handleReuploadMerge(ot, positions);
        } else {
          ot.draftPositions=positions;
          savePersisted();
        }
      }
    }catch(err){
      state.parseError='No se pudo leer el archivo. Asegurate de subir un .xls o .xlsx válido.';
      console.error(err);
    }
    render();
  };
  reader.readAsArrayBuffer(file);
}

// ── REUPLOAD MERGE ───────────────────────────────────────
// Returns true if a position has any avance/control/inspection data
function posHasWorkData(ot, posId, pos){
  const pd=ot.prodData?.[posId];
  if(pd && (pd.fechaInicioArmado||pd.avanceArmado||pd.fechaInicioSoldadura||pd.avanceSoldadura||pd.pintado)) return true;
  const ce=ot.calExtData?.[posId];
  if(ce && (ce.armadas||ce.soldadas||ce.pintadas)) return true;
  if(pos.processes && pos.processes.some(p=>p.status!=='pending'||(p.history||[]).length>0)) return true;
  if(pos.subs && pos.subs.some(s=>s.processes.some(p=>p.status!=='pending'||(p.history||[]).length>0))) return true;
  if(pos.loteId) return true;
  if(pos.subs && pos.subs.some(s=>s.loteId)) return true;
  return false;
}

// Compute what changes would happen without applying them
function computeReuploadChanges(ot, newRows){
  const existing=ot.positions||[];
  const existingById={};
  existing.forEach(p=>{ existingById[p.id]=p; });
  const newIds=new Set(newRows.map(r=>r.pos));

  const changes={added:[], removed:[], modified:[], qtyChanged:[], removedWithData:[]};

  const sameStr = (a,b) => String(a||'').trim() === String(b||'').trim();
  const sameNum = (a,b) => {
    const na=Number(a)||0, nb=Number(b)||0;
    return Math.abs(na-nb)<0.01;
  };

  // detect added and modified
  newRows.forEach(row=>{
    const old=existingById[row.pos];
    if(!old){
      changes.added.push({id:row.pos, denom:row.denom, qty:Number(row.qty)||1});
    } else {
      const oldQty=Number(old.qty)||1;
      const newQty=Number(row.qty)||1;
      const fieldChanges=[];
      if(!sameStr(old.denom, row.denom))           fieldChanges.push('denominación');
      if(!sameStr(old.plano, row.plano))           fieldChanges.push('plano');
      if(!sameNum(old.pesoUnit, row.pesoUnit))     fieldChanges.push('peso unit.');
      if(!sameNum(old.pesoTotal, row.pesoTotal))   fieldChanges.push('peso total');
      if(!sameStr(old.construye, row.construye))   fieldChanges.push('construye en');
      if(!sameStr(old.prioridad, row.prioridad))   fieldChanges.push('prioridad');
      if(oldQty!==newQty){
        changes.qtyChanged.push({id:row.pos, denom:row.denom, oldQty, newQty});
      } else if(fieldChanges.length>0){
        changes.modified.push({id:row.pos, denom:row.denom, fields:fieldChanges});
      }
    }
  });

  // detect removed
  existing.forEach(p=>{
    if(!newIds.has(p.id)){
      const hasData=posHasWorkData(ot, prodKey(p), p);
      const item={id:p.id, denom:p.denom||'', qty:p.qty||1, hasData};
      changes.removed.push(item);
      if(hasData) changes.removedWithData.push(item);
    }
  });

  return changes;
}

function handleReuploadMerge(ot, newRows){
  // always show preview, don't auto-merge
  const changes=computeReuploadChanges(ot, newRows);
  state.modal={
    type:'reupload-preview',
    newRows,
    changes,
  };
  render();
}

function performReuploadMerge(ot, newRows){
  const existing=ot.positions||[];
  const existingById={};
  existing.forEach(p=>{ existingById[p.id]=p; });

  const newIds=new Set(newRows.map(r=>r.pos));
  const removedIds=existing.filter(p=>!newIds.has(p.id)).map(p=>p.id);

  // recompute changes for success summary
  const changes=computeReuploadChanges(ot, newRows);

  // build new positions list
  const newPositions=newRows.map(row=>{
    const existing=existingById[row.pos];
    if(existing){
      const oldQty=Number(existing.qty)||1;
      const newQty=Number(row.qty)||1;
      const merged={
        ...existing,
        denom: row.denom,
        plano: row.plano,
        pesoUnit: row.pesoUnit,
        pesoTotal: row.pesoTotal,
        construye: row.construye,
        prioridad: row.prioridad,
        qty: newQty,
      };
      if(newQty>1){
        if(!merged.subs) merged.subs=[];
        while(merged.subs.length<newQty){
          merged.subs.push({
            subId:`${row.pos}-${merged.subs.length+1}`,
            processes:mkProcs(),
            activeProc:0
          });
        }
        if(merged.subs.length>newQty) merged.subs=merged.subs.slice(0,newQty);
      } else {
        merged.subs=null;
      }
      return merged;
    } else {
      const fresh={
        id:row.pos,
        uid: row.uid || genId(),
        ...row,
        processes:mkProcs(),
        activeProc:0,
        subs:null
      };
      if(Number(row.qty)>1){
        fresh.subs=Array.from({length:Number(row.qty)},(_,i)=>({
          subId:`${row.pos}-${i+1}`,
          processes:mkProcs(),
          activeProc:0
        }));
      }
      return fresh;
    }
  });

  // clean prodData and calExtData for removed positions
  removedIds.forEach(id=>{
    delete ot.prodData?.[id];
    delete ot.calExtData?.[id];
    (ot.lotes||[]).forEach(l=>{
      if(l.posIds) l.posIds=l.posIds.filter(pid=>pid!==id);
      if(l.subPosIds) l.subPosIds=l.subPosIds.filter(spid=>!spid.startsWith(id+'::'));
    });
  });

  ot.positions=newPositions;
  ot.draftPositions=newRows;
  savePersisted();
  state.modal={type:'reupload-success', changes};
  render();
}




// ── INIT ──────────────────────────────────────────────────
(async ()=>{
  // show loading while fetching from Supabase
  document.getElementById('app').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;background:var(--bg)">
      <div style="width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite"></div>
      <div style="font-family:var(--mono);font-size:13px;color:var(--text3)">Cargando Cimomet… 🚀</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;

  // Only pull OTs from Supabase; role/theme/etc stay device-local
  const remote=await pullFromSupabase();
  if(remote && Array.isArray(remote.ots)){
    state.ots = remote.ots;
    // only overwrite local inspectores if remote has actual data
    if(Array.isArray(remote.inspectores) && remote.inspectores.length>0){
      state.inspectores = remote.inspectores;
    }
    savePrefs();
  }
  // backup before migration (one-time, kept in localStorage in case anything goes wrong)
  try{
    const backupKey='cimomet_backup_pre_uid';
    if(!localStorage.getItem(backupKey)){
      const backup={
        date: new Date().toISOString(),
        ots: state.ots,
        inspectores: state.inspectores||[],
      };
      localStorage.setItem(backupKey, JSON.stringify(backup));
      console.log('[Cimomet] Backup creado antes de la migración uid. Si necesitás restaurarlo, está guardado en localStorage["cimomet_backup_pre_uid"]');
    }
  }catch(e){ console.warn('No se pudo crear backup:', e); }

  // migrate prodData keys for positions that share pos.id across different prioridades
  state.ots.forEach(ot=>migrateProdData(ot));
  // daily snapshot backup (keep last 7 days)
  try{
    const today = new Date().toISOString().slice(0,10);
    const snapKey = 'cimomet_snap_'+today;
    if(!localStorage.getItem(snapKey)){
      localStorage.setItem(snapKey, JSON.stringify({date:today, ots:state.ots, inspectores:state.inspectores||[]}));
      // cleanup older than 7 days
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
      const cutoffKey = 'cimomet_snap_'+cutoff.toISOString().slice(0,10);
      const toRemove = [];
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && k.startsWith('cimomet_snap_') && k<cutoffKey) toRemove.push(k);
      }
      toRemove.forEach(k=>localStorage.removeItem(k));
    }
  }catch(e){}
  document.body.classList.toggle('light', state.theme==='light');
  // initialize history with current state (replace, don't push)
  history.replaceState({
    view: state.view, activeOtId: state.activeOtId, modal: null,
    homeTab: state.homeTab, adminView: state.adminView
  }, '', '');
  _lastNavKey = navKey();
  render();

  // poll every 15s for OT changes from other devices
  setInterval(async ()=>{
    const fresh=await pullFromSupabase();
    if(!fresh || !Array.isArray(fresh.ots)) return;
    const otsChanged=JSON.stringify(fresh.ots)!==JSON.stringify(state.ots);
    // only update inspectores if remote has actual data (avoid overwriting with empty)
    const remoteInsp=Array.isArray(fresh.inspectores)?fresh.inspectores:null;
    const inspChanged=remoteInsp&&JSON.stringify(remoteInsp)!==JSON.stringify(state.inspectores);
    if(otsChanged||inspChanged){
      if(otsChanged) state.ots=fresh.ots;
      if(inspChanged && remoteInsp.length>0) state.inspectores=remoteInsp;
      savePrefs();
      render();
    }
  }, 15000);
})();
