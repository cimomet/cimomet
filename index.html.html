    const completa = cd==='approved' && ap==='approved' && posLoteCtx.loteAprobado && !posLoteCtx.loteRechazoIndividual;
    const algunRechazo = cd==='rejected' || ap==='rejected' || posLoteCtx.loteRechazoIndividual;
    const sinInspeccionar = cd==='pending' && ap==='pending' && pin==='pending';

    switch(estado){
      case 'sin-inspeccionar': return sinInspeccionar;
      case 'cd-aprobado':     return cd==='approved';
      case 'cd-rechazado':    return cd==='rejected';
      case 'ap-aprobado':     return ap==='approved';
      case 'ap-rechazado':    return ap==='rejected';
      case 'completas':       return completa;
      case 'algun-rechazo':   return algunRechazo;
    }
    return true;
  }

  // For a position with subs, returns an object {matchParent, matchedSubs:Set<subId>}
  // For a position without subs, returns {matchParent:bool, matchedSubs:null}
  function evaluatePosEstado(pos, estado){
    if(!estado) return {matchParent:true, matchedSubs:null};

    // build lote context per target (parent or sub)
    function loteCtxFor(targetLoteId, targetKey, isSub){
      let loteAprobado=false, loteRechazoIndividual=false;
      if(targetLoteId){
        const lote=(ot.lotes||[]).find(l=>l.id===targetLoteId);
        if(lote && lote.estado==='aprobado'){
          loteAprobado=true;
          if(isSub){
            if(lote.subPosEstados?.[targetKey]==='rechazado') loteRechazoIndividual=true;
          } else {
            if(lote.posEstados?.[targetKey]==='rechazado') loteRechazoIndividual=true;
          }
        }
      }
      return {loteAprobado, loteRechazoIndividual};
    }

    if(pos.subs && pos.subs.length>0){
      const matchedSubs=new Set();
      pos.subs.forEach(sub=>{
        const spid=`${pos.id}::${sub.subId}`;
        const ctx=loteCtxFor(sub.loteId, spid, true);
        if(targetMatchesEstado(sub, estado, ctx)) matchedSubs.add(sub.subId);
      });
      return {matchParent:matchedSubs.size>0, matchedSubs};
    } else {
      const ctx=loteCtxFor(pos.loteId, pos.id, false);
      return {matchParent:targetMatchesEstado(pos, estado, ctx), matchedSubs:null};
    }
  }

  const estadoFilter=f.calEstado||'';
  // map of posId -> {matchParent, matchedSubs}
  const estadoMatch={};

  const filtered=positions.filter(pos=>{
    if(selectedTalleresCal.length>0&&!selectedTalleresCal.includes(getTallerCal(pos))) return false;
    if(f.buscar){
      const q=f.buscar.toLowerCase();
      if(!String(pos.id||'').toLowerCase().includes(q)&&!String(pos.denom||'').toLowerCase().includes(q)) return false;
    }
    if(f.prioridad&&String(pos.prioridad||'')!==f.prioridad) return false;
    const m=evaluatePosEstado(pos, estadoFilter);
    estadoMatch[pos.id]=m;
    if(estadoFilter && !m.matchParent) return false;
    return true;
  });

  function calRowActions(processes, posId, subIdx){
    const overall=processes.every(p=>p.status==='approved')?'done':
      processes.some(p=>p.assignee||p.status==='approved'||p.status==='rejected')?'in_progress':'pending';
    if(overall==='done') return '';
    const sidx=subIdx!==null?`data-subidx="${subIdx}"`:'';
    const btns=CAL_PROCS.map((n,i)=>{
      // PINT (i=2) is managed only via Pintura lotes
      if(i===2) return '';
      const proc=processes[i];
      const isInspected=proc.status==='approved'||proc.status==='rejected';
      const hasPartial=proc.history&&proc.history.length>0;
      const canInsp=calCanInspect({processes},i);
      if(isInspected){
        return `<button type="button" class="abtn corr" data-act="modificar" data-id="${esc(posId)}" data-pidx="${i}" ${sidx}>Mod. ${CAL_SHORT[i]}</button>`;
      } else {
        const lbl = hasPartial ? `${CAL_SHORT[i]}*` : CAL_SHORT[i];
        const tip = !canInsp ? 'Requiere armado aprobado' : (hasPartial ? 'Tiene controles parciales' : '');
        return `<button type="button" class="abtn${canInsp?'':' abtn-disabled'}" data-act="inspect-proc" data-id="${esc(posId)}" data-pidx="${i}" ${sidx} title="${esc(tip)}">${lbl}</button>`;
      }
    }).join('');
    return `<div class="abtn-group">${btns}</div>`;
  }

  // ensure calExtData on ot
  if(!ot.calExtData) ot.calExtData={};
  function isExt(pos){ return normLugar(pos.construye)==='ext'; }
  const sg2='background:rgba(62,207,122,0.15);border-color:rgba(62,207,122,0.4);color:var(--green);';
  const hasAnyExt=filtered.some(p=>isExt(p));

  function extAvanceInputs(pos){
    const qty=Number(pos.qty)||1;
    const d=ot.calExtData[prodKey(pos)]||{};
    const arm=d.armadas!==undefined?d.armadas:'';
    const sol=d.soldadas!==undefined?d.soldadas:'';
    const pin=d.pintadas!==undefined?d.pintadas:'';
    const armOk=arm!==''&&Number(arm)===qty;
    const solOk=sol!==''&&Number(sol)===qty;
    const pinOk=pin!==''&&Number(pin)===qty;
    return `<div style="display:flex;gap:6px;align-items:center">
      <div style="text-align:center">
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:3px">ARM</div>
        <input type="number" class="prod-input calext-input" data-extid="${esc(prodKey(pos))}" data-extfield="armadas" value="${arm}" min="0" max="${qty}" placeholder="0" style="width:52px;${armOk?sg2:''}"/>
      </div>
      <div style="text-align:center">
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:3px">SOL</div>
        <input type="number" class="prod-input calext-input" data-extid="${esc(prodKey(pos))}" data-extfield="soldadas" value="${sol}" min="0" max="${qty}" placeholder="0" style="width:52px;${solOk?sg2:''}"/>
      </div>
      <div style="text-align:center">
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:3px">PIN</div>
        <input type="number" class="prod-input calext-input" data-extid="${esc(prodKey(pos))}" data-extfield="pintadas" value="${pin}" min="0" max="${qty}" placeholder="0" style="width:52px;${pinOk?sg2:''}"/>
      </div>
    </div>`;
  }

  const rows=filtered.map(pos=>{
    const hasSubs=pos.subs&&pos.subs.length>0;
    const isExpanded=!!state.expanded[prodKey(pos)];
    const ext=isExt(pos);
    const expandBtn=hasSubs
      ? `<button type="button" class="expand-btn ${isExpanded?'open':''} " data-expand="${esc(prodKey(pos))}"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
      : '<span style="display:inline-block;width:20px"></span>';

    const pipeline = hasSubs
      ? renderPipeline(CAL_PROCS.map((_,i)=>{
          const subs=pos.subs;
          const allOk  = subs.every(s=>s.processes[i]?.status==='approved');
          const anyRej = subs.some(s=>s.processes[i]?.status==='rejected');
          const anyPartial = subs.some(s=>(s.processes[i]?.history||[]).length>0);
          return {
            status: allOk?'approved': anyRej?'rejected':'pending',
            history: anyPartial&&!allOk&&!anyRej?[{}]:[]
          };
        }), CAL_SHORT, {posId:pos.uid||pos.id, posIdAlt:pos.id, subId:null, subIds:pos.subs.map(s=>s.subId), otLotes:ot.lotes})
      : renderPipeline(pos.processes, CAL_SHORT, {posId:pos.uid||pos.id, posIdAlt:pos.id, subId:null, otLotes:ot.lotes});
    const mainAction = hasSubs
      ? `<div class="abtn-group">${calRowActions(pos.processes, prodKey(pos), null)}<button type="button" class="abtn" style="font-size:10px;border-color:rgba(138,122,196,0.3);color:var(--purple)" data-calapplyall="${esc(prodKey(pos))}" title="Replicar estado a todas las unidades">→ Todas</button></div>`
      : calRowActions(pos.processes, prodKey(pos), null);

    let mainRow=`<tr ${hasSubs?`data-expand="${esc(prodKey(pos))}" style="cursor:pointer"`:''}>
      <td class="mono" style="color:var(--accent);font-weight:500">${esc(pos.prioridad||'—')}</td>
      <td class="mono" style="font-weight:500">${expandBtn} ${esc(pos.id)}</td>
      <td><div style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(pos.denom)}">${esc(pos.denom)}</div></td>
      <td class="mono">${pos.qty!==''&&pos.qty!==undefined?pos.qty:'—'}</td>
      <td><div class="pipeline">${pipeline}</div></td>
      <td>${mainAction}</td>
      ${hasAnyExt?`<td>${ext?extAvanceInputs(pos):'<span style="color:var(--text3);font-size:11px">—</span>'}</td>`:''}
      <td style="min-width:80px">${(()=>{
        if(hasSubs) return '<span style="font-family:var(--mono);font-size:10px;color:var(--text3)">ver subs</span>';
        const lote=ot.lotes?.find(l=>l.id===pos.loteId);
        return `<div style="display:flex;align-items:center;gap:4px">
          ${lote?`<span style="font-family:var(--mono);font-size:10px;color:var(--accent2)">${esc(lote.nombre)}</span>`:'<span style="color:var(--text3);font-size:11px">—</span>'}
        </div>`;
      })()}</td>
    </tr>`;

    let subRows='';
    const filterActive=!!estadoFilter;
    const matchedSubsSet=estadoMatch[pos.id]?.matchedSubs;
    const shouldShowSubs=hasSubs && (isExpanded || filterActive);
    if(shouldShowSubs){
      const subsToShow = (filterActive && matchedSubsSet)
        ? pos.subs.filter(s => matchedSubsSet.has(s.subId))
        : pos.subs;
      subRows=subsToShow.map((sub,_)=>{
        const realIdx=pos.subs.indexOf(sub);
        const subPipeline=renderPipeline(sub.processes, CAL_SHORT, {posId:pos.uid||pos.id, posIdAlt:pos.id, subId:sub.subId, otLotes:ot.lotes});
        const subAction=calRowActions(sub.processes, prodKey(pos), realIdx);
        const subLote=ot.lotes?.find(l=>l.id===sub.loteId);
        return `<tr class="sub-row">
          <td></td>
          <td class="sub-id">${esc(sub.subId)}</td>
          <td style="color:var(--text3);font-size:12px">${esc(pos.denom)}</td>
          <td class="mono" style="color:var(--text3)">1</td>
          <td><div class="pipeline">${subPipeline}</div></td>
          <td>${subAction}</td>
          ${hasAnyExt?'<td></td>':''}
          <td>${subLote?`<span style="font-family:var(--mono);font-size:11px;color:var(--accent2)">${esc(subLote.nombre)}</span>`:'<span style="color:var(--text3);font-size:11px">—</span>'}</td>
        </tr>`;
      }).join('');
    }

    return mainRow+subRows;
  }).join('');

  return `<div class="topbar">
    <div><div class="topbar-title">Posiciones</div><div class="topbar-meta">OT ${esc(pi.ot)} · ${esc(pi.proyecto||'')}</div></div>
  </div>
  <div class="content">
    <div style="margin-bottom:0.75rem">
      <input id="inp-buscar" type="text" placeholder="Buscar por posición o denominación…" value="${esc(f.buscar)}" style="max-width:320px;background:var(--bg2);border-color:var(--border2);font-family:var(--mono);font-size:12px;"/>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <span class="filter-lbl">Taller</span>
      <button type="button" class="fbtn ${selectedTalleresCal.length===0?'on':''}" data-taller-all="1">Todos</button>
      ${talleresCal.map(t=>`<button type="button" class="fbtn ${selectedTalleresCal.includes(t)?'on':''}" data-taller="${esc(t)}">${esc(t)}</button>`).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <span class="filter-lbl">Prioridad</span>
      <button type="button" class="fbtn ${!f.prioridad?'on':''}" data-fk="prioridad" data-fv="">Todas</button>
      ${prioridades.map(p=>`<button type="button" class="fbtn ${f.prioridad===p?'on':''}" data-fk="prioridad" data-fv="${esc(p)}">${esc(p)}</button>`).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:0.75rem">
      <span class="filter-lbl">Estado</span>
      <button type="button" class="fbtn ${!(f.calEstado)?'on':''}" data-cal-estado="">Todos</button>
      ${[
        {id:'sin-inspeccionar', label:'Sin inspeccionar', color:'var(--text3)'},
        {id:'cd-aprobado', label:'CD aprobado', color:'var(--green)'},
        {id:'cd-rechazado', label:'CD rechazado', color:'var(--red)'},
        {id:'ap-aprobado', label:'AP aprobado', color:'var(--green)'},
        {id:'ap-rechazado', label:'AP rechazado', color:'var(--red)'},
        {id:'completas', label:'Completas', color:'var(--green)'},
        {id:'algun-rechazo', label:'Con rechazo', color:'var(--red)'},
      ].map(opt=>{
        const sel=f.calEstado===opt.id;
        return `<button type="button" class="fbtn ${sel?'on':''}" data-cal-estado="${opt.id}" style="${sel?`border-color:${opt.color};color:${opt.color}`:''}">${opt.label}</button>`;
      }).join('')}
    </div>
    <div class="results-count">${filtered.length} de ${positions.length} posiciones${selectedTalleresCal.length>0?` · ${selectedTalleresCal.join(', ')}`:''}</div>

    <!-- DESKTOP: tabla -->
    <div class="tbl-wrap cal-desktop-table">
    <table class="tbl">
      <thead><tr>
        <th style="color:var(--text)">Prioridad</th>
        <th style="color:var(--text)">Posición</th>
        <th style="color:var(--text)">Denominación</th>
        <th style="color:var(--text)">Cant.</th>
        <th style="color:var(--text)">Proceso</th>
        <th style="color:var(--text)">Acción</th>
        ${hasAnyExt?`<th style="color:var(--text)">Avance ext.</th>`:''}
        <th style="color:var(--text)">Lote PIN</th>
      </tr></thead>
      <tbody>${rows.length?rows:`<tr><td colspan="${hasAnyExt?7:6}" style="text-align:center;padding:3rem;color:var(--text3);font-family:var(--mono);font-size:12px">Sin resultados.</td></tr>`}</tbody>
    </table>
    </div>

    <!-- MOBILE: cards -->
    <div class="cal-mobile-cards">
      ${filtered.length===0
        ? `<div style="text-align:center;padding:3rem 1rem;color:var(--text3);font-family:var(--mono);font-size:12px">Sin resultados.</div>`
        : filtered.map(pos=>{
            const hasSubs=pos.subs&&pos.subs.length>0;
            const isExpanded=!!state.expanded[prodKey(pos)];
            const ext=isExt(pos);
            const pipeline=hasSubs
              ? renderPipeline(CAL_PROCS.map((_,i)=>{
                  const subs=pos.subs;
                  const allOk=subs.every(s=>s.processes[i]?.status==='approved');
                  const anyRej=subs.some(s=>s.processes[i]?.status==='rejected');
                  const anyPartial=subs.some(s=>(s.processes[i]?.history||[]).length>0);
                  return {status:allOk?'approved':anyRej?'rejected':'pending',history:anyPartial&&!allOk&&!anyRej?[{}]:[]};
                }),CAL_SHORT,{posId:pos.uid||pos.id, posIdAlt:pos.id, subId:null, subIds:pos.subs.map(s=>s.subId), otLotes:ot.lotes})
              : renderPipeline(pos.processes,CAL_SHORT,{posId:pos.uid||pos.id, posIdAlt:pos.id, subId:null, otLotes:ot.lotes});
            const mainAction=calRowActions(pos.processes, prodKey(pos),null);

            const allSubsAction = hasSubs ? `<div class="abtn-group">
              ${CAL_PROCS.map((n,i)=>{
                if(i===2) return ''; // PINT managed via Pintura lotes
                const allApproved=pos.subs.every(s=>s.processes[i]?.status==='approved');
                if(allApproved){
                  return `<button type="button" class="abtn corr" style="min-height:38px;padding:6px 10px" data-act="calapplyall-proc" data-id="${esc(prodKey(pos))}" data-pidx="${i}">Mod. ${CAL_SHORT[i]}</button>`;
                } else {
                  return `<button type="button" class="abtn" style="min-height:38px;padding:6px 10px" data-act="calapplyall-proc" data-id="${esc(prodKey(pos))}" data-pidx="${i}">${CAL_SHORT[i]}</button>`;
                }
              }).join('')}
              <button type="button" class="abtn" style="min-height:38px;padding:6px 10px;border-color:rgba(138,122,196,0.3);color:var(--purple)" data-expand-inline="${esc(prodKey(pos))}" title="Ver unidades">
                <svg viewBox="0 0 16 16" fill="none" style="width:12px;height:12px;display:inline-block;vertical-align:middle"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>` : '';

            // mobile ext avance inputs
            const extMobile = ext ? (()=>{
              const qty=Number(pos.qty)||1;
              const d=ot.calExtData[prodKey(pos)]||{};
              const arm=d.armadas!==undefined?d.armadas:'';
              const sol=d.soldadas!==undefined?d.soldadas:'';
              const pin=d.pintadas!==undefined?d.pintadas:'';
              const armOk=arm!==''&&Number(arm)===qty;
              const solOk=sol!==''&&Number(sol)===qty;
              const pinOk=pin!==''&&Number(pin)===qty;
              return `<div style="margin-top:10px;padding:10px;background:rgba(138,122,196,0.06);border-radius:var(--r);border:1px solid rgba(138,122,196,0.2)">
                <div style="font-family:var(--mono);font-size:10px;color:var(--purple);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Avance en taller externo</div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
                  <div>
                    <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">Armadas</div>
                    <input type="number" class="prod-input calext-input" data-extid="${esc(prodKey(pos))}" data-extfield="armadas" value="${arm}" min="0" max="${qty}" placeholder="0" style="width:100%;${armOk?sg2:''}"/>
                  </div>
                  <div>
                    <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">Soldadas</div>
                    <input type="number" class="prod-input calext-input" data-extid="${esc(prodKey(pos))}" data-extfield="soldadas" value="${sol}" min="0" max="${qty}" placeholder="0" style="width:100%;${solOk?sg2:''}"/>
                  </div>
                  <div>
                    <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">Pintadas</div>
                    <input type="number" class="prod-input calext-input" data-extid="${esc(prodKey(pos))}" data-extfield="pintadas" value="${pin}" min="0" max="${qty}" placeholder="0" style="width:100%;${pinOk?sg2:''}"/>
                  </div>
                </div>
              </div>`;
            })() : '';

            return `<div style="background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
                <div>
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
                    ${hasSubs?`<button type="button" class="expand-btn ${isExpanded?'open':''}" data-expand="${esc(prodKey(pos))}"><svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`:''}
                    <span style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)">${esc(pos.id)}</span>
                    ${pos.prioridad?`<span class="chip" style="background:rgba(79,142,247,0.1);color:var(--accent2);border-radius:20px;font-family:var(--mono);font-size:10px">${esc(pos.prioridad)}</span>`:''}
                    ${ext?`<span class="chip" style="background:rgba(138,122,196,0.12);color:var(--purple);border-radius:20px;font-family:var(--mono);font-size:10px">${esc(pos.construye)}</span>`:''}
                  </div>
                  <div style="font-size:13px;color:var(--text2)">${esc(pos.denom)}</div>
                  <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:2px">Cant: ${pos.qty!==''&&pos.qty!==undefined?pos.qty:'—'}</div>
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                <div class="pipeline">${pipeline}</div>
                ${hasSubs ? allSubsAction : `<div class="abtn-group">${mainAction}</div>`}
              </div>
              ${extMobile}
              ${(()=>{
                const filterActive=!!estadoFilter;
                const matchedSubsSet=estadoMatch[pos.id]?.matchedSubs;
                const showSubs=hasSubs && (isExpanded || filterActive);
                if(!showSubs) return '';
                const subsToShow=(filterActive && matchedSubsSet)
                  ? pos.subs.filter(s=>matchedSubsSet.has(s.subId))
                  : pos.subs;
                return subsToShow.map((sub,_)=>{
                  const i=pos.subs.indexOf(sub);
                  return `
                <div style="margin-top:8px;padding:10px 12px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border2)">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <span style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent2)">${esc(sub.subId)}</span>
                    ${(()=>{
                      const subLote=ot.lotes?.find(l=>l.id===sub.loteId);
                      return subLote?`<span style="font-family:var(--mono);font-size:10px;color:var(--accent2)">Lote: ${esc(subLote.nombre)}</span>`:'';
                    })()}
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <div class="pipeline">${renderPipeline(sub.processes,CAL_SHORT,{posId:pos.uid||pos.id, posIdAlt:pos.id, subId:sub.subId, otLotes:ot.lotes})}</div>
                    <div class="abtn-group">${calRowActions(sub.processes, prodKey(pos),i)}</div>
                  </div>
                </div>`;
                }).join('');
              })()}
            </div>`;
          }).join('')
      }
    </div>
  </div>`;
}

// ── MODAL ─────────────────────────────────────────────────
function renderModal(){
  if(state.modal?.type==='lote-obs'||state.modal?.type==='lote-accion') return renderLoteModal();
  if(state.modal?.type==='lote-asignar') return renderLoteAsignModal();
  if(state.modal?.type==='lote-asignar-sub') return renderLoteAsignSubModal();
  if(state.modal?.type==='lote-selector') return renderLoteSelectorModal();
  const m=state.modal;
  if(m.type==='inspector-login'){
    const inspectores=state.inspectores||[];
    const actual=state.inspectorActivo;
    const opts=inspectores.map(i=>`<option value="${esc(i.id)}" ${actual&&actual.id===i.id?'selected':''}>${esc(i.nombre)}</option>`).join('');
    if(inspectores.length===0){
      return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
        <div class="modal-title">Sin inspectores registrados</div>
        <div class="modal-sub">Todavía no hay inspectores creados. ${state.role==='admin'?'Podés crear uno ahora desde el panel de gestión.':'Pedile al Admin que cree tu usuario.'}</div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="btn-inspector-volver-rol">Cambiar de rol</button>
          ${state.role==='admin'?`<button type="button" class="btn-approve" id="btn-ir-inspectores">Crear inspector</button>`:''}
        </div>
      </div></div>`;
    }
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Iniciar sesión como inspector</div>
      ${actual?`<div style="padding:8px 12px;background:rgba(62,207,122,0.1);border:1px solid rgba(62,207,122,0.3);border-radius:var(--r);margin-bottom:1rem;font-family:var(--mono);font-size:12px;color:var(--green)">Sesión activa: 👤 ${esc(actual.nombre)}</div>`:''}
      <div class="modal-sub">Seleccioná tu usuario para que quede registrado en cada control que realices.</div>
      <div class="modal-field"><label>Inspector</label>
        <select id="sel-inspector" style="width:100%;padding:10px 12px;font-size:14px">${opts}</select>
      </div>
      <div class="modal-field"><label>Contraseña <span style="color:var(--text3);font-size:11px">(si tiene)</span></label>
        <input id="inp-inspector-pw" type="password" placeholder="Dejar vacío si no tiene contraseña"/>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-inspector-volver-rol">Cambiar de rol</button>
        ${actual?`<button type="button" class="abtn" id="btn-inspector-sin-sesion">Cerrar sesión</button>`:''}
        <button type="button" class="btn-ok" id="btn-inspector-login-ok">Ingresar</button>
      </div>
    </div></div>`;
  }

  if(m.type==='inspectores-admin'){
    const lista=(state.inspectores||[]).map((i,idx)=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg3);border-radius:var(--r);margin-bottom:6px">
        <div>
          <span style="font-family:var(--mono);font-size:13px;font-weight:600">${esc(i.nombre)}</span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:8px">${i.password?'🔒 con contraseña':'sin contraseña'}</span>
        </div>
        <div class="abtn-group">
          <button type="button" class="abtn" data-insp-edit="${idx}">Editar</button>
          <button type="button" class="abtn" style="color:var(--red);border-color:rgba(240,94,106,0.3)" data-insp-del="${idx}">✕</button>
        </div>
      </div>`).join('');
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal" style="max-width:560px">
      <div class="modal-title">Gestión de inspectores</div>
      <div style="margin-bottom:1rem;max-height:300px;overflow-y:auto">
        ${lista||`<div style="font-family:var(--mono);font-size:12px;color:var(--text3);text-align:center;padding:1.5rem">Sin inspectores registrados</div>`}
      </div>
      <div style="border-top:1px solid var(--border);padding-top:1rem">
        <div style="font-family:var(--mono);font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">${m.editIdx!==undefined?'Editar inspector':'Agregar inspector'}</div>
        <div class="modal-field" style="margin-bottom:8px"><label>Nombre</label>
          <input id="inp-insp-nombre" type="text" placeholder="Ej: Juan Pérez" value="${m.editIdx!==undefined?esc(state.inspectores[m.editIdx]?.nombre||''):''}"/>
        </div>
        <div class="modal-field" style="margin-bottom:8px"><label>Contraseña <span style="color:var(--text3);font-size:11px">(opcional)</span></label>
          <input id="inp-insp-pw" type="password" placeholder="Dejar vacío para sin contraseña"/>
        </div>
        <div class="modal-actions" style="margin-top:0">
          <button type="button" class="btn-cancel" id="btn-close">Cerrar</button>
          <button type="button" class="btn-ok" id="btn-insp-save" data-edit-idx="${m.editIdx!==undefined?m.editIdx:''}">${m.editIdx!==undefined?'Guardar cambios':'Agregar inspector'}</button>
        </div>
      </div>
    </div></div>`;
  }
  if(m.type==='reupload-preview'){
    const c=m.changes;
    const totalChanges=c.added.length+c.removed.length+c.modified.length+c.qtyChanged.length;
    const sectionTitle=(label,count,color)=>`<div style="font-family:var(--mono);font-size:10px;color:${color};text-transform:uppercase;letter-spacing:0.1em;margin:14px 0 6px">${label} (${count})</div>`;
    const itemLi=(content,warn)=>`<li style="font-family:var(--mono);font-size:12px;padding:5px 10px;background:${warn?'rgba(240,94,106,0.08)':'var(--bg3)'};border-radius:var(--r);margin-bottom:4px${warn?';border:1px solid rgba(240,94,106,0.3)':''}">${content}</li>`;

    if(totalChanges===0){
      return `<div class="modal-overlay" id="modal-overlay"><div class="modal" style="max-width:500px">
        <div class="modal-title">Sin cambios detectados</div>
        <div class="modal-sub">El Excel subido es idéntico al packing list actual. No hay nada para actualizar.</div>
        <div class="modal-actions">
          <button type="button" class="btn-ok" id="btn-close">Entendido</button>
        </div>
      </div></div>`;
    }

    const hasRemovedWithData=c.removedWithData && c.removedWithData.length>0;

    return `<div class="modal-overlay" id="modal-overlay"><div class="modal" style="max-width:620px">
      <div class="modal-title">Confirmar resubida del packing list</div>
      <div class="modal-sub">Se detectaron <strong>${totalChanges} cambio${totalChanges!==1?'s':''}</strong>. Revisá antes de confirmar:</div>
      ${hasRemovedWithData?`<div style="padding:10px 12px;background:rgba(240,94,106,0.1);border:1px solid rgba(240,94,106,0.3);border-radius:var(--r);margin-bottom:10px;font-size:12px;color:var(--red)">⚠ <strong>${c.removedWithData.length} posición${c.removedWithData.length!==1?'es':''}</strong> a eliminar tienen datos cargados (avances, controles o lotes). Si confirmás, esos datos se pierden.</div>`:''}
      <div style="max-height:380px;overflow-y:auto">
        ${c.added.length?sectionTitle('Posiciones nuevas','+'+c.added.length,'var(--green)')+`<ul style="list-style:none;padding:0;margin:0">${c.added.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span> <span style="color:var(--text3)">×${p.qty}</span>`)).join('')}</ul>`:''}
        ${c.removed.length?sectionTitle('Posiciones a eliminar','-'+c.removed.length,'var(--red)')+`<ul style="list-style:none;padding:0;margin:0">${c.removed.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom||'—')}</span>${p.hasData?` <span style="color:var(--red);font-weight:600">⚠ con datos</span>`:''}`, p.hasData)).join('')}</ul>`:''}
        ${c.qtyChanged.length?sectionTitle('Cambios de cantidad',c.qtyChanged.length,'var(--amber)')+`<ul style="list-style:none;padding:0;margin:0">${c.qtyChanged.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span> <span style="color:var(--text3)">×${p.oldQty} → ×${p.newQty}</span>`)).join('')}</ul>`:''}
        ${c.modified.length?sectionTitle('Posiciones modificadas',c.modified.length,'var(--accent)')+`<ul style="list-style:none;padding:0;margin:0">${c.modified.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span><br><span style="color:var(--text3);font-size:11px">Campos: ${p.fields.join(', ')}</span>`)).join('')}</ul>`:''}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar resubida</button>
        <button type="button" class="${hasRemovedWithData?'btn-reject':'btn-ok'}" id="btn-reupload-confirm">${hasRemovedWithData?'Confirmar (perderé datos)':'Confirmar resubida'}</button>
      </div>
    </div></div>`;
  }
  if(m.type==='reupload-success'){
    const c=m.changes;
    const totalChanges=c.added.length+c.removed.length+c.modified.length+c.qtyChanged.length;
    const sectionTitle=(label,count,color)=>`<div style="font-family:var(--mono);font-size:10px;color:${color};text-transform:uppercase;letter-spacing:0.1em;margin:14px 0 6px">${label} (${count})</div>`;
    const itemLi=(content)=>`<li style="font-family:var(--mono);font-size:12px;padding:5px 10px;background:var(--bg3);border-radius:var(--r);margin-bottom:4px">${content}</li>`;

    return `<div class="modal-overlay" id="modal-overlay"><div class="modal" style="max-width:600px">
      <div class="modal-title" style="color:var(--green)">✓ Packing list actualizado</div>
      <div class="modal-sub">El Excel se reprocesó correctamente. ${totalChanges===0?'No hubo cambios respecto a la versión anterior.':`Se detectaron <strong>${totalChanges} cambio${totalChanges!==1?'s':''}</strong>:`}</div>
      <div style="max-height:380px;overflow-y:auto">
        ${c.added.length?sectionTitle('Posiciones agregadas','+'+c.added.length,'var(--green)')+`<ul style="list-style:none;padding:0;margin:0">${c.added.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span> <span style="color:var(--text3)">×${p.qty}</span>`)).join('')}</ul>`:''}
        ${c.removed.length?sectionTitle('Posiciones eliminadas','-'+c.removed.length,'var(--red)')+`<ul style="list-style:none;padding:0;margin:0">${c.removed.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom||'—')}</span>`)).join('')}</ul>`:''}
        ${c.qtyChanged.length?sectionTitle('Cambios de cantidad',c.qtyChanged.length,'var(--amber)')+`<ul style="list-style:none;padding:0;margin:0">${c.qtyChanged.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span> <span style="color:var(--text3)">×${p.oldQty} → ×${p.newQty}</span>`)).join('')}</ul>`:''}
        ${c.modified.length?sectionTitle('Posiciones modificadas',c.modified.length,'var(--accent)')+`<ul style="list-style:none;padding:0;margin:0">${c.modified.map(p=>itemLi(`<strong>${esc(p.id)}</strong> <span style="color:var(--text2)">— ${esc(p.denom)}</span><br><span style="color:var(--text3);font-size:11px">Campos: ${p.fields.join(', ')}</span>`)).join('')}</ul>`:''}
        ${totalChanges===0?`<div style="text-align:center;padding:2rem;color:var(--text3);font-family:var(--mono);font-size:12px">No se detectaron diferencias</div>`:''}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ok" id="btn-close">Entendido</button>
      </div>
    </div></div>`;
  }
  if(m.type==='role-select'){
    const currentRole=state.role;
    const opts=ROLES.map(r=>`<option value="${r.id}" ${r.id===currentRole?'selected':''}>${r.label}</option>`).join('');
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Cambiar rol</div>
      <div class="modal-sub">Elegí el rol con el que querés acceder a la aplicación.</div>
      <div class="modal-field"><label>Rol</label>
        <select id="sel-role" style="width:100%;padding:10px 12px;font-size:14px" onchange="document.getElementById('admin-pw-field').style.display=this.value==='admin'?'block':'none'">${opts}</select>
      </div>
      <div class="modal-field" id="admin-pw-field" style="display:${currentRole==='admin'?'block':'none'}">
        <label>Contraseña Admin</label>
        <input id="inp-admin-pw" type="password" placeholder="Ingresá la contraseña"/>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar</button>
        <button type="button" class="btn-ok" id="btn-role-confirm">Confirmar</button>
      </div>
    </div></div>`;
  }
  if(m.type==='new-ot'){
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Nueva OT</div>
      <div class="modal-sub">Se crea una OT en blanco. Los datos del proyecto (nombre, número de OT y cliente) se cargarán automáticamente cuando subas el Excel del packing list.</div>
      <div class="modal-actions"><button type="button" class="btn-cancel" id="btn-close">Cancelar</button><button type="button" class="btn-ok" id="btn-confirm-new-ot">Crear OT</button></div>
    </div></div>`;
  }
  if(m.type==='delete-ot'){
    const ot=activeOt();
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Eliminar OT</div>
      <div class="modal-sub">¿Seguro que querés eliminar la OT <strong>${esc(ot?.info.ot||'')}</strong> — ${esc(ot?.info.proyecto||'')}? Esta acción es irreversible y borrará todos los datos.</div>
      <div class="modal-field"><label>Contraseña de confirmación</label>
        <input id="inp-delete-pw" type="password" placeholder="Ingresá la contraseña" autocomplete="off"/>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar</button>
        <button type="button" class="btn-reject" id="btn-confirm-delete-ot">Eliminar definitivamente</button>
      </div>
    </div></div>`;
  }

  const ot=activeOt();
  const positions=ot?.positions||[];
  const pos=findPos(ot, m.posId);
  if(!pos) return '';
  const ap=pos.activeProc;

  if(m.type==='assign'||m.type==='reassign'){
    const wopts=WORKERS.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Asignar: ${PROCS[ap]}</div>
      <div class="modal-sub">Posición <strong>${esc(pos.id)}</strong> — ${esc(pos.denom)}<br>Plano: ${esc(pos.plano)}</div>
      <div class="modal-field"><label>Responsable</label><select id="sel-w">${wopts}</select></div>
      <div class="modal-actions"><button type="button" class="btn-cancel" id="btn-close">Cancelar</button><button type="button" class="btn-ok" id="btn-confirm-assign">Confirmar</button></div>
    </div></div>`;
  }
  if(m.type==='corregir'){
    const opts=[];
    if(ap>0) opts.push({idx:ap-1,label:PROCS[ap-1],sub:'proceso anterior'});
    if(ap>1) opts.push({idx:ap-2,label:PROCS[ap-2],sub:'dos procesos atrás'});
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Corregir proceso</div>
      <div class="modal-sub">Posición <strong>${esc(pos.id)}</strong> — ${esc(pos.denom)}<br>Proceso actual: <strong>${PROCS[ap]}</strong></div>
      <div class="modal-warn">Se borrarán las asignaciones y aprobaciones desde el proceso seleccionado en adelante.</div>
      <div class="proc-grid">${opts.map(o=>`<div class="proc-opt ${state.corrTarget===o.idx?'sel':''}" data-pidx="${o.idx}"><div class="proc-opt-name">${o.label}</div><div class="proc-opt-sub">${o.sub}</div></div>`).join('')}</div>
      <div class="modal-actions"><button type="button" class="btn-cancel" id="btn-close">Cancelar</button><button type="button" class="btn-corregir" id="btn-confirm-corr" ${state.corrTarget===null?'disabled':''}>Aplicar</button></div>
    </div></div>`;
  }
  if(m.type==='inspect'){
    const pidx=m.procIdx!==undefined?m.procIdx:ap;
    const subIdx=m.subIdx!==undefined?m.subIdx:null;
    const applyAll=m.applyAllSubs&&pos.subs&&pos.subs.length>0;
    const subLabel=applyAll?` — todas las unidades`:subIdx!==null&&pos.subs?` (${pos.subs[subIdx]?.subId||''})`:'' ;
    const showHistory=!applyAll;
    const procForHistory=applyAll?null:getProcesses(pos,subIdx)[pidx];
    const history=procForHistory?.history||[];
    const historyHtml=history.length
      ? history.map(h=>`<div class="history-item">
          <div class="history-meta"><span class="history-author">${esc(h.author||'—')}</span><span>${esc(h.date||'')}</span>${historyTag(h.action)}</div>
          <div class="history-text">${esc(h.text||'(sin observaciones)')}</div>
        </div>`).join('')
      : `<div class="history-empty">Sin controles previos</div>`;
    const useInspector = state.role==='calidad' && state.inspectorActivo;
    const authorField = useInspector
      ? `<div class="modal-field"><label>Inspector</label>
          <div style="padding:8px 12px;background:var(--bg3);border-radius:var(--r);font-family:var(--mono);font-size:13px;color:var(--green)">👤 ${esc(state.inspectorActivo.nombre)}</div>
         </div>`
      : `<div class="modal-field"><label>Inspector</label>
          ${state.role==='calidad'&&state.inspectorActivo
            ? `<div style="padding:8px 12px;background:var(--bg3);border-radius:var(--r);font-family:var(--mono);font-size:13px;color:var(--green)">👤 ${esc(state.inspectorActivo.nombre)}</div>`
            : `<input id="inp-author" type="text" placeholder="Tu nombre" value="${esc(state.lastAuthor||'')}"/>`}
         </div>`;
    const isPIN = pidx===2;
    const lotes=ot.lotes||[];
    const loteOpts=lotes.map(l=>`<option value="${esc(l.id)}">${esc(l.nombre)}</option>`).join('');
    const loteSection = isPIN ? `
      <div class="modal-field"><label>Lote de pintura</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div style="flex:1;min-width:160px">
            <input id="inp-lote-nuevo" type="text" placeholder="Nuevo lote (ej: L-001)" value="" style="margin-bottom:6px"/>
            <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px">— o asignar a existente —</div>
            <select id="sel-lote-existente" style="width:100%">
              <option value="">Seleccionar lote existente…</option>
              ${loteOpts}
            </select>
          </div>
        </div>
      </div>` : `
      <div class="modal-field"><label>Observaciones (opcional)</label>
        <textarea id="inp-obs" rows="3" style="resize:vertical" placeholder="Comentarios sobre el control"></textarea>
      </div>`;
    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Inspección: ${PROCS[pidx]}</div>
      <div class="modal-sub">Posición <strong>${esc(pos.id)}${esc(subLabel)}</strong> — ${esc(pos.denom)}
        ${applyAll?`<br><span style="color:var(--amber);font-family:var(--mono);font-size:11px">Se aplicará a las ${pos.subs.length} unidades</span>`:''}
      </div>
      ${showHistory?`<div class="modal-field"><label>Historial de controles</label><div class="history-list">${historyHtml}</div></div>`:''}
      ${authorField}
      ${loteSection}
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar</button>
        ${!isPIN?`<button type="button" class="btn-partial" id="btn-do-partial">Control parcial</button>`:''}
        <button type="button" class="btn-reject" id="btn-do-reject">Rechazar</button>
        <button type="button" class="btn-approve" id="btn-do-approve">Aprobar</button>
      </div>
    </div></div>`;
  }
  if(m.type==='modificar'){
    const pidx=m.procIdx;
    const subIdx=m.subIdx!==undefined?m.subIdx:null;
    const processes=getProcesses(pos,subIdx);
    const proc=processes[pidx];
    const subLabel=subIdx!==null&&pos.subs?` (${pos.subs[subIdx]?.subId||''})`:'' ;
    const estadoActual=proc.status==='approved'?'Aprobado':'Rechazado';
    const estadoActualCls=proc.status==='approved'?'color:var(--green)':'color:var(--red)';
    const history=proc.history||[];
    const editIdx=m.editHistoryIdx!==undefined?m.editHistoryIdx:null;

    const historyHtml=history.length
      ? history.map((h,i)=>{
          
          
          if(editIdx===i){
            return `<div class="history-item" style="background:var(--bg4)">
              <div class="history-meta"><span class="history-author">${esc(h.author||'—')}</span><span>${esc(h.date||'')}</span>${historyTag(h.action)}</div>
              <textarea id="inp-edit-obs" rows="2" style="width:100%;resize:vertical;margin-top:4px;font-size:12px">${esc(h.text||'')}</textarea>
              <div style="display:flex;gap:6px;margin-top:6px">
                <button type="button" class="abtn" id="btn-save-edit" style="font-size:11px">Guardar</button>
                <button type="button" class="abtn" id="btn-cancel-edit" style="font-size:11px">Cancelar</button>
              </div>
            </div>`;
          }
          return `<div class="history-item" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="flex:1">
              <div class="history-meta"><span class="history-author">${esc(h.author||'—')}</span><span>${esc(h.date||'')}</span>${historyTag(h.action)}</div>
              <div class="history-text">${esc(h.text||'(sin observaciones)')}</div>
            </div>
            <button type="button" class="abtn" style="font-size:10px;flex-shrink:0" data-edit-idx="${i}">Editar</button>
          </div>`;
        }).join('')
      : `<div class="history-empty">Sin historial</div>`;

    return `<div class="modal-overlay" id="modal-overlay"><div class="modal">
      <div class="modal-title">Modificar inspección: ${PROCS[pidx]}</div>
      <div class="modal-sub">Posición <strong>${esc(pos.id)}${esc(subLabel)}</strong> — ${esc(pos.denom)}<br>
        Estado actual: <strong style="${estadoActualCls}">${estadoActual}</strong>
      </div>
      <div class="modal-field"><label>Historial</label>
        <div class="history-list">${historyHtml}</div>
      </div>
      ${editIdx===null?`
      <div class="modal-field"><label>Inspector</label>
        ${state.role==='calidad'&&state.inspectorActivo
          ? `<div style="padding:8px 12px;background:var(--bg3);border-radius:var(--r);font-family:var(--mono);font-size:13px;color:var(--green)">👤 ${esc(state.inspectorActivo.nombre)}</div>`
          : `<input id="inp-author" type="text" placeholder="Tu nombre" value="${esc(state.lastAuthor||'')}"/>`}
      </div>
      <div class="modal-field"><label>Nueva observación</label>
        <textarea id="inp-obs" rows="2" style="resize:vertical" placeholder="Agregar comentario al historial…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btn-close">Cancelar</button>
        <button type="button" class="btn-ok" id="btn-mod-save">Agregar observación</button>
        ${proc.status==='approved'
          ? `<button type="button" class="btn-reject" id="btn-mod-reject">Cambiar a Rechazado</button>`
          : `<button type="button" class="btn-approve" id="btn-mod-approve">Cambiar a Aprobado</button>`
        }
        <button type="button" class="btn-anular" id="btn-mod-anular">Anular control</button>
      </div>`:''}
    </div></div>`;
  }
  return '';
}

// ── PINTURA VIEW ──────────────────────────────────────────
function renderPinturaView(ot){
  if(!ot||!ot.plPublished){
    return `<div class="topbar"><div><div class="topbar-title">Pintura</div></div></div>
    <div class="content"><div class="empty"><div class="empty-title">Sin packing list publicado</div></div></div>`;
  }
  const pi=ot.info;
  const lotes=ot.lotes||[];
  const positions=ot.positions||[];
  const filterLote=state.filters.filterLote||'';
  const loteOpts=[...lotes].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es',{numeric:true}));
  const selectedLote=filterLote?lotes.find(l=>l.id===filterLote):null;

  // build lote list
  const loteListHtml = loteOpts.length===0
    ? `<div style="text-align:center;padding:2rem 1rem;color:var(--text3);font-family:var(--mono);font-size:12px">Los lotes se crean al inspeccionar PIN en Posiciones.</div>`
    : loteOpts.map(l=>{
        let totalUnits=0,rejUnits=0;
        (l.posIds||[]).forEach(pid=>{
          totalUnits++;
          const p=positions.find(x=>x.uid===pid)||positions.find(x=>x.id===pid);
          // if position has subs, aggregate from subs
          if(p && p.subs && p.subs.length>0){
            const subEstados=p.subs.map(s=>{
              const spid=`${pid}::${s.subId}`;
              return l.subPosEstados?.[spid]||'pendiente';
            });
            if(subEstados.some(e=>e==='rechazado')) rejUnits++;
          } else {
            if((l.posEstados?.[pid]||'pendiente')==='rechazado') rejUnits++;
          }
        });
        (l.subPosIds||[]).forEach(spid=>{totalUnits++;if((l.subPosEstados?.[spid]||'pendiente')==='rechazado') rejUnits++;});
        const isSelected=l.id===filterLote;
        const estadoColor=l.estado==='aprobado'?'var(--green)':l.estado==='rechazado'?'var(--red)':'var(--amber)';
        const estadoLabel=l.estado==='aprobado'?'Aprobado':l.estado==='rechazado'?'Rechazado':'Pendiente';
        const hasMedidas=l.min||l.max||l.promedio;
        // count PENDING observations (not yet "raised")
        // pos obs: only count if the position is NOT aprobada
        // sub obs: only count if the sub is NOT aprobada
        // historial notes: only count if not levantada
        let pendingObsCount=0;
        if(l.posObs){
          Object.entries(l.posObs).forEach(([pid,v])=>{
            if(!v || !String(v).trim()) return;
            // determine effective state of this position (considering subs aggregate)
            const p=positions.find(x=>x.uid===pid)||positions.find(x=>x.id===pid);
            let eff='pendiente';
            if(p && p.subs && p.subs.length>0){
              const sEsts=p.subs.map(s=>l.subPosEstados?.[`${pid}::${s.subId}`]||'pendiente');
              eff = sEsts.every(e=>e==='aprobado') ? 'aprobado'
                  : sEsts.some(e=>e==='rechazado') ? 'rechazado' : 'pendiente';
            } else {
              eff=l.posEstados?.[pid]||'pendiente';
            }
            if(eff!=='aprobado') pendingObsCount++;
          });
        }
        if(l.subPosObs){
          Object.entries(l.subPosObs).forEach(([spid,v])=>{
            if(!v || !String(v).trim()) return;
            const sEst=l.subPosEstados?.[spid]||'pendiente';
            if(sEst!=='aprobado') pendingObsCount++;
          });
        }
        if(l.historial) pendingObsCount+=l.historial.filter(h=>h.action==='note' && !h.levantada).length;
        return `<div style="border-radius:var(--r2);border:1.5px solid ${isSelected?'var(--accent)':'var(--border)'};overflow:hidden;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;background:var(--bg2)" data-sel-lote="${esc(l.id)}">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)">${esc(l.nombre)}</span>
                <span style="font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid ${estadoColor};color:${estadoColor}">${estadoLabel}</span>
                ${rejUnits>0?`<span style="font-family:var(--mono);font-size:10px;color:var(--red)">⚠ ${rejUnits} rechazada${rejUnits!==1?'s':''}</span>`:''}
                ${pendingObsCount>0?`<span style="font-family:var(--mono);font-size:10px;color:var(--amber);background:rgba(255,178,77,0.12);padding:2px 8px;border-radius:20px;border:1px solid rgba(255,178,77,0.3)" title="Observaciones pendientes de levantar">⚠ ${pendingObsCount} obs. pendiente${pendingObsCount!==1?'s':''}</span>`:''}
              </div>
              <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:3px">${totalUnits} unidad${totalUnits!==1?'es':''} · ${esc(l.fecha)}${hasMedidas?` · Mín:${l.min||'—'} Máx:${l.max||'—'} Prom:${l.promedio||'—'}`:''}</div>
            </div>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="flex-shrink:0;margin-left:8px;transform:${isSelected?'rotate(90deg)':'rotate(0)'};transition:transform 0.2s"><path d="M7 5l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          ${isSelected ? renderLoteDetalle(l, positions) : ''}
        </div>`;
      }).join('');

  const canEditPintura = state.role==='calidad' || state.role==='admin';
  const newLoteBtn = canEditPintura
    ? `<button type="button" class="btn-ok" id="btn-nuevo-lote" style="padding:8px 16px;font-size:13px">+ Nuevo lote</button>`
    : '';

  return `<div class="topbar">
    <div><div class="topbar-title">Pintura</div><div class="topbar-meta">OT ${esc(pi.ot)} · ${esc(pi.proyecto||'')}</div></div>
    ${newLoteBtn}
  </div>
  <div class="content">
    <div style="max-width:720px">${loteListHtml}</div>
  </div>`;
}

function renderLoteDetalle(l, positions){
  // metrics
  // ── CAPAS DE MEDICIÓN ──
  // Migrate old min/max/promedio fields to the first capa if no capas exist yet
  if(!Array.isArray(l.capas)){
    if(l.min || l.max || l.promedio){
      l.capas = [{
        id: 'capa_'+Date.now(),
        nombre: 'Primer capa',
        min: l.min||'',
        max: l.max||'',
        promedio: l.promedio||'',
        fecha: l.fecha || nowStr(),
      }];
    } else {
      l.capas = [];
    }
  }

  const canEditMeasures = state.role==='calidad' || state.role==='admin';

  const capasHtml = l.capas.length>0
    ? l.capas.map((c, ci)=>{
        const inputAttrs = canEditMeasures ? '' : 'readonly disabled';
        const inputStyle = `width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:6px 8px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)${!canEditMeasures?';opacity:0.75':''}`;
        const deleteBtn = canEditMeasures
          ? `<button type="button" class="abtn" style="font-size:10px;color:var(--text3);border-color:rgba(120,120,120,0.3);padding:3px 8px" data-lote-capa-borrar="${esc(l.id)}" data-capa-id="${esc(c.id)}" title="Borrar capa">✕</button>`
          : '';
        const nombreInput = canEditMeasures
          ? `<input type="text" class="lote-capa-nombre" data-lote-id="${esc(l.id)}" data-capa-id="${esc(c.id)}" value="${esc(c.nombre||'')}" style="background:transparent;border:none;font-family:var(--mono);font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;padding:0;width:auto;min-width:90px;max-width:160px" placeholder="Nombre"/>`
          : `<span style="font-family:var(--mono);font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;font-weight:700">${esc(c.nombre||'Capa '+(ci+1))}</span>`;
        return `<div style="padding:10px 14px;background:var(--bg3);border-top:1px solid var(--border)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px">
            <div style="display:flex;align-items:center;gap:8px">
              ${nombreInput}
              ${c.fecha?`<span style="font-family:var(--mono);font-size:10px;color:var(--text3)">${esc(c.fecha)}</span>`:''}
            </div>
            ${deleteBtn}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
            <div>
              <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Mín. medido</div>
              <input type="text" class="lote-capa-input" data-lote-id="${esc(l.id)}" data-capa-id="${esc(c.id)}" data-metric="min" value="${esc(c.min||'')}" placeholder="—" style="${inputStyle}" ${inputAttrs}/>
            </div>
            <div>
              <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Máx. medido</div>
              <input type="text" class="lote-capa-input" data-lote-id="${esc(l.id)}" data-capa-id="${esc(c.id)}" data-metric="max" value="${esc(c.max||'')}" placeholder="—" style="${inputStyle}" ${inputAttrs}/>
            </div>
            <div>
              <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Prom. medido</div>
              <input type="text" class="lote-capa-input" data-lote-id="${esc(l.id)}" data-capa-id="${esc(c.id)}" data-metric="promedio" value="${esc(c.promedio||'')}" placeholder="—" style="${inputStyle}" ${inputAttrs}/>
            </div>
          </div>
        </div>`;
      }).join('')
    : `<div style="padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--text3);background:var(--bg3);border-top:1px solid var(--border)">Sin mediciones registradas</div>`;

  const addCapaBtn = canEditMeasures
    ? `<div style="padding:8px 14px;background:var(--bg3);border-top:1px solid var(--border)">
        <button type="button" class="abtn" style="font-size:11px" data-lote-capa-agregar="${esc(l.id)}">+ Agregar capa</button>
      </div>`
    : '';

  const metrics = capasHtml + addCapaBtn;

  const canEditLote = state.role==='calidad' || state.role==='admin';

  // actions
  const actions=`<div style="display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--bg3);border-top:1px solid var(--border)">
    ${canEditLote?`<button type="button" class="abtn" style="color:var(--accent);border-color:rgba(79,142,247,0.3)" data-lote-agregar-piezas="${esc(l.id)}">+ Agregar piezas</button>`:''}
    <button type="button" class="abtn" data-lote-accion="obs" data-lote-id="${esc(l.id)}">+ Observación</button>
    ${l.estado!=='aprobado'?`<button type="button" class="abtn" style="color:var(--green);border-color:rgba(62,207,122,0.3)" data-lote-accion="aprobar" data-lote-id="${esc(l.id)}">Aprobar lote</button>`:''}
    ${l.estado!=='rechazado'?`<button type="button" class="abtn" style="color:var(--red);border-color:rgba(240,94,106,0.3)" data-lote-accion="rechazar" data-lote-id="${esc(l.id)}">Rechazar lote</button>`:''}
    <button type="button" class="abtn" style="color:var(--text3);border-color:rgba(120,120,120,0.3)" data-lote-accion="borrar" data-lote-id="${esc(l.id)}">Borrar</button>
  </div>`;

  // ── BUILD position display structure ──
  // Group loose subs (from subPosIds) by their parent so they show under a single header
  // Sub-positions from subPosIds keep their parent grouping; sub-positions from posIds-entry are also grouped

  // map parentId -> { p, viaPosIds:bool, subsInLote:[subId,...]|null }
  const groups = new Map();
  (l.posIds||[]).forEach(pid=>{
    const p=positions.find(x=>x.uid===pid)||positions.find(x=>x.id===pid); if(!p) return;
    // when assigned via posIds, all subs are in the lote (if any)
    groups.set(pid, {p, parentKey:pid, viaPosIds:true, subsInLote: p.subs ? p.subs.map(s=>s.subId) : null});
  });
  (l.subPosIds||[]).forEach(spid=>{
    const [parentKey,subId]=spid.split('::');
    const p=positions.find(x=>x.uid===parentKey)||positions.find(x=>x.id===parentKey); if(!p) return;
    const existing = groups.get(parentKey);
    if(existing){
      // already grouped (either via posIds or via earlier sub); add this sub
      if(!existing.subsInLote) existing.subsInLote=[];
      if(!existing.subsInLote.includes(subId)) existing.subsInLote.push(subId);
    } else {
      groups.set(parentKey, {p, parentKey, viaPosIds:false, subsInLote:[subId]});
    }
  });

  const posRowsArr=[];
  groups.forEach((g, pid)=>{
    const p = g.p;
    const qty=Number(p.qty)||1;
    const subsInLote = g.subsInLote||[];
    const hasSubs = subsInLote.length>0;
    // if only one sub and qty=1, treat as simple position
    const treatAsSimple = !hasSubs;
    const expandKey=`lotePos__${l.id}__${pid}`;
    // auto-expand if any sub has obs pending or if user has expanded
    const isExpanded=!!state.expanded[expandKey];

    // aggregate state
    let est, estColor, estLabel, obs;
    if(hasSubs){
      const subEstados=subsInLote.map(sid=>l.subPosEstados?.[`${pid}::${sid}`]||'pendiente');
      const allOk=subEstados.every(e=>e==='aprobado');
      const anyRej=subEstados.some(e=>e==='rechazado');
      est=allOk?'aprobado':anyRej?'rechazado':'pendiente';
      estColor=allOk?'var(--green)':anyRej?'var(--red)':'var(--text3)';
      const okCount=subEstados.filter(e=>e==='aprobado').length;
      const rejCount=subEstados.filter(e=>e==='rechazado').length;
      const pendCount=subEstados.filter(e=>e==='pendiente').length;
      estLabel=`<span style="color:var(--green)">${okCount}✓</span> · <span style="color:var(--red)">${rejCount}✗</span> · <span style="color:var(--text3)">${pendCount}⏳</span>`;
      obs=l.posObs?.[pid]||'';
    } else {
      est=l.posEstados?.[pid]||'pendiente';
      estColor=est==='aprobado'?'var(--green)':est==='rechazado'?'var(--red)':'var(--text3)';
      estLabel=est==='aprobado'?'✓ Aprobado':est==='rechazado'?'✗ Rechazado':'Pendiente';
      obs=l.posObs?.[pid]||'';
    }

    const expandBtn=hasSubs?`<button type="button" class="expand-btn ${isExpanded?'open':''}" data-expand-lote-pos="${esc(expandKey)}" style="margin-right:6px"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`:'';

    // header info: if not all subs are in lote, show "X de N unidades"
    const subsCountInfo = hasSubs
      ? (g.viaPosIds && subsInLote.length===(p.subs?.length||0)
          ? `×${subsInLote.length}`
          : `${subsInLote.length} de ${qty}`)
      : `×${qty}`;

    const editingButtons = canEditLote ? (hasSubs?`
      <button type="button" class="abtn" style="font-size:11px" data-lote-pos-obs="${esc(l.id)}" data-pos-id="${esc(pid)}">Obs. lote</button>
      <button type="button" class="abtn" style="font-size:11px;color:var(--green);border-color:rgba(62,207,122,0.3)" data-lote-pos-est-all="${esc(l.id)}" data-pos-id="${esc(pid)}" data-est="aprobado" title="Aprobar todas las unidades de este lote">✓ Todas</button>
      <button type="button" class="abtn" style="font-size:11px;color:var(--red);border-color:rgba(240,94,106,0.3)" data-lote-pos-est-all="${esc(l.id)}" data-pos-id="${esc(pid)}" data-est="rechazado" title="Rechazar todas las unidades de este lote">✗ Todas</button>
      <button type="button" class="abtn" style="font-size:11px;color:var(--text3);border-color:rgba(120,120,120,0.3)" data-lote-pos-quitar="${esc(l.id)}" data-pos-id="${esc(pid)}" title="Quitar todas las unidades de este lote">Borrar</button>
    `:`
      <button type="button" class="abtn" style="font-size:11px" data-lote-pos-obs="${esc(l.id)}" data-pos-id="${esc(pid)}">Obs.</button>
      ${est!=='aprobado'?`<button type="button" class="abtn" style="font-size:11px;color:var(--green);border-color:rgba(62,207,122,0.3)" data-lote-pos-est="${esc(l.id)}" data-pos-id="${esc(pid)}" data-est="aprobado">✓</button>`:''}
      ${est!=='rechazado'?`<button type="button" class="abtn" style="font-size:11px;color:var(--red);border-color:rgba(240,94,106,0.3)" data-lote-pos-est="${esc(l.id)}" data-pos-id="${esc(pid)}" data-est="rechazado">✗</button>`:''}
      <button type="button" class="abtn" style="font-size:11px;color:var(--text3);border-color:rgba(120,120,120,0.3)" data-lote-pos-quitar="${esc(l.id)}" data-pos-id="${esc(pid)}" title="Quitar del lote">Borrar</button>
    `) : '';

    const obsPending = obs && est!=='aprobado';
    const rowStyle = obsPending
      ? 'padding:10px 14px;border-top:1px solid var(--border);background:var(--bg2);border-left:3px solid var(--amber)'
      : 'padding:10px 14px;border-top:1px solid var(--border);background:var(--bg2)';
    const obsStyle = obsPending
      ? 'font-size:12px;color:var(--amber);margin-bottom:6px;font-style:italic;font-weight:600;background:rgba(255,178,77,0.08);padding:6px 10px;border-radius:var(--r);border:1px solid rgba(255,178,77,0.2)'
      : 'font-size:12px;color:var(--text2);margin-bottom:6px;font-style:italic';
    const obsPrefix = obsPending ? '⚠ ' : '';

    posRowsArr.push(`<div style="${rowStyle}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px">
        <div style="display:flex;align-items:center">
          ${expandBtn}
          <span style="font-family:var(--mono);font-size:13px;font-weight:700">${esc(p.id)}</span>
          <span style="font-size:12px;color:var(--text2);margin-left:8px">${esc(p.denom)}</span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:6px">${subsCountInfo}</span>
        </div>
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:${estColor}">${estLabel}</span>
      </div>
      ${obs?`<div style="${obsStyle}">${obsPrefix}"${esc(obs)}"</div>`:''}
      ${editingButtons?`<div class="abtn-group">${editingButtons}</div>`:''}
    </div>`);

    // expanded sub-positions — ONLY those in the lote
    if(hasSubs && isExpanded){
      subsInLote.forEach(sid=>{
        const sub = p.subs?.find(s=>s.subId===sid);
        if(!sub) return;
        const spid=`${pid}::${sid}`;
        const sEst=l.subPosEstados?.[spid]||'pendiente';
        const sColor=sEst==='aprobado'?'var(--green)':sEst==='rechazado'?'var(--red)':'var(--text3)';
        const sLabel=sEst==='aprobado'?'✓ Aprobado':sEst==='rechazado'?'✗ Rechazado':'Pendiente';
        const sObs=l.subPosObs?.[spid]||'';
        const subObsPending = sObs && sEst!=='aprobado';
        const subRowStyle = subObsPending
          ? 'padding:8px 14px 8px 42px;border-top:1px solid var(--border);background:var(--bg3);border-left:3px solid var(--amber)'
          : 'padding:8px 14px 8px 42px;border-top:1px solid var(--border);background:var(--bg3)';
        const subObsStyle = subObsPending
          ? 'font-size:11px;color:var(--amber);margin-bottom:6px;font-style:italic;font-weight:600;background:rgba(255,178,77,0.08);padding:5px 8px;border-radius:var(--r);border:1px solid rgba(255,178,77,0.2)'
          : 'font-size:11px;color:var(--text2);margin-bottom:6px;font-style:italic';
        const subObsPrefix = subObsPending ? '⚠ ' : '';

        const subEditButtons = canEditLote ? `
          <button type="button" class="abtn" style="font-size:11px" data-lote-sub-obs="${esc(l.id)}" data-spid="${esc(spid)}">Obs.</button>
          ${sEst!=='aprobado'?`<button type="button" class="abtn" style="font-size:11px;color:var(--green);border-color:rgba(62,207,122,0.3)" data-lote-sub-est="${esc(l.id)}" data-spid="${esc(spid)}" data-est="aprobado">✓</button>`:''}
          ${sEst!=='rechazado'?`<button type="button" class="abtn" style="font-size:11px;color:var(--red);border-color:rgba(240,94,106,0.3)" data-lote-sub-est="${esc(l.id)}" data-spid="${esc(spid)}" data-est="rechazado">✗</button>`:''}
          <button type="button" class="abtn" style="font-size:11px;color:var(--text3);border-color:rgba(120,120,120,0.3)" data-lote-sub-quitar="${esc(l.id)}" data-spid="${esc(spid)}" data-parent-id="${esc(pid)}" title="Quitar del lote">Borrar</button>
        ` : '';

        posRowsArr.push(`<div style="${subRowStyle}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px">
            <div>
              <span style="font-family:var(--mono);font-size:12px;color:var(--accent2)">↳ ${esc(sub.subId)}</span>
            </div>
            <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:${sColor}">${sLabel}</span>
          </div>
          ${sObs?`<div style="${subObsStyle}">${subObsPrefix}"${esc(sObs)}"</div>`:''}
          ${subEditButtons?`<div class="abtn-group">${subEditButtons}</div>`:''}
        </div>`);
      });
    }
  });

  // historial
  const histHtml=(l.historial||[]).length
    ? (l.historial||[]).map((h,hidx)=>{
        const isNote=h.action==='note';
        const isPending=isNote && !h.levantada;
        const itemStyle = isPending
          ? 'margin:0;border-radius:0;border-bottom:1px solid var(--border);border-left:3px solid var(--amber);background:rgba(255,178,77,0.05)'
          : h.levantada
            ? 'margin:0;border-radius:0;border-bottom:1px solid var(--border);opacity:0.55'
            : 'margin:0;border-radius:0;border-bottom:1px solid var(--border)';
        return `<div class="history-item" style="${itemStyle}">
          <div class="history-meta">
            <span class="history-author">${esc(h.author||'—')}</span>
            <span>${esc(h.date||'')}</span>
            ${historyTag(h.action)}
            ${isPending?'<span style="font-family:var(--mono);font-size:10px;color:var(--amber);font-weight:600">⚠ PENDIENTE</span>':''}
            ${h.levantada?`<span style="font-family:var(--mono);font-size:10px;color:var(--green);font-weight:600">✓ LEVANTADA</span>`:''}
          </div>
          <div class="history-text"${h.levantada?' style="text-decoration:line-through"':''}>${esc(h.text||'—')}</div>
          ${h.min||h.max||h.promedio?`<div style="font-family:var(--mono);font-size:10px;color:var(--text3)">Mín:${h.min||'—'} Máx:${h.max||'—'} Prom:${h.promedio||'—'}</div>`:''}
          ${h.levantada?`<div style="font-family:var(--mono);font-size:10px;color:var(--green);margin-top:4px">Levantada por ${esc(h.levantadaPor||'—')} el ${esc(h.levantadaFecha||'—')}</div>`:''}
          ${isPending?`<div style="margin-top:8px"><button type="button" class="abtn" style="font-size:11px;color:var(--green);border-color:rgba(62,207,122,0.3)" data-lote-obs-levantar="${esc(l.id)}" data-hidx="${hidx}">✓ Levantar</button></div>`:''}
        </div>`;
      }).join('')
    : `<div style="padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--text3);border-top:1px solid var(--border)">Sin historial</div>`;

  return `
    ${metrics}
    ${actions}
    ${posRowsArr.length?`<div style="border-top:1px solid var(--border)">
      <div style="padding:8px 14px;font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;background:var(--bg3)">Posiciones (${posRowsArr.length})</div>
      ${posRowsArr.join('')}
    </div>`:''}
    <div style="border-top:1px solid var(--border)">
      <div style="padding:8px 14px;font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;background:var(--bg3)">Historial</div>
      ${histHtml}
    </div>`;
}
